# G.0.13 / #419: fail-closed secret scanning.
# No org gitleaks pattern exists; this uses the OSS CLI (same pin-and-install
# style as Trivy in supply-chain.yml). Do not use gitleaks-action — that
# requires a Gitleaks license for organizations.
# Hard line: never print secret values ( --redact + report field strip ).
#
# Scan scope depends on the event (#605):
# - pull_request: only the PR's own commits (head, excluding everything on the
#   base branch), so a finding on some other branch can't fail an unrelated PR.
# - push to main: the full history reachable from the pushed main commit.
# - schedule / workflow_dispatch: the full history of every branch, so a stray
#   secret on any branch is still surfaced, without blocking PRs.
# Every mode fails closed: an unresolvable range or a gitleaks/git error fails
# the job instead of passing on "0 commits scanned".
#
# gitleaks reads history with `git log -p`, which omits merge-commit diffs, so
# a secret that exists only in a hand-edited conflict resolution would never
# be scanned (#619). Every mode therefore adds --diff-merges=first-parent to
# the log options, so each merge is scanned as its diff against its first
# parent. scripts/check-merge-diff-scan.sh proves on every run that the pinned
# gitleaks reports such a secret on the merge commit, and fails the job if not.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 09:17 UTC — full all-branch history scan.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Makes git log emit merge-commit diffs (#619). Used by the scan and by
      # the check step that proves gitleaks reports a leak found only there.
      MERGE_DIFF_OPTS: "--diff-merges=first-parent"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse tracked env backups
        run: |
          set -euo pipefail
          tracked="$(git ls-files -- '.env' '.env.bak' 'env.bak' '*.env.bak' '.env.*' | grep -Ev '^\.env\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "Tracked env / env.bak files are forbidden:" >&2
            echo "$tracked" >&2
            exit 1
          fi
          echo "No tracked .env or .env.bak files."

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Check merge diffs are scanned
        env:
          GITLEAKS_BIN: gitleaks
        run: bash scripts/check-merge-diff-scan.sh

      - name: Scan git history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks-report.json"
          log="${RUNNER_TEMP}/gitleaks.log"
          echo "GITLEAKS_REPORT=${report}" >> "$GITHUB_ENV"

          # Resolve a commit or fail closed. gitleaks itself exits 0 when git
          # rejects --log-opts ("0 commits scanned"), so never rely on it.
          need_commit() {
            if [ -z "${2:-}" ] || ! git rev-parse --verify --quiet "${2}^{commit}" >/dev/null; then
              echo "::error::secret-scan: cannot resolve $1 ('${2:-}'); refusing to pass." >&2
              exit 1
            fi
          }

          # MERGE_DIFF_OPTS is a log option, not a rev-list option, so it is
          # added to the gitleaks log options after the commits are counted.
          if [ -z "${MERGE_DIFF_OPTS:-}" ]; then
            echo "::error::secret-scan: MERGE_DIFF_OPTS is empty; merge diffs would be skipped." >&2
            exit 1
          fi
          log_opts=""
          case "$EVENT_NAME" in
            pull_request)
              need_commit "pull_request.head.sha" "$PR_HEAD_SHA"
              need_commit "pull_request.base.sha" "$PR_BASE_SHA"
              need_commit "origin/${PR_BASE_REF}" "refs/remotes/origin/${PR_BASE_REF}"
              # The PR's own commits: reachable from the PR head but not from
              # the base commit or the current base branch tip (base commits
              # merged into the PR branch are excluded; main has its own scan).
              log_opts="${PR_HEAD_SHA} --not ${PR_BASE_SHA} refs/remotes/origin/${PR_BASE_REF}"
              # shellcheck disable=SC2086
              count="$(git rev-list --count ${log_opts})"
              echo "Scan mode: pull request range ${PR_BASE_SHA}..${PR_HEAD_SHA} (base ${PR_BASE_REF}), ${count} commit(s), including merge-commit diffs."
              ;;
            push)
              need_commit "pushed commit" "$PUSH_SHA"
              log_opts="${PUSH_SHA}"
              count="$(git rev-list --count "${PUSH_SHA}")"
              echo "Scan mode: full history of ${PUSH_SHA}, ${count} commit(s), including merge-commit diffs."
              ;;
            schedule|workflow_dispatch)
              # gitleaks' own defaults, spelled out because --log-opts
              # replaces them.
              log_opts="--full-history --all --diff-filter=tuxdb"
              count="$(git rev-list --count --all)"
              echo "Scan mode: full history of all branches, ${count} commit(s), including merge-commit diffs."
              ;;
            *)
              echo "::error::secret-scan: unsupported event '${EVENT_NAME}'; refusing to pass." >&2
              exit 1
              ;;
          esac
          echo "gitleaks --log-opts: ${log_opts} ${MERGE_DIFF_OPTS}"
          echo "- secret-scan mode for \`${EVENT_NAME}\`: ${count} commit(s) in scope" >> "$GITHUB_STEP_SUMMARY"

          args=(git
            --config .gitleaks.toml
            --redact
            --verbose
            --no-banner
            --exit-code 1
            --report-format json
            --report-path "$report"
            --log-opts "${log_opts} ${MERGE_DIFF_OPTS}")

          # Fail closed (exit 1 on findings). --redact keeps values out of logs.
          status=0
          gitleaks "${args[@]}" 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          # A git error inside gitleaks still exits 0; treat it as a failure.
          if sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -Eq '^[^[:space:]]+ ERR '; then
            echo "::error::secret-scan: gitleaks reported an error; refusing to pass." >&2
            exit 1
          fi

      - name: Upload redacted gitleaks report
        if: always() && env.GITLEAKS_REPORT != ''
        run: |
          set -euo pipefail
          python3 - "${GITLEAKS_REPORT}" "${RUNNER_TEMP}/gitleaks-report.redacted.json" <<'PY'
          import json
          import sys

          src, dest = sys.argv[1], sys.argv[2]
          try:
              with open(src, encoding="utf-8") as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = []
          if not isinstance(data, list):
              data = []
          clean = []
          for row in data:
              if not isinstance(row, dict):
                  continue
              clean.append({
                  "RuleID": row.get("RuleID"),
                  "File": row.get("File"),
                  "StartLine": row.get("StartLine"),
                  "EndLine": row.get("EndLine"),
                  "Commit": row.get("Commit"),
                  "Fingerprint": row.get("Fingerprint"),
                  "Description": row.get("Description"),
              })
          with open(dest, "w", encoding="utf-8") as f:
              json.dump(clean, f, indent=2)
              f.write("\n")
          print(f"redacted findings: {len(clean)}")
          PY
        env:
          GITLEAKS_REPORT: ${{ env.GITLEAKS_REPORT }}

      - name: Publish gitleaks report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.redacted.json
          if-no-files-found: ignore
