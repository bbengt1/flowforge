# E1.3: provenance, vulnerability, and restore-rehearsal gates.
# Policy: deploy/supply-chain/policy.md
# E12.1 provenance domain: this workflow's govulncheck + image-scan jobs
# stay required; the named suite re-runs approved-bases / deploy-defaults /
# govulncheck fixtures (see .github/workflows/e12-security.yml).
name: supply-chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Approved bases and deploy defaults
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check approved Dockerfile bases
        run: bash scripts/check-approved-bases.sh
      - name: Check deployment hardening defaults
        run: bash scripts/check-deploy-defaults.sh
      - name: Check govulncheck gate fixtures
        run: |
          python3 scripts/govulncheck-gate.py scripts/testdata/govulncheck-clean.json
          if python3 scripts/govulncheck-gate.py scripts/testdata/govulncheck-reject.json; then
            echo "expected third-party finding to fail the gate" >&2
            exit 1
          fi

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: apps/api/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: |
          govulncheck -format json ./... > "${RUNNER_TEMP}/govulncheck.json" || true
          python3 "${GITHUB_WORKSPACE}/scripts/govulncheck-gate.py" "${RUNNER_TEMP}/govulncheck.json"

  # G.0.8 / #414: PostgreSQL so TEST_DATABASE_URL-gated integration tests
  # run. Coverage is published (artifact + job-log / step summary). No
  # coverage threshold — none exists in-repo; do not invent a harsh gate.
  # gofmt / go vet / golangci-lint live in api-quality.yml (#408 / G.0.5).
  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
          POSTGRES_DB: flowforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://flowforge:flowforge@127.0.0.1:5432/flowforge?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: apps/api/go.sum
      # Shared TEST_DATABASE_URL: serialize packages so parallel
      # integration tests cannot collide on tenants/roles. e12-security
      # does the same. The postgres package's restore rehearsal drops
      # flowforge_app (DROP OWNED BY / DROP ROLE); that is cluster-global
      # and revokes INSERT from in-flight opsconfig/vault tests, which
      # map 42501 to "not found".
      - name: Test with coverage
        run: go test -p 1 ./... -coverprofile=coverage.out -covermode=atomic
      - name: Coverage summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f coverage.out ]; then
            echo "coverage.out missing; tests did not produce a profile" >&2
            exit 1
          fi
          go tool cover -func=coverage.out | tee coverage.txt
          go tool cover -html=coverage.out -o coverage.html
          {
            echo "## API coverage"
            echo
            echo '```'
            tail -n 1 coverage.txt
            echo '```'
            echo
            echo "<details><summary>Per-function</summary>"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            apps/api/coverage.out
            apps/api/coverage.txt
            apps/api/coverage.html
          if-no-files-found: warn

  web-tests:
    name: Web unit tests (ADV-013 checklist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --filter @flowforge/web...
      - name: Test
        run: pnpm --filter @flowforge/web test

  # G.0.5 / H3: required web quality gates. next build is the type-check
  # (Next 16 typegen); do not use bare tsc — LayoutProps lives in .next/types.
  web-lint:
    name: Web lint (max-warnings=0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --filter @flowforge/web...
      - name: Lint
        run: pnpm lint --max-warnings=0

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --filter @flowforge/web...
      - name: Build
        run: pnpm build

  image-scan:
    name: API image SBOM and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t flowforge-api:ci ./apps/api

      # Install the scanner binary. Do not use aquasecurity/trivy-action
      # version tags here — GitHub could not resolve @0.28.0 or @0.36.0.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
        run: |
          set -euo pipefail
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy
          trivy --version

      - name: Application dependency scan
        run: >
          trivy fs
          --scanners vuln
          --pkg-types library
          --severity HIGH,CRITICAL
          --exit-code 1
          --ignore-unfixed
          apps/api

      - name: Image scan (fixed CRITICAL)
        run: >
          trivy image
          --severity CRITICAL
          --exit-code 1
          --ignore-unfixed
          flowforge-api:ci

      - name: SPDX SBOM
        run: >
          trivy image
          --format spdx-json
          --output api-sbom.spdx.json
          flowforge-api:ci

      - name: Provenance statement
        run: bash scripts/write-provenance.sh flowforge-api:ci api-provenance.json
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload SBOM and provenance
        uses: actions/upload-artifact@v4
        with:
          name: api-supply-chain
          path: |
            api-sbom.spdx.json
            api-provenance.json

  # E12.2 sibling: full encrypted compose dump + isolated API boot.
  # The named resilience suite runs a schema-level isolated restore
  # (scripts/backup/restore-schema-rehearsal.sh) in e12-resilience.yml.
  restore-rehearsal:
    name: Encrypted backup restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_USER: flowforge
      POSTGRES_DB: flowforge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set disposable secrets
        run: |
          pass="$(openssl rand -hex 12)"
          key="$(openssl rand -hex 24)"
          echo "::add-mask::${pass}"
          echo "::add-mask::${key}"
          echo "POSTGRES_PASSWORD=${pass}" >> "$GITHUB_ENV"
          echo "BACKUP_ENCRYPTION_KEY=${key}" >> "$GITHUB_ENV"

      - name: Start Postgres and hardened API
        run: docker compose up --build -d --wait --wait-timeout 180 postgres api

      - name: Restore rehearsal
        # Isolated API is production-locked; the script mounts the local-only
        # PKCS#8 PEM (ADV-006 / ADV-022). Production boot-fail is unchanged.
        run: bash scripts/backup/restore-rehearsal.sh

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres api

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
