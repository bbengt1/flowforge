# E1.3: provenance, vulnerability, and restore-rehearsal gates.
# Policy: deploy/supply-chain/policy.md
# E12.1 provenance domain: this workflow's govulncheck, image-scan, and
# web-image-scan jobs stay required; the named suite re-runs approved-bases /
# deploy-defaults / govulncheck fixtures (see .github/workflows/e12-security.yml).
# G.2.10 / #455: web Trivy fs + image, SPDX SBOM. Keep #455 open.
# G.2.9 / #454: keyless cosign + SLSA provenance on push to main
# (publish-images). Pull requests scan only. The unsigned JSON provenance
# helper is retired and must not be called.
name: supply-chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Approved bases and deploy defaults
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check approved Dockerfile bases
        run: bash scripts/check-approved-bases.sh
      - name: Check deployment hardening defaults
        run: bash scripts/check-deploy-defaults.sh
      - name: Check image signing and admission
        run: bash scripts/check-image-signing.sh
      - name: Check published docs do not leak internal notes
        run: python3 scripts/check-public-docs.py
      - name: Check govulncheck gate fixtures
        run: |
          python3 scripts/govulncheck-gate.py scripts/testdata/govulncheck-clean.json
          if python3 scripts/govulncheck-gate.py scripts/testdata/govulncheck-reject.json; then
            echo "expected third-party finding to fail the gate" >&2
            exit 1
          fi

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: apps/api/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: |
          govulncheck -format json ./... > "${RUNNER_TEMP}/govulncheck.json" || true
          python3 "${GITHUB_WORKSPACE}/scripts/govulncheck-gate.py" "${RUNNER_TEMP}/govulncheck.json"

  # G.0.8 / #414: PostgreSQL so TEST_DATABASE_URL-gated integration tests
  # run. Coverage is published (artifact + job-log / step summary). No
  # coverage threshold — none exists in-repo; do not invent a harsh gate.
  # gofmt / go vet / golangci-lint live in api-quality.yml (#408 / G.0.5).
  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
          POSTGRES_DB: flowforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://flowforge:flowforge@127.0.0.1:5432/flowforge?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: apps/api/go.sum
      # Shared TEST_DATABASE_URL: serialize packages so parallel
      # integration tests cannot collide on tenants/roles. e12-security
      # does the same. The postgres package's restore rehearsal drops
      # flowforge_app (DROP OWNED BY / DROP ROLE); that is cluster-global
      # and revokes INSERT from in-flight opsconfig/vault tests, which
      # map 42501 to "not found".
      - name: Test with coverage
        run: go test -p 1 ./... -coverprofile=coverage.out -covermode=atomic
      - name: Coverage summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f coverage.out ]; then
            echo "coverage.out missing; tests did not produce a profile" >&2
            exit 1
          fi
          go tool cover -func=coverage.out | tee coverage.txt
          go tool cover -html=coverage.out -o coverage.html
          {
            echo "## API coverage"
            echo
            echo '```'
            tail -n 1 coverage.txt
            echo '```'
            echo
            echo "<details><summary>Per-function</summary>"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            apps/api/coverage.out
            apps/api/coverage.txt
            apps/api/coverage.html
          if-no-files-found: warn

  web-tests:
    name: Web unit tests (ADV-013 checklist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --filter @flowforge/web...
      - name: Typecheck tests
        run: pnpm --filter @flowforge/web typecheck:tests
      - name: Test
        run: pnpm --filter @flowforge/web test

  # G.3.3 / #480: Playwright + axe on primary surfaces. Serious and
  # critical violations fail the job. The browser is the gate; do not
  # reintroduce source-text aria greps for the same intent.
  web-a11y-e2e:
    name: Web Playwright axe (primary surfaces)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --filter @flowforge/web...
      - name: Install Chromium
        run: pnpm --filter @flowforge/web exec playwright install --with-deps chromium
      - name: Playwright axe
        run: pnpm --filter @flowforge/web test:e2e

  # G.0.5 / H3: required web quality gates. next build is the app type-check
  # (Next 16 typegen); do not use bare tsc — LayoutProps lives in .next/types.
  # G.0.6 / H4: *.test.ts are in tsconfig (and tsconfig.tests.json); web-tests
  # runs `pnpm typecheck:tests` so CI typechecks tests without waiting on build.
  web-lint:
    name: Web lint (max-warnings=0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --filter @flowforge/web...
      - name: Lint
        run: pnpm lint --max-warnings=0

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --filter @flowforge/web...
      - name: Build
        run: pnpm build

  image-scan:
    name: API image SBOM and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t flowforge-api:ci ./apps/api

      # G.1.2: prove the script-runner Dockerfile builds. No registry push
      # (same as the API image). Tag and push steps: docs/deployment.md.
      - name: Build script-runner image
        run: docker build -f apps/api/Dockerfile.script-runner -t flowforge-script-runner:ci apps/api

      - name: Build backup image
        run: docker build -f scripts/backup/Dockerfile -t flowforge-backup:ci .

      # Install the scanner binary. Do not use aquasecurity/trivy-action
      # version tags here — GitHub could not resolve @0.28.0 or @0.36.0.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
        run: |
          set -euo pipefail
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy
          trivy --version

      - name: Application dependency scan
        run: >
          trivy fs
          --scanners vuln
          --pkg-types library
          --severity HIGH,CRITICAL
          --exit-code 1
          --ignore-unfixed
          apps/api

      - name: Image scan (fixed HIGH and CRITICAL)
        run: >
          trivy image
          --severity HIGH,CRITICAL
          --exit-code 1
          --ignore-unfixed
          flowforge-api:ci

      - name: Script-runner image scan (fixed HIGH and CRITICAL)
        run: >
          trivy image
          --severity HIGH,CRITICAL
          --exit-code 1
          --ignore-unfixed
          flowforge-script-runner:ci

      - name: Backup image scan (fixed HIGH and CRITICAL)
        run: >
          trivy image
          --severity HIGH,CRITICAL
          --exit-code 1
          --ignore-unfixed
          flowforge-backup:ci

      - name: SPDX SBOM
        run: >
          trivy image
          --format spdx-json
          --output api-sbom.spdx.json
          flowforge-api:ci

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: api-supply-chain
          path: api-sbom.spdx.json

  # G.2.10 / #455: same Trivy gates as image-scan, for the Next.js app.
  # Build context is the repo root (compose / G.0.7). apps/web alone cannot
  # see pnpm-lock.yaml, so `docker build ./apps/web` fails the lockfile copy.
  web-image-scan:
    name: Web image SBOM and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t flowforge-web:ci .

      # Install the scanner binary. Do not use aquasecurity/trivy-action
      # version tags here — GitHub could not resolve @0.28.0 or @0.36.0.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
        run: |
          set -euo pipefail
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy
          trivy --version

      # apps/web has no lockfile. Trivy 0.74.0 on that directory alone
      # reports no packages. The pnpm workspace lockfile at the repo root
      # is the apps/web library graph. Skip apps/api so this job does not
      # duplicate the API filesystem gate.
      - name: Application dependency scan
        run: >
          trivy fs
          --scanners vuln
          --pkg-types library
          --severity HIGH,CRITICAL
          --exit-code 1
          --ignore-unfixed
          --skip-dirs apps/api
          .

      - name: Image scan (fixed HIGH and CRITICAL)
        run: >
          trivy image
          --severity HIGH,CRITICAL
          --exit-code 1
          --ignore-unfixed
          flowforge-web:ci

      - name: SPDX SBOM
        run: >
          trivy image
          --format spdx-json
          --output web-sbom.spdx.json
          flowforge-web:ci

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: web-supply-chain
          path: web-sbom.spdx.json

  # E12.2 sibling: full encrypted compose dump + isolated API boot.
  # The named resilience suite runs a schema-level isolated restore
  # (scripts/backup/restore-schema-rehearsal.sh) in e12-resilience.yml.
  restore-rehearsal:
    name: Encrypted backup restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_USER: flowforge
      POSTGRES_DB: flowforge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set disposable secrets
        run: |
          pass="$(openssl rand -hex 12)"
          key="$(openssl rand -hex 24)"
          echo "::add-mask::${pass}"
          echo "::add-mask::${key}"
          echo "POSTGRES_PASSWORD=${pass}" >> "$GITHUB_ENV"
          echo "BACKUP_ENCRYPTION_KEY=${key}" >> "$GITHUB_ENV"

      - name: Install AEAD helper dependency
        run: sudo apt-get update && sudo apt-get install -y python3-cryptography

      - name: AEAD selftest
        run: python3 scripts/backup/aead.py selftest

      - name: Integrity manifest selftest
        run: python3 scripts/backup/manifest.py selftest

      - name: Start Postgres and hardened API
        run: docker compose up --build -d --wait --wait-timeout 300 postgres api

      - name: Restore rehearsal
        # Isolated API is production-locked; the script mounts the local-only
        # PKCS#8 PEM (ADV-006 / ADV-022) and uses the compose MinIO bucket.
        # ARTIFACT_S3_CREATE_BUCKET stays off. Production boot-fail is unchanged.
        run: bash scripts/backup/restore-rehearsal.sh

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres minio api

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # G.2.9 / #454. Pull requests build and scan only. Push to main, and
  # workflow_dispatch on main, publish a digest, sign it keyless with this
  # workflow's OIDC identity, and attach SLSA provenance. A missing digest
  # or a failed sign/attest fails the job. BuildKit provenance is off so
  # an unsigned statement cannot be mistaken for the GitHub attestation.
  # Cosign stays on v2: Kyverno verifyImages on GHCR does not reliably
  # read cosign v3 attestation bundles.
  publish-images:
    name: Sign and attest ${{ matrix.name }}
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [policy, image-scan, web-image-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/api
            file: apps/api/Dockerfile
            image: flowforge-api
            build_args: BUILD_SHA=${{ github.sha }}
          - name: web
            context: .
            file: apps/web/Dockerfile
            image: flowforge-web
            build_args: NEXT_PUBLIC_API_URL=${{ vars.WEB_NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
          - name: script-runner
            context: apps/api
            file: apps/api/Dockerfile.script-runner
            image: flowforge-script-runner
            build_args: ""
          - name: backup
            context: .
            file: scripts/backup/Dockerfile
            image: flowforge-backup
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: ${{ matrix.build_args }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4
        with:
          cosign-release: v2.5.3

      - name: Sign image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) ;;
            *)
              echo "refusing to sign: image digest missing" >&2
              exit 1
              ;;
          esac
          cosign sign --yes "${IMAGE}@${DIGEST}"
          {
            echo "### ${IMAGE}@${DIGEST}"
            echo
            echo "Replace the unset pin in deploy/k8s with this digest."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
