# E1.3: provenance, vulnerability, and restore-rehearsal gates.
# Policy: deploy/supply-chain/policy.md
name: supply-chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Approved bases and deploy defaults
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check approved Dockerfile bases
        run: bash scripts/check-approved-bases.sh
      - name: Check deployment hardening defaults
        run: bash scripts/check-deploy-defaults.sh

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Test
        run: go test ./...

  image-scan:
    name: API image SBOM and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t flowforge-api:ci ./apps/api

      - name: Application dependency scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: apps/api
          scanners: vuln
          pkg-types: library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Image scan (fixed CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: flowforge-api:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: SPDX SBOM
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: flowforge-api:ci
          format: spdx-json
          output: api-sbom.spdx.json
          exit-code: "0"

      - name: Provenance statement
        run: bash scripts/write-provenance.sh flowforge-api:ci api-provenance.json
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload SBOM and provenance
        uses: actions/upload-artifact@v4
        with:
          name: api-supply-chain
          path: |
            api-sbom.spdx.json
            api-provenance.json

  restore-rehearsal:
    name: Encrypted backup restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_USER: flowforge
      POSTGRES_DB: flowforge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set disposable secrets
        run: |
          pass="$(openssl rand -hex 12)"
          key="$(openssl rand -hex 24)"
          echo "::add-mask::${pass}"
          echo "::add-mask::${key}"
          echo "POSTGRES_PASSWORD=${pass}" >> "$GITHUB_ENV"
          echo "BACKUP_ENCRYPTION_KEY=${key}" >> "$GITHUB_ENV"

      - name: Start Postgres and hardened API
        run: docker compose up --build -d --wait --wait-timeout 180 postgres api

      - name: Restore rehearsal
        run: bash scripts/backup/restore-rehearsal.sh

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres api

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
