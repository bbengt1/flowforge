# E12.2: operational resilience and capacity suite.
# Relates to #183 / Part of #181. Keep #183 open.
# Catalog: scripts/e12-resilience-suite.json
# Encrypted compose restore sibling: supply-chain.yml restore-rehearsal.
# Does not skip or weaken e12-security.yml.
name: e12-resilience

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e12-resilience-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resilience-suite:
    name: Resilience and capacity suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
          POSTGRES_DB: flowforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://flowforge:flowforge@127.0.0.1:5432/flowforge?sslmode=disable
      E12_LOAD_MODE: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: apps/api/go.sum

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run E12.2 resilience suite
        env:
          E12_WRITE_EVIDENCE: "1"
          BACKUP_ENCRYPTION_KEY: e12-ci-restore-key
        run: bash scripts/e12-resilience-suite.sh

      - name: Upload last-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e12-resilience-suite
          path: |
            docs/reference/e12-resilience-evidence/last-run.json
            docs/reference/e12-resilience-evidence/capacity-last-run.json
            docs/reference/e12-resilience-evidence/restore-schema-last-run.json
