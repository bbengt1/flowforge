# E12.2: operational resilience and capacity suite.
# Relates to #183 / Part of #181. Keep #183 open.
# Catalog: scripts/e12-resilience-suite.json
# Encrypted compose restore sibling: supply-chain.yml restore-rehearsal.
# Does not skip or weaken e12-security.yml.
name: e12-resilience

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e12-resilience-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resilience-suite:
    name: Resilience and capacity suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
          POSTGRES_DB: flowforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://flowforge:flowforge@127.0.0.1:5432/flowforge?sslmode=disable
      E12_LOAD_MODE: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: apps/api/go.sum

      - name: Install PostgreSQL client and server
        # postgresql-16's default cluster would bind 5432 and collide with
        # the service container. Install the server binaries only.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common postgresql-client python3-cryptography
          sudo sed -i 's/^#create_main_cluster = true/create_main_cluster = false/' /etc/postgresql-common/createcluster.conf
          sudo apt-get install -y postgresql-16

      - name: AEAD selftest
        run: python3 scripts/backup/aead.py selftest

      - name: Integrity manifest selftest
        run: python3 scripts/backup/manifest.py selftest

      - name: Allow replication through the published Postgres port
        # initdb trusts replication only from 127.0.0.1. Clients that use
        # the published port arrive inside the container as the docker
        # bridge address, so pg_receivewal and pg_basebackup fail closed
        # until this line is loaded. The line is scram-sha-256 and is not
        # a secret.
        run: |
          set -euo pipefail
          mapfile -t cids < <(docker ps -q --filter ancestor=postgres:16-alpine)
          cid="${cids[0]:-}"
          if [[ -z "$cid" ]]; then
            echo "postgres service container not found" >&2
            docker ps >&2
            exit 1
          fi
          docker exec "$cid" sh -c 'grep -qx "host replication all all scram-sha-256" "$PGDATA/pg_hba.conf" || echo "host replication all all scram-sha-256" >> "$PGDATA/pg_hba.conf"'
          rules="$(docker exec -u postgres "$cid" psql -U flowforge -d flowforge -v ON_ERROR_STOP=1 -tA -c "SELECT pg_reload_conf(); SELECT count(*) FROM pg_hba_file_rules WHERE database = '{replication}' AND auth_method = 'scram-sha-256' AND error IS NULL")"
          rules="$(printf '%s\n' "$rules" | tail -n 1 | tr -d '[:space:]')"
          if [[ "${rules:-0}" -lt 1 ]]; then
            echo "replication pg_hba rule did not load" >&2
            exit 1
          fi

      - name: Run E12.2 resilience suite
        env:
          E12_WRITE_EVIDENCE: "1"
          BACKUP_ENCRYPTION_KEY: e12-ci-restore-key
        run: bash scripts/e12-resilience-suite.sh

      - name: Upload last-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e12-resilience-suite
          path: |
            docs/reference/e12-resilience-evidence/last-run.json
            docs/reference/e12-resilience-evidence/capacity-last-run.json
            docs/reference/e12-resilience-evidence/restore-schema-last-run.json
            docs/reference/e12-resilience-evidence/rpo-rto-last-run.json
            docs/reference/e12-resilience-evidence/manifest-pitr-last-run.json
