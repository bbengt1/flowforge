    post:
      operationId: startWorkflowExecution
      summary: Start a durable execution
      description: |
        E10.1 authenticated manual start. Requires `workflow.execute`
        and a published `workflowVersionId`. Drafts cannot run
        (`400` `invalid-request`). The created row stores
        `workflowVersionId` + `workflowDigest` and later draft edits
        cannot change that pin. The run dialog must send
        `idempotencyKey` (or `Idempotency-Key`); the key is unique per
        `(workspace, workflowVersionId, key)`. Same fingerprint returns
        `200` with `replayed=true` and does not create steps/jobs again.
        A different fingerprint is `409`. Bounded typed `input` (16 KiB;
        schema when the published manual trigger declares one) is
        redacted before persist. E4.3 evaluates current target/action
        policy first (deny `403`, approval-required `409`). Start audit
        is secret-free and includes actor, version/digest, correlation,
        and outcome.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/WorkflowID"
        - name: Idempotency-Key
          in: header
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartExecutionRequest"
      responses:
        "200":
          description: Idempotent replay of an existing execution
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
