        idempotencyKeyPattern: {type: string}
        dispatchRoute: {type: string}
        permission: {type: string}
        viewPermission: {type: string}
        dispatchPermission: {type: string}
        csrf: {type: boolean}
        help: {type: string}
    ExecutionList:
