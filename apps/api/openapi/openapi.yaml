  /embed/catalog:
    get:
      operationId: getEmbedCatalog
      summary: Versioned embed SDK/contract
      description: |
        E11.1 contract discovery for host backends and the embed shell.
        Documents SDK `embed.v1`, assertion claims, stable standalone/embed
        routes, mint/exchange, public JWKS, and E11.2 fail-closed hooks
        (atomic jti consume, key rotation, tenancy propagation).
        `frameAncestors` is the shared host allowlist (ADV-011) used for
        CSP `frame-ancestors` on `/embed/v1` and postMessage origin checks.
        Empty fails closed. `issuers` is the configured
        `EMBED_ISSUER` / `EMBED_ISSUER_ALLOWLIST` for standalone
        exchange host binding and is always published. ADV-024:
        unauthenticated or capability-less embed sessions receive
        exchange/session/chrome essentials only. Membership/isolation
        routes and `workspace.administer` / `platform.administer`
        capabilities are omitted unless the peeked session grants one
        of those caps. `frameAncestors` stays published.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Embed contract
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedCatalog"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /embed/jwks:
    get:
      operationId: getEmbedJWKS
      summary: Embed assertion public keys
      description: |
        JWKS for FlowForge-minted embed assertions (Ed25519 / EdDSA).
        Refreshes overlap from the durable store and omits expired
        `overlapUntil` keys. Never includes private keys, PEM, seed, or the
        `d` parameter.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Public keys
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedJWKS"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /embed/assertions:
    post:
      operationId: mintEmbedAssertion
      summary: Mint a short-lived embed assertion
      description: |
        Host backends exchange an authenticated FlowForge principal for a
        short-lived, asymmetric-signed, audience-bound, single-use assertion.
        Workspace identity is resolved from tenant + workbench headers.
        `subject` and `issuer` bind to the authenticated caller. A different
        subject requires `embed.impersonate` (`PLATFORM_ADMINS`); a different
        issuer is 403. `capabilities` must be a known permission subset of
        the caller. The assertion `iss` must be on a non-empty `EMBED_ISSUER` /
        `EMBED_ISSUER_ALLOWLIST` (empty fails closed with 403).
        Production requires each configured issuer to be an absolute https URI
        (ADV-018; boot-fail on allowlist load, 403 at mint/exchange).
        The compact JWS is returned once. Private keys are never returned.
        Cookie callers need CSRF; header-only host backends skip CSRF.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/DisplayName"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintEmbedAssertionRequest"
      responses:
        "201":
          description: Assertion minted
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedEmbedAssertion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /embed/exchange:
    post:
      operationId: exchangeEmbedAssertion
      summary: Exchange an embed assertion for a browser session
      description: |
        Refreshes overlap from the durable store and refuses expired
        `overlapUntil` / retired kids. Validates issuer against the
        path allowlist selected by the signed `ctx` claim (`embed` →
        `EMBED_ISSUER` / `EMBED_ISSUER_ALLOWLIST`, `portal` →
        `PORTAL_ISSUER` / `PORTAL_ISSUER_ALLOWLIST`; missing `ctx`
        merges both; empty fails closed with 403). `host` must equal
        `iss` when present. Optional `X-FlowForge-Host-Issuer` /
        `hostIssuer` and `X-FlowForge-Host-Context` / `hostContext`
        must agree with those signed claims when sent. Also validates
        audience (`flowforge`), `nbf`/`exp`, `jti`, signature (active
        + live overlap kids), and capabilities **before any workspace
        lookup**. `nbf` allows a short clock-skew leeway only (default
        30s, `EMBED_NBF_LEEWAY`, hard max 60s); `exp` has no leeway.
        Atomically consumes `jti` with TTL only after verify succeeds
        (replay is 409). Then resolves `tenant_id` + `workbench_key`
        and confirms optional workspace binding. Invalid assertions
        fail closed without probing whether the tenant or workbench
        exists.
        Issues `ff_session` / `ff_csrf` bound to that pair with CHIPS
        attributes (`SameSite=None; Secure; Partitioned`). Top-level
        `POST /session` cookies stay `SameSite=Lax` / `Strict` and are
        not Partitioned. The bound session cannot `POST /tenants` or
        `POST /workspaces`. The assertion must be POSTed in the JSON
        body — never placed in a URL. No CSRF (no session yet). A
        browser that does not store or send the partitioned cookie
        fails closed (`401` unauthenticated, or `403` CSRF on later
        mutations). HTTPS / a secure context is required.
        Rate-limited by client IP (default 120/min) and issuer|subject
        (default 30/min) before verify. Burst returns `429`
        `rate-limited` with `Retry-After`. Authorization decisions
        emit secret-free `embed_audit` events.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - name: X-FlowForge-Host-Issuer
          in: header
          required: false
          schema: {type: string}
          description: |
            Optional configured host issuer for this frame (from
            GET /embed/catalog issuers or GET /portal/adapter issuers).
            Must equal assertion `iss` when sent. Never peek `iss` from
            the assertion. Path allowlist comes from signed `ctx`.
        - name: X-FlowForge-Host-Context
          in: header
          required: false
          schema: {type: string, enum: [embed, portal]}
          description: |
            Optional path declaration. Must agree with signed `ctx` when
            both are present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeEmbedAssertionRequest"
      responses:
        "201":
          description: Session issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              description: "ff_session (HttpOnly) and ff_csrf (readable) with SameSite=None; Secure; Partitioned (CHIPS). Not used for top-level POST /session."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedExchangeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /embed/keys/rotate:
    post:
      operationId: rotateEmbedKeys
      summary: Register or retire an embed overlap public key
      description: |
        Operator rotate API. Mint stays on the durable active `EMBED_SIGNING_KEY`
        (production boot-fails if unset). `register-overlap` accepts only the
        current/previous active public JWK (the key being rotated out).
        Arbitrary Ed25519 keys are `400`. `register-overlap` requires a short
        `overlapUntil` (max 4h). Missing, zero, past, or farther-future is
        `400`. `retire` removes an overlap kid after in-flight assertions
        expire. Exchange and JWKS refresh overlap from the durable store and
        refuse missing, expired, or far-future `overlapUntil` keys. The active
        signing key is not an overlap key. Unknown `kid` fails closed. Private
        keys are never accepted or returned.
        Requires `platform.administer` via `PLATFORM_ADMINS` (`issuer|subject`).
        `workspace.administer` is not enough (`403`). Cookie callers need CSRF.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/DisplayName"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateEmbedKeyRequest"
      responses:
        "200":
          description: Public JWKS after the rotate
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedJWKS"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /portal/adapter:
    get:
      operationId: getPortalAdapter
      summary: CP Ops Portal adapter contract
      description: |
        E11.3 FlowForge-side Portal adapter. Documents host wiring
        (Portal entry → role map → E11.1 mint → `/embed/v1` → E11.1
        exchange), the Portal role → FlowForge capability map, issuer
        allowlist, and frame-ancestors. Portal never shares the
        FlowForge database or executor. Portal entry RBAC is not
        FlowForge authorization.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Portal adapter contract
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalAdapterCatalog"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /portal/adapter/assertions:
    post:
      operationId: mintPortalAssertion
      summary: Mint an embed assertion for the CP Ops Portal
      description: |
        Portal backend, after its own RBAC, maps `portalRoles` to
        FlowForge capabilities and mints via E11.1 `embed.Mint`
        (`aud=flowforge`, portal issuer, tenant, workbench). Not a
        parallel auth path. `subject` binds to the caller unless
        `embed.impersonate` (`PLATFORM_ADMINS`); a different issuer is
        403. `capabilities` must remain a subset of the minting caller.
        The portal `iss` must be on a non-empty `PORTAL_ISSUER` /
        `PORTAL_ISSUER_ALLOWLIST` (empty fails closed with 403).
        Production requires each configured issuer to be an absolute https
        URI (ADV-018; boot-fail on allowlist load, 403 at mint). Compact
        JWS is returned once. Cookie callers need CSRF; header-only
        Portal backends skip CSRF.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/DisplayName"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintPortalAssertionRequest"
      responses:
        "201":
          description: Assertion minted
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedEmbedAssertion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /workflows/catalog:
    get:
      operationId: getWorkflowCatalog
      summary: Core node and trigger catalog
      description: |
        Typed graph vocabulary for the YAML editor and canvas. Requires
        `workflow.view`. Next/provider types are listed so the UI can
        reject them; only `phase: core` is publishable in MVP.

        E3.3 adds full contracts for the core neutral nodes
        (`flow.condition`, `flow.delay`, `data.set`, `data.map`,
        `data.validate`, `flow.stop`, `flow.fail`): typed ports with
        classification and byte bounds, allowlisted `with` fields,
        policy/redaction metadata, and aggregation limits. Triggers
        remain workflow-level `spec.triggers` entries (`rules` on the
        catalog), never graph nodes.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
