  /workflow-folders:
    get:
      operationId: listWorkflowFolders
      summary: List workspace workflow folders
      description: |
        Requires `workflow.view`. Returns a flat `{items}` list with `parentId`
        (null = top-level). Unfiled is not a persisted folder. This workspace
        only. Embed capabilities cannot escalate.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
