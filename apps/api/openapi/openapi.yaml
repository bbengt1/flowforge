      type: object
      additionalProperties: false
      required: [confirm]
      description: |
        Operator confirmation that process DATABASE_URL persistence is
        ready. Never a DSN, password, or connection string.
      properties:
        confirm:
          type: boolean
          enum: [true]
          description: Must be true. The server pings PostgreSQL; the client does not send credentials.
