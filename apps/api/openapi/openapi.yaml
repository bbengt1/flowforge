          type: string
        name:
          type: string
        description:
          type: string
        triggers:
          type: array
          items:
            type: object
            required: [id, type]
            properties:
              id:
                type: string
              type:
                type: string
        nodes:
          type: array
          items:
            type: object
            required: [id, type, name]
            properties:
              id:
                type: string
              type:
                type: string
              name:
                type: string
        edges:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from:
                type: string
              to:
                type: string
        outputs:
          type: array
          items:
            type: object
            required: [name, from]
            properties:
              name:
                type: string
              from:
                type: string
    WorkflowValidateResult:
      type: object
      required: [valid, summary, warnings]
      properties:
        valid:
          type: boolean
