            application/json:
              schema:
                $ref: "#/components/schemas/MachinePrincipal"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /machine/principals/{id}/rotate:
    post:
      operationId: rotateMachinePrincipal
      summary: Rotate a machine credential
      description: |
        Requires `platform.administer` and CSRF. Replaces `secret` and/or
        `assertion_public_key`. Grants stay as created. The new secret is
        not echoed. Previous secret and assertions stop working.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
