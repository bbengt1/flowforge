        Sibling name clash or a would-be cycle is `409`. Depth greater than 4
        is `400`. Host-supplied `id` / `workspace_id` / `workspaceId` is `400`.
        Cross-workspace UUIDs are `404`. Cookie session + CSRF. Does not
        rewrite YAML or workflow slugs.
