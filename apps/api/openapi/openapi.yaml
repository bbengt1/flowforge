          format: uuid
        tenant_id:
          type: string
          format: uuid
        workbench_key:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    User:
      type: object
