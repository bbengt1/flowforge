    post:
      operationId: revokeScriptArtifact
      summary: Revoke a published script artifact
      description: |
        Requires `script.revoke` (operator/admin). Sets `revokedAt` (idempotent).
        Revoked artifacts cannot start; start/claim/heartbeat-before-dispatch
        and `VerifyForDispatch` fail closed with `artifact-revoked`. Never
        returns the package blob. Host-supplied workspace IDs are `400`.
        Cross-workspace IDs are `404`. Audit `script.artifact.revoke` is
        secret-free.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptRevokeRequest"
      responses:
        "200":
          description: Revoked artifact metadata
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
