      type: object
      required: [refs]
      properties:
        refs:
          type: array
          items:
            type: object
            required: [kind, resourceId]
            properties:
              kind: {type: string}
              resourceId: {type: string, format: uuid}
              versionId: {type: string, format: uuid}
    Health:
      type: object
      required: [status, version, sha]
      description: |
        Process liveness plus non-secret build identity. `version` and
        `sha` come from image ldflags (`BUILD_VERSION` / `BUILD_SHA`
        build args) or the same env names at runtime. Missing or
        unsafe values are `dev` / `unknown`. Health never fails because
        identity is absent. No secrets, DSNs, or keys.
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Release or image tag. Default `dev`.
        sha:
          type: string
          description: Git object name (7–40 hex) or `unknown`.
    Readiness:
      type: object
      required: [status, version, sha]
      description: |
        PostgreSQL reachable, plus the same non-secret build identity
        as `/health`. 503 problem responses do not include version/sha.
      properties:
        status:
          type: string
          enum: [ready]
        version:
          type: string
        sha:
          type: string
    BootstrapPersistenceConfirm:
      type: object
      additionalProperties: false
      required: [confirm]
      description: |
        Operator confirmation that process DATABASE_URL persistence is
        ready. Never a DSN, password, or connection string.
      properties:
        confirm:
          type: boolean
          enum: [true]
          description: Must be true. The server pings PostgreSQL; the client does not send credentials.
    BootstrapFirstAdmin:
      type: object
      additionalProperties: false
      required: [issuer, external_subject]
      description: |
        First admin identity. Prefer existing localseed /
        PLATFORM_ADMINS upsert (issuer + external_subject). Optional
        `password` is stored as a bcrypt hash for `POST /login`
        (`external_subject` is the email or username). Never echoed.
      properties:
        issuer:
          type: string
          minLength: 1
          maxLength: 512
          description: Identity issuer. Same vocabulary as localseed PLATFORM_ADMINS.
        external_subject:
          type: string
          minLength: 1
          maxLength: 256
          description: External subject. Same vocabulary as localseed PLATFORM_ADMINS.
        display_name:
          type: string
          maxLength: 200
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: |
            POST once for local login. Stored as a hash keyed by
            `external_subject`. Never returned.
    BootstrapPublicURL:
      type: object
      additionalProperties: false
      required: [publicBaseUrl]
      description: |
        Public origin for this instance. HTTPS is preferred. HTTP is
        allowed for local installs. Never echoed on GET /bootstrap.
      properties:
        publicBaseUrl:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: |
            Origin only (`https://host[:port]`). Trailing slash is
            stripped. No userinfo, query, fragment, or path. HTTP is
            documented for local (for example `http://localhost:3000`).
    BootstrapTLS:
      description: |
        Wizard step 4 body. PEM fields POST once and are never
        returned. Skip writes no PEM. ACME is not accepted.
      oneOf:
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action:
              type: string
              enum: [create-self-signed]
        - type: object
          additionalProperties: false
          required: [action, certPem, keyPem]
          properties:
            action:
              type: string
              enum: [upload]
            certPem:
              type: string
              minLength: 1
              maxLength: 262144
              description: Certificate PEM. POST once. Never returned.
            keyPem:
              type: string
              minLength: 1
              maxLength: 262144
              description: Private key PEM. POST once. Never returned.
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action:
              type: string
              enum: [skip]
    BootstrapStep:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready:
          type: boolean
        mode:
          type: string
          description: TLS status-only mode. Never a key or PEM.
          enum: [none, self_signed, uploaded, local_http, skipped]
    BootstrapStatus:
      type: object
      additionalProperties: false
      required: [complete, incomplete, skipped, standaloneOnly, steps]
      properties:
        complete:
          type: boolean
        incomplete:
          type: boolean
        skipped:
          type: boolean
          description: Trusted-dev / compose localseed skip (admin + URL).
        standaloneOnly:
          type: boolean
          description: Always true. Wizard and this gate never apply to /embed/v1.
        steps:
          type: object
          additionalProperties: false
          required: [persistence, firstAdmin, publicUrl, tls]
          properties:
            persistence:
              $ref: "#/components/schemas/BootstrapStep"
            firstAdmin:
              $ref: "#/components/schemas/BootstrapStep"
            publicUrl:
              $ref: "#/components/schemas/BootstrapStep"
            tls:
              $ref: "#/components/schemas/BootstrapStep"
    Problem:
      type: object
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - invalid-request
            - unauthenticated
            - forbidden
            - not-found
            - conflict
            - method-not-allowed
            - request-too-large
            - rate-limited
            - internal-error
            - dependency-unavailable
            - invalid-workflow
            - retry-denied
            - artifact-mutable
            - artifact-unscanned
            - artifact-unsigned
            - artifact-scan-failed
            - mfa-required
        request_id:
          type: string
        errors:
          type: array
          description: Field-level workflow validation errors (invalid-workflow only).
          items:
            $ref: "#/components/schemas/WorkflowFieldError"
    Tenant:
      type: object
      required: [id, slug, name, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Workspace:
      type: object
      required: [id, tenant_id, workbench_key, name, status]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        workbench_key:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, issuer, external_subject, status]
      properties:
        id:
          type: string
          format: uuid
        issuer:
          type: string
        external_subject:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled]
    MachineTokenRequest:
      type: object
      additionalProperties: false
      required: [client_id]
      description: |
        Exactly one of `secret` or `assertion`. Both are POST once and
        never returned.
      properties:
        client_id:
          type: string
          minLength: 2
          maxLength: 64
          description: Public identifier. Not a secret.
        secret:
          type: string
          minLength: 16
          maxLength: 72
          format: password
        assertion:
          type: string
          description: Compact Ed25519 assertion. aud=flowforge:machine. Max TTL 5 minutes.
    MachinePrincipalCreate:
      type: object
      additionalProperties: false
      required: [display_name]
      description: |
        `secret` or `assertion_public_key` is required and is not echoed.
        Grants default to empty (authorize nothing).
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        client_id:
          type: string
          minLength: 2
          maxLength: 64
        secret:
          type: string
          minLength: 16
          maxLength: 72
          format: password
        assertion_public_key:
          type: string
          description: Base64 raw 32-byte Ed25519 public key. Not a private key.
        grants:
          type: array
          items:
            type: string
        tenant_id:
          type: string
          format: uuid
        tenant_slug:
          type: string
        workbench_key:
          type: string
    MachinePrincipalRotate:
      type: object
      additionalProperties: false
      description: Credential only. Grants are not changed. Secret is not echoed.
      properties:
        secret:
          type: string
          minLength: 16
          maxLength: 72
          format: password
        assertion_public_key:
          type: string
    MachinePrincipal:
      type: object
      required: [id, client_id, display_name, status, grants, created_at]
      description: Operator view. No secret, hash, assertion, or public key.
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [active, revoked]
        grants:
          type: array
          items:
            type: string
        tenant_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        workbench_key:
          type: string
        created_at:
          type: string
          format: date-time
        rotated_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    MachinePrincipalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MachinePrincipal"
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Applied page size. Default 50. Always present.
        cursor:
          type: string
          description: Opaque keyset token that produced this page. Empty on the first page. Always present.
        next:
          type: string
          description: Opaque token for the following page. Empty when this page is the last. Always present.
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      description: |
        Standalone local sign-in. Send `identifier` or `email` or
        `username` (they must agree if more than one is set) plus
        `password`. Password POST once; never echoed.
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 256
          description: Email or username. Case-insensitive. Matches bootstrap `external_subject`.
        email:
          type: string
          minLength: 1
          maxLength: 256
          description: Alias for identifier.
        username:
          type: string
          minLength: 1
          maxLength: 256
          description: Alias for identifier.
        password:
          type: string
          minLength: 1
          maxLength: 72
          format: password
          description: POST once. Never returned.
    OIDCStartRequest:
      type: object
      additionalProperties: false
      description: Empty object. Extra fields are rejected.
    OIDCStartResponse:
      type: object
      additionalProperties: false
      required: [authorization_url, state, expires_at]
      properties:
        authorization_url:
          type: string
          format: uri
          description: IdP authorize URL. No client_secret and no code_verifier.
        state:
          type: string
          description: Matches the ff_oidc_state cookie. Not a secret the chrome may persist beyond the redirect.
        expires_at:
          type: string
          format: date-time
    OIDCCallbackRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 2048
          description: Authorization code. POST once. Never echoed.
        state:
          type: string
          minLength: 1
          maxLength: 256
          description: Must match the ff_oidc_state cookie.
    MFAStatus:
      type: object
      additionalProperties: false
      required: [method, enrolled, satisfied, applicable, privileged_permissions]
      properties:
        method:
          type: string
          enum: [totp]
        enrolled:
          type: boolean
        satisfied:
          type: boolean
          description: True when this session has stepped up, or when MFA does not apply to the door.
        applicable:
          type: boolean
          description: True only for local-login and OIDC sessions.
        privileged_permissions:
          type: array
          items:
            type: string
          description: platform.administer and credential.*
        otpauth_uri:
          type: string
          description: Present only on the enroll response, once. Contains the TOTP secret. Do not store.
    MFAVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 8
          description: TOTP code. POST once. Never echoed.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      description: |
        New local-login password. POST once; never echoed. Must not
        match the current secret or the one-time default `admin`.
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: New password. POST once. Never returned.
        new_password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: Alias for password.
    CreateSessionRequest:
      type: object
      properties:
        issuer:
          type: string
        external_subject:
          type: string
        display_name:
          type: string
    Session:
      type: object
      required: [id, created_at, last_seen_at, idle_expires_at, absolute_expires_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
        must_change_password:
          type: boolean
          description: |
            True after first-run one-time local login until
            `POST /session/password` succeeds. Chloe gates Overview /
            product chrome to the change-password screen. Omitted when
            false. Never a password or hash.
        embed:
          $ref: "#/components/schemas/SessionEmbedBinding"
    SessionEmbedBinding:
      type: object
      description: |
        Present only on embed-exchanged sessions. Authoritative chrome
        payload for the embed shell (ADV-021). Absence means standalone.
        No secrets and no raw assertion.
      required: [mode, sdk, tenantId, workbenchKey, workspaceId, capabilities]
      properties:
        mode:
          type: string
          enum: [embed]
          description: Explicit embed-mode flag. Always `embed` when this object is present.
        sdk:
          type: string
          enum: [embed.v1]
        tenantId: {type: string, format: uuid}
        tenantSlug: {type: string, description: Chrome-safe tenant display slug.}
        tenantName: {type: string, description: Chrome-safe tenant display name.}
        workbenchKey: {type: string}
        workspaceId: {type: string, format: uuid}
        workspaceName: {type: string, description: Chrome-safe workspace display name.}
        capabilities:
          type: array
          items: {type: string}
          description: Session-capped minted capabilities. Not the catalog set.
    SessionResponse:
      type: object
      required: [session, principal, csrf_token]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        principal:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
          description: Same value as the `ff_csrf` cookie. Never log or persist in localStorage.
    SessionAuditEvent:
      type: object
      required: [id, event_type, outcome, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - session.created
            - session.refreshed
            - session.revoked
            - session.expired
            - session.csrf_rejected
            - session.origin_rejected
            - session.privilege_denied
            - session.auth_rejected
        outcome:
          type: string
          enum: [allowed, denied]
        reason:
          type: string
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
    SessionAuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionAuditEvent"
    EmbedCatalog:
      type: object
      description: |
        Versioned embed SDK/contract for Chloe and host backends.
        `rules.membershipIsolationGranted` is true only when the peeked
        session has `workspace.administer` or `platform.administer`.
        Public catalogs omit membership/isolation routes and those
        capabilities. `frameAncestors` is always present (ADV-011).
        `issuers` is the configured embed host issuer list and is
        always published.
    PortalAdapterCatalog:
      type: object
      description: Versioned CP Ops Portal adapter contract and host wiring map.
    MintPortalAssertionRequest:
      type: object
      description: Portal-backend mint. Provide portalRoles and/or capabilities.
      properties:
        subject:
          type: string
          description: End-user subject. Defaults to the minting caller. A different value requires embed.impersonate (PLATFORM_ADMINS); otherwise 403.
        displayName:
          type: string
        issuer:
          type: string
          description: Assertion iss. Must match the authenticated caller and be on a non-empty PORTAL_ISSUER / PORTAL_ISSUER_ALLOWLIST (empty fails closed). A mismatched issuer is 403.
        tenantId:
          type: string
          format: uuid
        workbenchKey:
          type: string
        workspaceId:
          type: string
          format: uuid
          description: Optional binding. Must match server resolution. Never the lookup key.
        portalRoles:
          type: array
          items: {type: string}
          description: Portal roles (`portal.viewer` or `viewer`, …) mapped to FlowForge capabilities.
        capabilities:
          type: array
          items: {type: string}
          description: Extra FlowForge permission keys. Must be known catalog keys.
        ttlSeconds:
          type: integer
          minimum: 15
          maximum: 300

    EmbedJWKS:
      type: object
      required: [keys, signingReady]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, kid, use, alg]
            properties:
              kty: {type: string, enum: [OKP]}
              crv: {type: string, enum: [Ed25519]}
              x: {type: string, description: Public key (base64url). Never `d`.}
              kid: {type: string}
              use: {type: string, enum: [sig]}
              alg: {type: string, enum: [EdDSA]}
              status: {type: string, enum: [active, overlap]}
              overlapUntil:
                type: string
                format: date-time
                description: |
                  Required on overlap verification keys (max 4h from now).
                  Omitted on the active signing key — that key is not an
                  overlap key and does not expire via overlapUntil.
        signingReady:
          type: boolean
    MintEmbedAssertionRequest:
      type: object
      required: [capabilities]
      properties:
        subject:
          type: string
          description: End-user subject. Defaults to the minting caller. A different value requires embed.impersonate (PLATFORM_ADMINS); otherwise 403.
        displayName:
          type: string
        issuer:
          type: string
          description: Assertion iss. Must match the authenticated caller (defaults to the caller). A mismatched issuer is 403.
        tenantId:
          type: string
          format: uuid
          description: Optional confirmation of the header-resolved tenant.
        workbenchKey:
          type: string
          description: Optional confirmation of the header-resolved workbench.
        workspaceId:
          type: string
          format: uuid
          description: Optional binding. Must match server resolution. Never the lookup key.
        capabilities:
          type: array
          items: {type: string}
          minItems: 1
        ttlSeconds:
          type: integer
          minimum: 15
          maximum: 300
    MintedEmbedAssertion:
      type: object
      required: [sdk, assertion, tokenId, audience, issuer, subject, tenantId, workbenchKey, capabilities, expiresAt, keyId, algorithm]
      properties:
        sdk: {type: string, example: embed.v1}
        assertion:
          type: string
          description: Compact JWS. Returned once. Never log or put in a URL.
        tokenId: {type: string, format: uuid}
        audience: {type: string, example: flowforge}
        issuer: {type: string}
        subject: {type: string}
        tenantId: {type: string, format: uuid}
        workbenchKey: {type: string}
        workspaceId: {type: string, format: uuid}
        capabilities:
          type: array
          items: {type: string}
        notBefore: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        keyId: {type: string}
        algorithm: {type: string, example: EdDSA}
        displayName: {type: string}
    RotateEmbedKeyRequest:
      type: object
      properties:
        action:
          type: string
          enum: [register-overlap, retire]
          default: register-overlap
        kid:
          type: string
          description: Required for retire when publicJwk.kid is omitted.
        publicJwk:
          type: object
          description: Public OKP/Ed25519 JWK only. Never include `d`.
          properties:
            kty: {type: string, enum: [OKP]}
            crv: {type: string, enum: [Ed25519]}
            x: {type: string}
            kid: {type: string}
            use: {type: string, enum: [sig]}
            alg: {type: string, enum: [EdDSA]}
        overlapUntil:
          type: string
          format: date-time
          description: |
            Required on register-overlap. RFC3339 expiry for the overlap
            verification window (must be in the future and no longer than
            4h). Missing, zero, past, or farther-future is 400. After this
            instant, exchange and JWKS drop the kid even if it is still in
            an in-memory ring (verify refreshes from the store). The active
            signing key is not an overlap key and does not use this field.
    ExchangeEmbedAssertionRequest:
      type: object
      required: [assertion]
      properties:
        assertion:
          type: string
          description: Compact JWS from POST /embed/assertions. Body only — never a URL.
        sdk:
          type: string
          example: embed.v1
        hostIssuer:
          type: string
          description: |
            Optional configured host issuer (same as X-FlowForge-Host-Issuer).
            Must equal assertion iss when sent. Must agree with the header
            when both are present.
        hostContext:
          type: string
          enum: [embed, portal]
          description: |
            Optional path declaration (same as X-FlowForge-Host-Context).
            Must agree with signed ctx when both are present.
    EmbedExchangeResponse:
      type: object
      required: [session, principal, csrf_token, assertion, workspace, tenant, capabilities]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        principal:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
        assertion:
          $ref: "#/components/schemas/EmbedAssertionPublic"
        workspace:
          $ref: "#/components/schemas/Workspace"
        tenant:
          $ref: "#/components/schemas/Tenant"
        capabilities:
          type: array
          items: {type: string}
    EmbedAssertionPublic:
      type: object
      description: Secret-free assertion metadata. Never includes the compact JWS or private keys.
      required: [sdk, tokenId, issuer, audience, subject, tenantId, workbenchKey, capabilities]
      properties:
        sdk: {type: string}
        tokenId: {type: string, format: uuid}
        issuer: {type: string}
        audience: {type: string}
        subject: {type: string}
        tenantId: {type: string, format: uuid}
        workbenchKey: {type: string}
        workspaceId: {type: string, format: uuid}
        capabilities:
          type: array
          items: {type: string}
        notBefore: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        keyId: {type: string}
        algorithm: {type: string}
        displayName: {type: string}
    WorkflowFieldError:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
          example: spec.nodes[0].with.namespace
        line:
          type: integer
        column:
          type: integer
        code:
          type: string
          example: invalid-uuid
        message:
          type: string
    WorkflowPort:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [object, string, integer, boolean, any]
        required:
          type: boolean
        classification:
          type: string
          enum: [public, internal, confidential, secret, inherit]
          description: Port data classification. `inherit` copies the inbound label. `secret` is never a legal payload.
        maxBytes:
          type: integer
        description:
          type: string
    WorkflowWithField:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
        required:
          type: boolean
        enum:
          type: array
          items:
            type: string
        description:
          type: string
    WorkflowNodePolicy:
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string
        retrySafe:
          type: boolean
        sideEffects:
          type: boolean
        idempotent:
          type: boolean
        cancellation:
          type: string
        verification:
          type: string
        defaultMaxAttempts:
          type: integer
    WorkflowNodeBounds:
      type: object
      properties:
        maxInputBytes:
          type: integer
        maxOutputBytes:
          type: integer
        maxWithBytes:
          type: integer
        maxAggregationItems:
          type: integer
        maxDurationSeconds:
          type: integer
    WorkflowRedactionPolicy:
      type: object
      properties:
        auditFields:
          type: array
          items:
            type: string
        redactInputs:
          type: boolean
        redactOutputs:
          type: boolean
        strategy:
          type: string
    WorkflowCatalog:
      type: object
      required: [apiVersion, triggers, nodes]
      properties:
        apiVersion:
          type: string
          example: flowforge/v1
        rules:
          type: object
          properties:
            triggersAreWorkflowLevel:
              type: boolean
            graphNodesExcludeTriggers:
              type: boolean
            unsupportedPhasesRejected:
              type: boolean
        triggers:
          type: array
          items:
            type: object
            required: [type, phase]
            properties:
              type:
                type: string
              phase:
                type: string
                enum: [core, next, provider]
              outputs:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowPort"
              title:
                type: string
              description:
                type: string
              allowedWith:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowWithField"
              bounds:
                $ref: "#/components/schemas/WorkflowNodeBounds"
              redaction:
                $ref: "#/components/schemas/WorkflowRedactionPolicy"
              start:
                type: object
                description: E10.1 authenticated manual-start contract for the run dialog.
                properties:
                  route:
                    type: string
                  method:
                    type: string
                  permission:
                    type: string
                  csrf:
                    type: boolean
                  publishedVersionRequired:
                    type: boolean
                  versionField:
                    type: string
                  inputField:
                    type: string
                  schemaFields:
                    type: array
                    items:
                      type: string
                  idempotencyKeyField:
                    type: string
                  idempotencyHeader:
                    type: string
                  idempotencyKeyRequired:
                    type: boolean
                  idempotencyKeyPattern:
                    type: string
                  maxInputBytes:
                    type: integer
                  createdStatus:
                    type: integer
                  replayStatus:
                    type: integer
                  conflictStatus:
                    type: integer
                  policyDenyStatus:
                    type: integer
                  approvalRequiredStatus:
                    type: integer
                  draftStatus:
                    type: integer
                  help:
                    type: string
              ingress:
                type: object
                description: E10.2 public webhook ingress contract. No session or CSRF.
                properties:
                  route: {type: string}
                  method: {type: string}
                  public: {type: boolean}
                  csrf: {type: boolean}
                  session: {type: boolean}
                  signatureHeader: {type: string}
                  timestampHeader: {type: string}
                  signatureVersion: {type: string}
                  idempotencyHeader: {type: string}
                  maxBodyBytes: {type: integer}
                  maxInputBytes: {type: integer}
                  clockSkewSeconds: {type: integer}
                  replayRetentionSeconds: {type: integer}
                  defaultRatePerMinute: {type: integer}
                  defaultWorkspaceRatePerMinute: {type: integer}
                  defaultMaxConcurrency: {type: integer}
                  defaultWorkspaceMaxConcurrency: {type: integer}
                  contentTypes:
                    type: array
                    items: {type: string}
                  createdStatus: {type: integer}
                  replayStatus: {type: integer}
                  conflictStatus: {type: integer}
                  unauthorizedStatus: {type: integer}
                  rateLimitedStatus: {type: integer}
                  tooLargeStatus: {type: integer}
                  disabledStatus: {type: integer}
                  help: {type: string}
              admin:
                type: object
                description: E10.2 cookie-session CRUD/rotate contract. Never returns plaintext secrets.
                properties:
                  listRoute: {type: string}
                  createRoute: {type: string}
                  itemRoute: {type: string}
                  rotateRoute: {type: string}
                  disableRoute: {type: string}
                  enableRoute: {type: string}
                  deleteRoute: {type: string}
                  permission: {type: string}
                  viewPermission: {type: string}
                  csrf: {type: boolean}
                  secretNeverReturned: {type: boolean}
                  help: {type: string}
        nodes:
          type: array
          items:
            type: object
            required: [type, phase]
            properties:
              type:
                type: string
              phase:
                type: string
                enum: [core, next, provider]
              title:
                type: string
              description:
                type: string
              inputs:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowPort"
              outputs:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowPort"
              requiredWith:
                type: array
                items:
                  type: string
              allowedWith:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowWithField"
              policy:
                $ref: "#/components/schemas/WorkflowNodePolicy"
              bounds:
                $ref: "#/components/schemas/WorkflowNodeBounds"
              redaction:
                $ref: "#/components/schemas/WorkflowRedactionPolicy"
    WorkflowDefinitionEnvelope:
      type: object
      required: [definitionYaml]
      properties:
        definitionYaml:
          type: string
          description: Canonical flowforge/v1 YAML document. Additive optional metadata.ui.layout (D1) is stored and returned; the executor ignores it.
    WorkflowUILayoutNode:
      type: object
      required: [x, y]
      additionalProperties: false
      properties:
        x:
          type: number
          description: Finite canvas X. Non-finite values are treated as absent (auto-layout).
        y:
          type: number
          description: Finite canvas Y. Non-finite values are treated as absent (auto-layout).
    WorkflowUILayout:
      type: object
      required: [version]
      additionalProperties: false
      description: >
        Optional non-authoritative canvas positions (D1 / issue #238). Node keys
        are a subset of spec.nodes[].id. Extra keys are stripped. Missing keys
        auto-place. Layout never carries edges, types, with, credentials, or
        ports. Executor, POST /policy/evaluate, port typing, and dispatch ignore
        it. Chloe UI (#238) reads this field; missing/invalid → auto-layout.
      properties:
        version:
          type: integer
          enum: [1]
        nodes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/WorkflowUILayoutNode"
    WorkflowUI:
      type: object
      additionalProperties: false
      properties:
        layout:
