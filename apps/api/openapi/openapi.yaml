        to allow when omitted). Stops the runner. A queued/claimed job that
        has not heartbeated is `canceled`. A running job or `uncertain=true`
        is `indeterminate` until verified — never claimed succeeded or failed.
        Viewers receive `403`. Host-supplied workspace IDs are `400`.
