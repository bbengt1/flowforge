        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/WorkflowID"
        - name: status
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        "200":
          description: Execution summaries
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: startWorkflowExecution
      summary: Start a durable execution
      description: |
        Requires `workflow.execute` and `workflowVersionId`.
        Drafts cannot run (`400` `invalid-request`). The created row
        stores `workflowVersionId` + `workflowDigest` and later draft
        edits cannot change that pin. Optional `idempotencyKey` (or
        `Idempotency-Key` header) is unique per
        `(workspace, workflowVersionId, key)`. Same fingerprint returns
        `200` with `replayed=true` and does not create steps/jobs again.
        A different fingerprint is `409`. Inputs are redacted before persist.
        E4.3 evaluates current target/action policy first.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/WorkflowID"
        - name: Idempotency-Key
          in: header
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartExecutionRequest"
      responses:
        "200":
          description: Idempotent replay of an existing execution
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "201":
          description: Created execution with redacted steps and jobs
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
