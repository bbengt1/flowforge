    get:
      operationId: getApproval
      summary: Get one approval
      description: Requires `approval.view`. Refreshes expiry and binding freshness.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/ApprovalID"
      responses:
        "200":
          description: Approval
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /approvals/{approvalId}/decide:
    post:
      operationId: decideApproval
      summary: Approve or reject
      description: |
        Requires `approval.decide` and the bound `approverRole` (or `admin`).
        Authorization is rechecked server-side. The requester cannot decide
        their own approval. Changed workflow version, target revision, or
        policy revision invalidates the row (`409`).
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/ApprovalID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecideRequest"
      responses:
        "200":
          description: Decision
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /approvals/{approvalId}/events:
    get:
      operationId: listApprovalEvents
      summary: Approval audit events
      description: Requires `approval.view`. Secret-free.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/ApprovalID"
      responses:
        "200":
          description: Events
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  pathItems:
    OpsCollection:
      get:
        summary: List operational configuration resources
        description: Requires `opsconfig.view`. Returns heads only (no draft spec).
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
        responses:
          "200":
            description: Resource summaries
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsResourceList"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
      post:
        summary: Create a draft resource
        description: Requires `opsconfig.edit`. Host-supplied `id` / `workspaceId` is `400`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsCreateRequest"
        responses:
          "201":
            description: Created draft
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsDetail"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "409":
            $ref: "#/components/responses/Conflict"
    OpsItem:
      get:
        summary: Get resource head
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Resource
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsResource"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsDraft:
      get:
        summary: Get mutable draft
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Draft
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsDraft"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
      put:
        summary: Conflict-safe draft save
        description: Requires `opsconfig.edit` and current `revision`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsSaveDraftRequest"
        responses:
          "200":
            description: Saved draft
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsDetail"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
    OpsPublish:
      post:
        summary: Publish an immutable revision
        description: Requires `opsconfig.publish`. Duplicate digest is `409`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        requestBody:
          required: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsPublishRequest"
        responses:
          "201":
            description: Published version
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsPublishResponse"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
    OpsVersions:
      get:
        summary: Version history
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Versions newest first
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsVersionList"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsVersion:
      get:
        summary: Frozen published snapshot
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
          - $ref: "#/components/parameters/OpsVersionID"
        responses:
          "200":
            description: Version
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsVersion"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsDisable:
      post:
        summary: Disable a resource
        description: Select and pin fail closed until re-enabled. Requires `opsconfig.edit`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Disabled resource
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsResource"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsEnable:
      post:
        summary: Re-enable a resource
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Enabled resource
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsResource"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsSelect:
      post:
        summary: Server-authorized selection
        description: Pins an exact published revision. Drafts are `400`. Cross-workspace IDs are `404`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        requestBody:
          required: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsSelectRequest"
        responses:
          "200":
            description: Pin
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsPin"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation identifier. Accepted only when 16–128 ASCII letters, digits, or hyphens.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9-]{16,128}$
    Issuer:
      name: X-FlowForge-Issuer
      in: header
      required: false
      description: |
        Host identity issuer for non-browser callers. Browser clients should
        use `ff_session` instead. Ignored when a session cookie is present
        unless it conflicts (conflict fails closed). Does not authorize a workspace.
      schema:
        type: string
    Subject:
      name: X-FlowForge-Subject
      in: header
      required: false
      description: Host identity subject. Unique with issuer. Does not authorize a workspace.
      schema:
        type: string
    DisplayName:
      name: X-FlowForge-Display-Name
      in: header
      required: false
      description: Optional display name applied on user upsert.
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        Required on state-changing requests authenticated by `ff_session`.
        Must match the `ff_csrf` cookie and the server-side session secret.
      schema:
        type: string
    TenantID:
      name: X-FlowForge-Tenant-ID
      in: header
      required: false
      description: Tenant UUID used with workbench_key to resolve workspace identity.
      schema:
        type: string
        format: uuid
    TenantSlug:
      name: X-FlowForge-Tenant-Slug
      in: header
      required: false
      description: Tenant slug used with workbench_key when tenant id is omitted.
      schema:
        type: string
    WorkbenchKey:
      name: X-FlowForge-Workbench-Key
      in: header
      required: false
      description: Host workbench key. Combined with tenant identity, this is the only accepted workspace lookup.
      schema:
        type: string
    HostWorkspaceID:
      name: X-FlowForge-Workspace-ID
      in: header
      required: false
      description: Untrusted host-supplied workspace UUID. Rejected unless it matches the server-derived `(tenant, workbench_key)` workspace.
      schema:
        type: string
        format: uuid
    WorkflowID:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionID:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialID:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobID:
      name: jobId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApprovalID:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OpsResourceID:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OpsVersionID:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    XRequestID:
      description: Correlation identifier. Caller values are accepted only when 16–128 ASCII letters, digits, or hyphens.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9-]{16,128}$
  schemas:
    OpsCatalog:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          items:
            type: object
            required: [kind, collection, yamlFields, usePermission]
            properties:
              kind: {type: string}
              collection: {type: string}
              displayName: {type: string}
              yamlFields:
                type: array
                items: {type: string}
              usePermission: {type: string}
    OpsResource:
      type: object
      required: [id, kind, slug, name, status, draftRevision]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        slug: {type: string}
        name: {type: string}
        status: {type: string, enum: [draft, published, disabled]}
        draftRevision: {type: integer}
        draftDigest: {type: string}
        latestVersionNumber: {type: integer}
        latestVersionId: {type: string}
        latestVersionDigest: {type: string}
        credentialId: {type: string}
        policyId: {type: string}
    OpsDraft:
      type: object
      required: [resourceId, kind, revision, spec, digest]
      properties:
        resourceId: {type: string, format: uuid}
        kind: {type: string}
        revision: {type: integer}
        spec: {type: object, additionalProperties: true}
        digest: {type: string}
    OpsVersion:
      type: object
      required: [id, resourceId, kind, versionNumber, spec, digest]
      properties:
        id: {type: string, format: uuid}
        resourceId: {type: string, format: uuid}
        kind: {type: string}
        versionNumber: {type: integer}
        spec: {type: object, additionalProperties: true}
        digest: {type: string}
        publishNote: {type: string}
    OpsPin:
      type: object
      required: [kind, resourceId, versionId, versionNumber, digest]
      properties:
        kind: {type: string}
        resourceId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        versionNumber: {type: integer}
        digest: {type: string}
        name: {type: string}
        slug: {type: string}
        spec: {type: object, additionalProperties: true}
    OpsDetail:
      type: object
      required: [resource, draft]
      properties:
        resource: {$ref: "#/components/schemas/OpsResource"}
        draft: {$ref: "#/components/schemas/OpsDraft"}
    OpsPublishResponse:
      type: object
      required: [resource, version]
      properties:
        resource: {$ref: "#/components/schemas/OpsResource"}
        version: {$ref: "#/components/schemas/OpsVersion"}
    OpsResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/OpsResource"}
    OpsVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/OpsVersion"}
    OpsPinList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/OpsPin"}
    PolicyEvaluateRequest:
      type: object
      required: [workflowId, workflowVersionId]
      properties:
        workflowId: {type: string, format: uuid}
        workflowVersionId: {type: string, format: uuid}
    PolicyEvaluateResponse:
      type: object
      required: [decision, dispatchAllowed, operations, requirements, denied, evaluatedAt]
      properties:
        decision: {type: string, enum: [allow, deny, approval-required]}
        dispatchAllowed: {type: boolean}
        operations:
          type: array
          items: {$ref: "#/components/schemas/PolicyOperationResult"}
        requirements:
          type: array
          items: {$ref: "#/components/schemas/ApprovalRequirement"}
        denied:
          type: array
          items: {$ref: "#/components/schemas/PolicyOperationResult"}
        evaluatedAt: {type: string, format: date-time}
        workflowVersionId: {type: string, format: uuid}
        workflowDigest: {type: string}
        approvals:
          type: array
          items: {$ref: "#/components/schemas/Approval"}
    PolicyOperationResult:
      type: object
      required: [nodeId, operation, decision]
      properties:
        nodeId: {type: string}
        operation: {type: string}
        decision: {type: string, enum: [allow, deny, approval-required]}
        reason: {type: string}
        requirement: {$ref: "#/components/schemas/ApprovalRequirement"}
    ApprovalRequirement:
      type: object
      required: [nodeId, operation, approverRole, expiresIn, expiresAt]
      properties:
        nodeId: {type: string}
        nodeName: {type: string}
        operation: {type: string}
        targetKind: {type: string}
        targetId: {type: string, format: uuid}
        targetVersionId: {type: string, format: uuid}
        targetDigest: {type: string}
        policyResourceId: {type: string, format: uuid}
        policyVersionId: {type: string, format: uuid}
        policyDigest: {type: string}
        policyRevision: {type: integer}
        approverRole: {type: string}
        expiresIn: {type: string}
        expiresAt: {type: string, format: date-time}
        reason: {type: string}
    Approval:
      type: object
      required: [id, workflowId, workflowVersionId, workflowDigest, nodeId, operation, bindingFingerprint, approverRole, status, expiresAt]
      properties:
        id: {type: string, format: uuid}
        workflowId: {type: string, format: uuid}
        workflowVersionId: {type: string, format: uuid}
        workflowDigest: {type: string}
        executionId: {type: string, format: uuid}
        nodeId: {type: string}
        nodeName: {type: string}
        operation: {type: string}
        targetKind: {type: string}
        targetId: {type: string, format: uuid}
        targetVersionId: {type: string, format: uuid}
        targetDigest: {type: string}
        policyResourceId: {type: string, format: uuid}
        policyVersionId: {type: string, format: uuid}
        policyDigest: {type: string}
        policyRevision: {type: integer}
        bindingFingerprint: {type: string}
        approverRole: {type: string}
        status: {type: string, enum: [pending, approved, rejected, expired, invalidated]}
        expiresAt: {type: string, format: date-time}
        requestedBy: {type: string, format: uuid}
        decidedBy: {type: string, format: uuid}
        decidedAt: {type: string, format: date-time}
        decisionNote: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ApprovalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Approval"}
    ApprovalCatalog:
      type: object
      required: [statuses, decisions, defaultExpiresIn]
      properties:
        statuses:
          type: array
          items: {type: string}
        decisions:
          type: array
          items: {type: string}
        defaultExpiresIn: {type: string}
    ApprovalCreateRequest:
      type: object
      required: [workflowId, workflowVersionId]
      properties:
        workflowId: {type: string, format: uuid}
        workflowVersionId: {type: string, format: uuid}
        executionId: {type: string, format: uuid}
        nodeId: {type: string}
    ApprovalDecideRequest:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [approved, rejected, approve, reject]}
