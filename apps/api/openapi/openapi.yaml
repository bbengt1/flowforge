          items: {type: string}
        overlapPolicies:
          type: array
          items: {type: string}
        misfirePolicies:
          type: array
          items: {type: string}
        defaultOverlapPolicy: {type: string}
        defaultMisfirePolicy: {type: string}
        defaultCatchUp: {type: integer}
        maxCatchUp: {type: integer}
        timezoneRequired: {type: boolean}
        safeDefaults: {type: string}
        failClosedUnpublished: {type: boolean}
