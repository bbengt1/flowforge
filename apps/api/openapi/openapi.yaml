        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /machine/principals/{id}/revoke:
    post:
      operationId: revokeMachinePrincipal
      summary: Revoke a machine principal
      description: |
        Requires `platform.administer` and CSRF. Disables the user and
        revokes live `ff_session` cookies for that principal. Empty body.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
