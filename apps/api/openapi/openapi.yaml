          type: string
        triggerId:
          type: string
          format: uuid
    WorkflowExecution:
      type: object
      required: [id, workflowId, workflowVersionId, workflowDigest, status, createdAt, input, policySnapshot, replayed]
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        workflowSlug:
          type: string
        workflowName:
          type: string
        workflowVersionId:
          type: string
          format: uuid
        workflowDigest:
          type: string
        triggerId:
          type: string
        status:
          type: string
          enum: [queued, pinned, running, succeeded, failed, canceled, indeterminate]
        idempotencyKey:
          type: string
        input:
          type: object
          additionalProperties: true
        policySnapshot:
          type: object
          additionalProperties: true
        correlationId:
          type: string
        requestedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        retentionUntil:
          type: string
          format: date-time
        replayed:
          type: boolean
        pins:
          type: array
          items: {$ref: "#/components/schemas/OpsPin"}
        steps:
          type: array
          items: {$ref: "#/components/schemas/ExecutionStep"}
        artifacts:
          type: array
          items: {$ref: "#/components/schemas/ExecutionArtifact"}
          description: Artifact metadata only (E5.3). Never includes storage locators or credentials.
        jobs:
          type: array
          items: {$ref: "#/components/schemas/ExecutionJob"}
        auditEvents:
          type: array
          items: {$ref: "#/components/schemas/AuditEvent"}
    ExecutionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/WorkflowExecution"}
    ExecutionStep:
      type: object
      required: [id, executionId, nodeId, nodeType, attempt, status, input, output, error]
      properties:
        id: {type: string, format: uuid}
        executionId: {type: string, format: uuid}
        nodeId: {type: string}
        nodeType: {type: string}
        attempt: {type: integer}
        status:
          type: string
          enum: [queued, running, succeeded, failed, canceled, indeterminate]
        leaseId: {type: string}
        fencingToken: {type: integer}
        idempotencyKey: {type: string}
        policySnapshot: {type: object, additionalProperties: true}
        targetSnapshot: {type: object, additionalProperties: true}
        input: {type: object, additionalProperties: true}
        output: {type: object, additionalProperties: true, description: "Redacted, size-bounded step output (E5.3)."}
        error: {type: object, additionalProperties: true}
        outputTruncated: {type: boolean, description: "True when output or error maps were truncated for the response."}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ExecutionStepList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ExecutionStep"}
    ExecutionJob:
      type: object
      required: [id, executionId, executionStepId, status, availableAt, attempt]
      properties:
        id: {type: string, format: uuid}
        executionId: {type: string, format: uuid}
        executionStepId: {type: string, format: uuid}
        status:
          type: string
          enum: [queued, claimed, running, succeeded, failed, canceled, indeterminate]
        availableAt: {type: string, format: date-time}
        leaseExpiresAt: {type: string, format: date-time}
        heartbeatAt: {type: string, format: date-time}
        workerId: {type: string}
        fencingToken: {type: integer}
        attempt: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ExecutionJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ExecutionJob"}
    JobBinding:
      type: object
      required: [workspaceId, executionId, jobId, stepId, workflowId, workflowVersionId, workflowDigest, policyDigest, fencingToken, expiresAt, leaseExpiresAt]
      properties:
        workspaceId: {type: string, format: uuid}
        executionId: {type: string, format: uuid}
        jobId: {type: string, format: uuid}
        stepId: {type: string, format: uuid}
        workflowId: {type: string, format: uuid}
        workflowVersionId: {type: string, format: uuid}
        workflowDigest: {type: string}
        policyDigest: {type: string}
        correlationId: {type: string}
        fencingToken: {type: integer}
        expiresAt: {type: string, format: date-time}
        leaseExpiresAt: {type: string, format: date-time}
    ClaimJobRequest:
      type: object
      required: [workerId]
      properties:
        workerId: {type: string, minLength: 1, maxLength: 200}
        leaseSeconds: {type: integer, minimum: 1, maximum: 300}
        id: {type: string, description: "Rejected if present"}
        workspaceId: {type: string, description: "Rejected if present"}
    ClaimJobResponse:
      type: object
      required: [claimed, jobToken, binding, job, step, execution]
      properties:
        claimed: {type: boolean}
        jobToken: {type: string}
        binding: {$ref: "#/components/schemas/JobBinding"}
        job: {$ref: "#/components/schemas/ExecutionJob"}
        step: {$ref: "#/components/schemas/ExecutionStep"}
        execution: {$ref: "#/components/schemas/WorkflowExecution"}
        recovered: {type: integer}
    JobActionRequest:
      type: object
      required: [jobToken, workerId]
      properties:
        jobToken: {type: string}
        workerId: {type: string}
        fencingToken: {type: integer}
        leaseSeconds: {type: integer, minimum: 1, maximum: 300}
        output: {type: object, additionalProperties: true}
        error: {type: object, additionalProperties: true}
        id: {type: string, description: "Rejected if present"}
        workspaceId: {type: string, description: "Rejected if present"}
    DispatchJobResponse:
      type: object
      required: [job, step, execution]
      properties:
        job: {$ref: "#/components/schemas/ExecutionJob"}
        step: {$ref: "#/components/schemas/ExecutionStep"}
        execution: {$ref: "#/components/schemas/WorkflowExecution"}
    RecoverJobsResponse:
      type: object
      required: [recovered]
      properties:
        recovered: {type: integer}
    ExecutionArtifact:
      type: object
      additionalProperties: false
      required: [id, executionId, kind, filename, contentType, digest, sizeBytes, contentClassification, redacted, expiresAt, createdAt, updatedAt, legalHold]
      properties:
        id: {type: string, format: uuid}
        executionId: {type: string, format: uuid}
        executionStepId: {type: string, format: uuid}
        kind: {type: string, enum: [log, output, file]}
        filename: {type: string}
        contentType: {type: string}
        digest: {type: string, description: "sha256:<hex> of the scanned payload"}
        sizeBytes: {type: integer, format: int64}
        contentClassification: {type: string, enum: [public, internal, confidential]}
        redacted: {type: boolean}
        expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        legalHold: {type: boolean}
        legalHoldReason: {type: string}
        legalHoldBy: {type: string, format: uuid}
        legalHoldAt: {type: string, format: date-time}
      description: |
        Artifact metadata. The API never returns `storageRef`, envelope
        ciphertext, DEK material, bucket names, or durable public URLs.
    ExecutionArtifactList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ExecutionArtifact"}
    UploadArtifactRequest:
      type: object
      additionalProperties: false
      properties:
        kind: {type: string, enum: [log, output, file]}
        filename: {type: string}
        contentType: {type: string, enum: [text/plain, application/json, application/octet-stream]}
        contentClassification: {type: string, enum: [public, internal, confidential]}
        content: {type: string, description: "UTF-8 artifact body. Scanned before persist."}
        contentBase64: {type: string, description: "Optional base64 body when content is binary."}
        id: {type: string, description: "Rejected if present"}
        workspaceId: {type: string, description: "Rejected if present"}
        storageRef: {type: string, description: "Rejected if present"}
        url: {type: string, description: "Rejected if present"}
        bucket: {type: string, description: "Rejected if present"}
        key: {type: string, description: "Rejected if present"}
    ArtifactDownload:
      type: object
      additionalProperties: false
      required: [id, artifactId, expiresAt, href, method]
      properties:
        id: {type: string, format: uuid}
        artifactId: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time}
        href: {type: string, description: "Same-origin path `/api/v1/artifact-downloads/{id}`."}
        method: {type: string, enum: [GET]}
    ArtifactDownloadEnvelope:
      type: object
      required: [download]
      properties:
        download: {$ref: "#/components/schemas/ArtifactDownload"}
    StepLogs:
      type: object
      required: [lines, offset, nextOffset, truncated, maxBytes]
      properties:
        lines: {type: array, items: {type: string}}
        offset: {type: integer}
        nextOffset: {type: integer}
        truncated: {type: boolean}
        maxBytes: {type: integer}
    LegalHoldRequest:
      type: object
      additionalProperties: false
      required: [hold]
      properties:
        hold: {type: boolean}
        reason: {type: string, description: "Required when placing a hold."}
        id: {type: string, description: "Rejected if present"}
        workspaceId: {type: string, description: "Rejected if present"}
    RetentionPurgeResult:
      type: object
      required: [purged, held, executions, audits]
      properties:
        purged: {type: integer, description: "Artifact metadata+payload rows deleted"}
        held: {type: integer, description: "Expired artifacts skipped because of legal hold"}
        executions: {type: integer, description: "Expired executions purged"}
        audits: {type: integer, description: "Expired audit rows purged"}
    EmptyDispatchRequest:
      type: object
      properties:
        id: {type: string, description: "Rejected if present"}
        workspaceId: {type: string, description: "Rejected if present"}
    RetryRequest:
      type: object
      properties:
        stepId: {type: string, format: uuid}
        id: {type: string, description: "Rejected if present"}
        workspaceId: {type: string, description: "Rejected if present"}
    RetryResponse:
      type: object
      required: [execution, step, job]
      properties:
        execution: {$ref: "#/components/schemas/WorkflowExecution"}
        step: {$ref: "#/components/schemas/ExecutionStep"}
        job: {$ref: "#/components/schemas/ExecutionJob"}
    AuditEvent:
      type: object
      required: [id, action, resourceType, outcome, occurredAt, details, hostContext]
      properties:
        id: {type: string, format: uuid}
        actorId: {type: string}
        hostContext: {type: object, additionalProperties: true}
        action: {type: string}
        resourceType: {type: string}
        resourceId: {type: string}
        outcome: {type: string}
        correlationId: {type: string}
        details: {type: object, additionalProperties: true}
        occurredAt: {type: string, format: date-time}
        retentionUntil: {type: string, format: date-time}
    AuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AuditEvent"}
    CurrentWorkspace:
      type: object
      required: [workspace, tenant, principal, roles, permissions]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        tenant:
          $ref: "#/components/schemas/Tenant"
        principal:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    Member:
      type: object
      required: [user, roles, permissions]
      properties:
        user:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    MembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [workspace, tenant, roles, permissions]
            properties:
              workspace:
                $ref: "#/components/schemas/Workspace"
              tenant:
                $ref: "#/components/schemas/Tenant"
              roles:
                type: array
                items:
                  type: string
              permissions:
                type: array
                items:
                  type: string
    PermissionMatrix:
      type: object
      required: [permissions, roles]
      properties:
        permissions:
          type: array
          items:
            type: object
            required: [key, family]
            properties:
              key:
                type: string
              family:
                type: string
                enum: [view, edit, publish, execute, credential, approval, administration]
        roles:
          type: array
          items:
            type: object
            required: [key, description, permissions]
            properties:
              key:
                type: string
              description:
                type: string
              permissions:
                type: array
                items:
                  type: string
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                type: string
              description:
                type: string
              permissions:
                type: array
                items:
                  type: string
    CredentialType:
      type: string
      enum: [kubernetes, ssh_private_key, token, webhook_secret, provider]
    Credential:
      type: object
      description: Safe credential metadata. Never includes secret, ciphertext, or DEK fields.
      required: [id, type, displayName, status, tags, metadata, fingerprint, lastTestStatus]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/CredentialType"
        displayName:
          type: string
        status:
          type: string
          enum: [active, disabled]
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        fingerprint:
          type: string
        encryptionVersion:
          type: integer
        keyReference:
          type: string
        lastTestStatus:
          type: string
          enum: [untested, passed, failed]
        lastTestedAt:
          type: string
          format: date-time
        lastTestReason:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        lastUsedBy:
          type: string
        useCount:
          type: integer
        rotatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        disabledAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        permittedActions:
          type: array
          items:
            type: string
    CredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
    CreateCredentialRequest:
      type: object
      required: [type, displayName, secret]
      properties:
        type:
          $ref: "#/components/schemas/CredentialType"
        displayName:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
        secret:
          type: object
          additionalProperties:
            type: string
          description: Plaintext accepted only on create/rotate; never returned.
    UpdateCredentialRequest:
      type: object
      properties:
        displayName:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    CredentialCatalog:
      type: object
      required: [types]
      properties:
        types:
          type: array
          items:
            type: object
            required: [type, displayName, secretFields]
            properties:
              type:
                $ref: "#/components/schemas/CredentialType"
              displayName:
                type: string
              secretFields:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialField"
              metadataFields:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialField"
    CredentialField:
      type: object
      required: [name, input]
      properties:
        name:
          type: string
        input:
          type: string
        required:
          type: boolean
    CredentialTestResponse:
      type: object
      required: [result, credential]
      properties:
        result:
          type: object
          required: [status, reason, checkedAt]
          properties:
            status:
              type: string
              enum: [passed, failed]
            reason:
              type: string
            checkedAt:
              type: string
              format: date-time
        credential:
          $ref: "#/components/schemas/Credential"
    CredentialRef:
      type: object
      required: [kind, workflowId]
      properties:
        kind:
          type: string
          enum: [draft, version, execution]
        workflowId:
          type: string
        workflowSlug:
          type: string
        workflowName:
          type: string
        versionId:
          type: string
        versionNumber:
          type: integer
        executionId:
          type: string
        executionStatus:
          type: string
    CredentialUsage:
      type: object
      required: [credentialId, drafts, versions, executions]
      properties:
        credentialId:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        lastUsedBy:
          type: string
        useCount:
          type: integer
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
        executions:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
    CredentialDeletionImpact:
      type: object
      required: [credentialId, displayName, status, canDelete, drafts, versions, activeExecutions]
      properties:
        credentialId:
          type: string
        displayName:
          type: string
        status:
          type: string
        canDelete:
          type: boolean
        blockReason:
          type: string
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
        activeExecutions:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
    CredentialEvent:
      type: object
      required: [id, credentialId, eventType, details, occurredAt]
      properties:
        id:
          type: string
        credentialId:
          type: string
        eventType:
          type: string
        actorId:
          type: string
        details:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
    CredentialEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CredentialEvent"
    IsolationKind:
      type: string
      enum: [credential, artifact, job, cache, realtime, audit]
    WorkspaceRecord:
      type: object
      required: [workspace_id, id, kind, name, created_at]
      properties:
        workspace_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/IsolationKind"
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    WorkspaceRecordList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceRecord"
    WorkspaceRecordLink:
      type: object
      required: [workspace_id, id, parent_id, kind, created_at]
      properties:
        workspace_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/IsolationKind"
        created_at:
          type: string
          format: date-time
    CacheValue:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
    PermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                type: string
  responses:
    InvalidWorkflow:
      description: Workflow YAML failed parse, normalization, or graph validation
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:invalid-workflow
            title: Invalid Workflow
            status: 400
            detail: The workflow definition is not valid.
            instance: /api/v1/workflows/validate
            code: invalid-workflow
            request_id: 0123456789abcdef0123456789abcdef
            errors:
              - path: spec.edges[0].from
                line: 24
                column: 11
                code: cycle
                message: Workflow graph contains a cycle.
    InvalidRequest:
      description: Malformed JSON, missing body, or unsupported Content-Type
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:invalid-request
            title: Invalid Request
            status: 400
            detail: Request body is not valid JSON.
            instance: /api/v1/example
            code: invalid-request
            request_id: 0123456789abcdef0123456789abcdef
    Unauthenticated:
      description: Missing or invalid credentials
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:unauthenticated
            title: Unauthenticated
            status: 401
            detail: Authentication is required.
            instance: /api/v1/example
            code: unauthenticated
            request_id: 0123456789abcdef0123456789abcdef
    Forbidden:
      description: Authenticated caller is not authorized
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:forbidden
            title: Forbidden
            status: 403
            detail: You are not authorized to perform this action.
            instance: /api/v1/example
            code: forbidden
            request_id: 0123456789abcdef0123456789abcdef
    Conflict:
      description: Unique identity collision or last-admin protection
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:conflict
            title: Conflict
            status: 409
            detail: A unique identity already exists.
            instance: /api/v1/workspaces
            code: conflict
            request_id: 0123456789abcdef0123456789abcdef
    NotFound:
      description: The requested path does not exist
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:not-found
            title: Not Found
            status: 404
            detail: The requested path does not exist.
            instance: /api/v1/missing
            code: not-found
            request_id: 0123456789abcdef0123456789abcdef
    MethodNotAllowed:
      description: HTTP method is not allowed for this path
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Allow:
          schema:
            type: string
            example: GET, HEAD
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:method-not-allowed
            title: Method Not Allowed
            status: 405
            detail: The POST method is not allowed for this path.
            instance: /api/v1/health
            code: method-not-allowed
            request_id: 0123456789abcdef0123456789abcdef
    RequestTooLarge:
      description: Request body exceeds 1048576 bytes
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:request-too-large
            title: Request Too Large
            status: 413
            detail: The request body exceeds the 1048576 byte limit.
            instance: /api/v1/health
            code: request-too-large
            request_id: 0123456789abcdef0123456789abcdef
    InternalError:
      description: Unexpected server failure
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:internal-error
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred.
            instance: /api/v1/health
            code: internal-error
            request_id: 0123456789abcdef0123456789abcdef
    DependencyUnavailable:
      description: Required dependency is not configured or reachable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:dependency-unavailable
            title: Dependency Unavailable
            status: 503
            detail: Credential encryption key is not configured.
            instance: /api/v1/credentials
            code: dependency-unavailable
            request_id: 0123456789abcdef0123456789abcdef
