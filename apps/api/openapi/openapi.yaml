        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    WorkflowDetail:
      type: object
      required: [workflow, draft]
      properties:
        workflow:
          $ref: "#/components/schemas/WorkflowRecord"
        draft:
          $ref: "#/components/schemas/WorkflowDraft"
    WorkflowVersion:
      type: object
