      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        definitionYaml:
          type: string
        digest:
          type: string
        summary:
          $ref: "#/components/schemas/WorkflowSummary"
        publishNote:
          type: string
        publishedBy:
          type: string
        publishedAt:
          type: string
          format: date-time
    WorkflowVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowVersion"
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Applied page size. Default 50. Always present.
        cursor:
          type: string
          description: Opaque keyset token that produced this page. Empty on the first page. Always present.
        next:
          type: string
