openapi: 3.0.3
info:
  title: FlowForge Control Plane API
  version: 0.26.0
  description: |
    Versioned control-plane API. Conventions:

    - Correlation: every response sets `X-Request-ID`. A caller value is
      accepted only when it is 16–128 ASCII letters, digits, or hyphens;
      otherwise the API generates one. The same id is returned in problem
      documents as `request_id` and in structured request logs.
    - Errors: 4xx/5xx responses use RFC 9457 `application/problem+json`
      (`type`, `title`, `status`, `detail`, `instance`) plus `code` and
      `request_id`. Problem details never echo request bodies, credentials,
      or other secret material.
      - Invalid requests use `invalid-request` (400) or `request-too-large` (413).
      Invalid workflow YAML uses `invalid-workflow` (400) with an `errors`
      array (path, line, column, code, message). Authenticated-but-failed
      flows use `unauthenticated` (401) and `forbidden` (403). Unique
      identity collisions, draft revision mismatches, and duplicate
      published digests use `conflict` (409).
    - Browser clients authenticate with `ff_session` / `ff_csrf` cookies from
      standalone `POST /login` (local email/username + password) or
      `POST /embed/exchange`. Trusted-dev `POST /session` stays non-prod
      fail-closed. State-changing cookie requests require `X-CSRF-Token`.
      Production does not accept self-asserted `X-FlowForge-Issuer` /
      `X-FlowForge-Subject` as authentication. That path exists only when
      `TRUSTED_DEV_IDENTITY_HEADERS` is explicitly enabled in a non-production
      `APP_ENV`. A session cookie wins; conflicting identity headers fail
      closed. OIDC Authorization Code + PKCE is `POST /oidc/start` and
      `POST /oidc/callback` (enterprise IdP). It mints the same
      `ff_session` / `ff_csrf` pair as local login. `client_secret` and
      the PKCE verifier stay on the server. MFA step-up (`GET`/`POST`
      `/session/mfa`) gates `platform.administer` and `credential.*` on
      local-login and OIDC sessions (`403` `mfa-required`). Trusted-dev,
      machine, and embed sessions are not that gate. There is no
      IdP-admin API.
      `POST /tenants` and `POST /workspaces` require
      `platform.administer` (`PLATFORM_ADMINS`) on a non-embed session.
      Embed-origin sessions are `403` and cannot bootstrap tenants or
      sibling workbenches.
    - Workspace identity is server-derived from `(tenant_id|tenant_slug,
      workbench_key)`. A host-supplied workspace UUID is never the lookup key
      and is rejected when it is the only identity or does not match resolution.
    - Workspace-owned queries set transaction-local `app.workspace_id` only
      after membership authorization. Cross-workspace reads, writes,
      credential use, artifact access, and realtime subscribe fail closed.
    - CORS is an exact origin allowlist (`CORS_ALLOWED_ORIGINS`). Empty
      allowlist plus a foreign `Origin` fails closed. Wildcard credentialed
      CORS is rejected at process start.
    - Request bodies are capped at 1048576 bytes.
    - OpenAPI is published at `/api/v1/openapi.yaml`, `/api/v1/openapi.json`,
      and `/api/v1/swagger`. Those routes and `/metrics` require an
      authenticated principal with `platform.administer` (`PLATFORM_ADMINS`)
      or a machine principal granted `ops.metrics.read`. Scrapers mint
      `ff_session` at `POST /machine/token` (`client_id` + secret or
      signed assertion) and send `Authorization: Bearer <ff_session>` or
      the `ff_session` cookie. That door is not `POST /login`, trusted-dev
      `POST /session`, or `POST /embed/exchange`. `GET /health` and
      `GET /readiness` stay unauthenticated for Kubernetes probes. `GET /bootstrap` is the standalone first-run gate
      (incomplete installs may call it without a session; complete requires
      normal auth).       `POST /bootstrap/persistence` is wizard step 1 (B.2).
      `POST /bootstrap/admins` is wizard step 2 (B.3).
      `POST /bootstrap/public-url` is wizard step 3 (B.4).
      `POST /bootstrap/tls` is wizard step 4 (B.5 / B.7) and marks
      bootstrap complete (`create-self-signed`, `upload`, or `skip`).
      It must not be used to gate `/embed/v1`.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process liveness
      description: |
        Returns process liveness plus non-secret `version` / `sha`.
        Does not check dependencies. Missing build identity is
        `dev` / `unknown` and does not fail the probe.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: dev
                sha: unknown
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /readiness:
    get:
      operationId: getReadiness
      summary: PostgreSQL dependency readiness
      description: |
        Returns ready when PostgreSQL is reachable, plus the same
        non-secret `version` / `sha` as `/health`. Otherwise a
        problem details response (no version metadata).
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: PostgreSQL is reachable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
                version: dev
                sha: unknown
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: PostgreSQL is not reachable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: urn:flowforge:problem:dependency-unavailable
                title: Dependency Unavailable
                status: 503
                detail: PostgreSQL is not reachable
                instance: /api/v1/readiness
                code: dependency-unavailable
                request_id: 0123456789abcdef0123456789abcdef
  /bootstrap:
    get:
      operationId: getBootstrap
      summary: First-run bootstrap status
      description: |
        Standalone first-run wizard gate. Status flags only — never
        secrets, KEK, password hashes, private keys, or the stored
        public base URL.

        Auth: when `complete` is false (no admin / wizard in progress),
        this GET is unauthenticated so the wizard can start. After
        `complete` is true, a normal product session (cookie) or
        trusted-dev identity headers are required (`401` otherwise).

        **Never gate `/embed/v1` with this endpoint.** Embed never
        shows the wizard. `standaloneOnly` is always true. After
        complete, further URL / TLS / user / persistence edits live
        in Settings only.

        Trusted-dev / compose localseed that already created an admin
        and public URL marks `complete=true` / `incomplete=false` /
        `skipped=true`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Bootstrap status (no secrets)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
              examples:
                incomplete:
                  value:
                    complete: false
                    incomplete: true
                    skipped: false
                    standaloneOnly: true
                    steps:
                      persistence:
                        ready: false
                      firstAdmin:
                        ready: false
                      publicUrl:
                        ready: false
                      tls:
                        ready: false
                complete:
                  value:
                    complete: true
                    incomplete: false
                    skipped: true
                    standaloneOnly: true
                    steps:
                      persistence:
                        ready: true
                      firstAdmin:
                        ready: true
                      publicUrl:
                        ready: true
                      tls:
                        ready: false
                tlsSkipped:
                  summary: Wizard skip TLS (B.7); Settings can enable later
                  value:
                    complete: true
                    incomplete: false
                    skipped: false
                    standaloneOnly: true
                    steps:
                      persistence:
                        ready: true
                      firstAdmin:
                        ready: true
                      publicUrl:
                        ready: true
                      tls:
                        ready: true
                        mode: skipped
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /bootstrap/persistence:
    post:
      operationId: confirmBootstrapPersistence
      summary: Confirm first-run persistence
      description: |
        Wizard step 1 (B.2). Confirms that process `DATABASE_URL`
        PostgreSQL is reachable, then sets `steps.persistence.ready=true`
        via the bootstrap store. Does **not** mark bootstrap `complete`.

        Body is `{confirm:true}` only — never a DSN, password, or
        `DATABASE_URL`. The operator-facing check is a server-side
        PostgreSQL ping using the process environment.

        Auth matches incomplete-install `GET /bootstrap`: no session is
        required while the gate is incomplete. After `complete`, this
        wizard handler is **409 Conflict** (Settings-only). Embed
        sessions are `403`. CSRF is required when an `ff_session` cookie
        is presented.

        Success is status-only (`BootstrapStatus`). Never returns
        secrets, KEK, or connection strings.

        **Never call this from `/embed/v1`.**
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapPersistenceConfirm"
            example:
              confirm: true
      responses:
        "200":
          description: Persistence ready (status only; bootstrap not complete)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
              example:
                complete: false
                incomplete: true
                skipped: false
                standaloneOnly: true
                steps:
                  persistence:
                    ready: true
                  firstAdmin:
                    ready: false
                  publicUrl:
                    ready: false
                  tls:
                    ready: false
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: |
            Bootstrap is already complete. Wizard mutations are
            Settings-only after complete.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: urn:flowforge:problem:conflict
                title: Conflict
                status: 409
                detail: Bootstrap is already complete. Persistence is edited in Settings.
                instance: /api/v1/bootstrap/persistence
                code: conflict
                request_id: 0123456789abcdef0123456789abcdef
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: PostgreSQL is not reachable, or the bootstrap store is down
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: urn:flowforge:problem:dependency-unavailable
                title: Dependency Unavailable
                status: 503
                detail: PostgreSQL is not reachable
                instance: /api/v1/bootstrap/persistence
                code: dependency-unavailable
                request_id: 0123456789abcdef0123456789abcdef
  /bootstrap/admins:
    post:
      operationId: createBootstrapAdmins
      summary: Create first-run admin user
      description: |
        Wizard step 2 (B.3). Upserts the first admin identity using the
        same issuer + external_subject pattern as localseed
        `PLATFORM_ADMINS`, then create-or-binds workspace admin on the
        default tenant/workbench (`local` / `default`, created if
        missing so path-2 with `SEED_LOCAL_DEFAULTS=0` still has a
        selectable workbench after `POST /login`). Then sets
        `steps.firstAdmin.ready=true` via the bootstrap store. Does
        **not** mark bootstrap `complete` (public URL and TLS are still
        required).

        Body is `{issuer, external_subject, display_name?, password?}`.
        Optional `password` is POSTed once, stored only as a bcrypt hash
        for `POST /login` (identifier is `external_subject`), and is
        **never echoed**. Omit `password` to create identity without a
        local-login credential. Success is status-only (`BootstrapStatus`).
        Never returns a password, hash, or KEK.

        Auth matches incomplete-install `GET /bootstrap` and B.2: no
        session is required while the gate is incomplete. After
        `complete`, this wizard handler is **409 Conflict**
        (Settings-only). Persistence must be ready first (**409**
        fail-closed order). Embed sessions are `403`. CSRF is required
        when an `ff_session` cookie is presented. Unauthenticated
        incomplete installs have no session, so CSRF does not apply.

        **Never call this from `/embed/v1`.**
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapFirstAdmin"
            example:
              issuer: https://idp.example
              external_subject: admin-1
              display_name: Operator
      responses:
        "201":
          description: First admin ready (status only; bootstrap not complete)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
              example:
                complete: false
                incomplete: true
                skipped: false
                standaloneOnly: true
                steps:
                  persistence:
                    ready: true
                  firstAdmin:
                    ready: true
                  publicUrl:
                    ready: false
                  tls:
                    ready: false
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: |
            Bootstrap is already complete (Settings-only), or
            persistence is not ready (fail-closed step order).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                complete:
                  value:
                    type: urn:flowforge:problem:conflict
                    title: Conflict
                    status: 409
                    detail: Bootstrap is already complete. Users are edited in Settings.
                    instance: /api/v1/bootstrap/admins
                    code: conflict
                    request_id: 0123456789abcdef0123456789abcdef
                persistenceNotReady:
                  value:
                    type: urn:flowforge:problem:conflict
                    title: Conflict
                    status: 409
                    detail: Persistence must be ready before creating the first admin.
                    instance: /api/v1/bootstrap/admins
                    code: conflict
                    request_id: 0123456789abcdef0123456789abcdef
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /bootstrap/public-url:
    post:
      operationId: setBootstrapPublicURL
      summary: Set first-run public base URL
      description: |
        Wizard step 3 (B.4). Persists the public origin on
        `instance_bootstrap.public_base_url` via `Store.SetPublicURL`
        and sets `steps.publicUrl.ready=true`. Does **not** mark
        bootstrap `complete` (TLS is still required).

        Body is `{publicBaseUrl}`. HTTPS is preferred. HTTP is allowed
        for local installs (for example `http://localhost:3000`). The
        value must be an origin — no userinfo, query, fragment, or
        non-root path. Success is status-only (`BootstrapStatus`).
        **Never echoes** the URL on this response or `GET /bootstrap`
        (Settings read is later).

        Auth matches incomplete-install `GET /bootstrap` and B.2/B.3:
        no session is required while the gate is incomplete. After
        `complete`, this wizard handler is **409 Conflict**
        (Settings-only). First admin must be ready first (**409**
        fail-closed order). Embed sessions are `403`. CSRF is required
        when an `ff_session` cookie is presented. Unauthenticated
        incomplete installs have no session, so CSRF does not apply.

        **Never call this from `/embed/v1`.**
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapPublicURL"
            examples:
              https:
                value:
                  publicBaseUrl: https://flows.example.com
              localHttp:
                summary: HTTP is allowed for local installs
                value:
                  publicBaseUrl: http://localhost:3000
      responses:
        "200":
          description: Public URL ready (status only; bootstrap not complete)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
              example:
                complete: false
                incomplete: true
                skipped: false
                standaloneOnly: true
                steps:
                  persistence:
                    ready: true
                  firstAdmin:
                    ready: true
                  publicUrl:
                    ready: true
                  tls:
                    ready: false
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: |
            Bootstrap is already complete (Settings-only), or
            first admin is not ready (fail-closed step order).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                complete:
                  value:
                    type: urn:flowforge:problem:conflict
                    title: Conflict
                    status: 409
                    detail: Bootstrap is already complete. The public URL is edited in Settings.
                    instance: /api/v1/bootstrap/public-url
                    code: conflict
                    request_id: 0123456789abcdef0123456789abcdef
                firstAdminNotReady:
                  value:
                    type: urn:flowforge:problem:conflict
                    title: Conflict
                    status: 409
                    detail: First admin must be ready before setting the public URL.
                    instance: /api/v1/bootstrap/public-url
                    code: conflict
                    request_id: 0123456789abcdef0123456789abcdef
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /bootstrap/tls:
    post:
      operationId: setBootstrapTLS
      summary: Enable first-run TLS and complete bootstrap
      description: |
        Wizard step 4 (B.5 / B.7). Enables TLS by creating a
        self-signed certificate, uploading a PEM pair (`certPem` +
        `keyPem`) once, or skipping in-process certs. Create/upload
        write materials to process `TLS_CERT_FILE` / `TLS_KEY_FILE`.
        Skip writes no PEM or key. Status is updated via
        `Store.SetTLS`, then `Store.MarkComplete` flips the gate so
        the wizard never reappears.

        Body is `{action:"create-self-signed"}`,
        `{action:"upload", certPem, keyPem}`, or `{action:"skip"}`.
        ACME / Let’s Encrypt is **out of scope**. Success is
        status-only (`BootstrapStatus`) with `steps.tls.ready=true`,
        `steps.tls.mode` (`self_signed`, `uploaded`, or `skipped`),
        and `complete=true`. **Never returns** the private key, PEM,
        or KEK. Skip is not a permanent lockout — Settings `#tls`
        can enable create/upload later.

        Auth matches incomplete-install `GET /bootstrap` and B.2–B.4:
        no session is required while the gate is incomplete. After
        `complete`, this wizard handler is **409 Conflict**
        (Settings-only). Public URL must be ready first (**409**
        fail-closed order). Embed sessions are `403`. CSRF is required
        when an `ff_session` cookie is presented. Unauthenticated
        incomplete installs have no session, so CSRF does not apply.

        Settings later reads `GET /bootstrap` `steps.tls.ready` /
        `steps.tls.mode` only. Further TLS edits are Settings-only.

        **Never call this from `/embed/v1`.**
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapTLS"
            examples:
              createSelfSigned:
                value:
                  action: create-self-signed
              upload:
                summary: PEM POST once; never echoed
                value:
                  action: upload
                  certPem: "(certificate PEM posted once; never returned)"
                  keyPem: "(private key PEM posted once; never returned)"
              skip:
                summary: Complete without writing PEM or key
                value:
                  action: skip
      responses:
        "200":
          description: TLS ready and bootstrap complete (status only; no secrets)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
              example:
                complete: true
                incomplete: false
                skipped: false
                standaloneOnly: true
                steps:
                  persistence:
                    ready: true
                  firstAdmin:
                    ready: true
                  publicUrl:
                    ready: true
                  tls:
                    ready: true
                    mode: self_signed
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: |
            Bootstrap is already complete (Settings-only), or
            public URL is not ready (fail-closed step order).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                complete:
                  value:
                    type: urn:flowforge:problem:conflict
                    title: Conflict
                    status: 409
                    detail: Bootstrap is already complete. TLS is edited in Settings.
                    instance: /api/v1/bootstrap/tls
                    code: conflict
                    request_id: 0123456789abcdef0123456789abcdef
                publicUrlNotReady:
                  value:
                    type: urn:flowforge:problem:conflict
                    title: Conflict
                    status: 409
                    detail: Public URL must be ready before enabling TLS.
                    instance: /api/v1/bootstrap/tls
                    code: conflict
                    request_id: 0123456789abcdef0123456789abcdef
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: |
            Create/upload require configured, writable
            TLS_CERT_FILE / TLS_KEY_FILE. Skip does not. Also
            returned when the bootstrap store is down.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: urn:flowforge:problem:dependency-unavailable
                title: Dependency Unavailable
                status: 503
                detail: TLS certificate files are not configured.
                instance: /api/v1/bootstrap/tls
                code: dependency-unavailable
                request_id: 0123456789abcdef0123456789abcdef
  /metrics:
    get:
      operationId: getMetrics
      summary: Baseline Prometheus metrics
      description: |
        Prometheus 0.0.4 text exposition of HTTP request counts and
        duration histograms. Labels are method, route, and status only.
        Requires `platform.administer` (`PLATFORM_ADMINS`) or a machine
        principal granted `ops.metrics.read` (or an explicit machine
        `platform.administer` grant). Scrapers send `Authorization: Bearer`
        with the opaque `ff_session` token from `POST /machine/token`, or
        the `ff_session` cookie. Trusted-dev identity headers work only when
        `TRUSTED_DEV_IDENTITY_HEADERS` is on. A human who is not a platform
        admin is `403`. There is no anonymous scrape. When `MACHINE_REQUIRE`
        includes `metrics`, a missing, revoked, or ungranted
        `MACHINE_METRICS_CLIENT_ID` is `503` before the scrape is served.
        Health and readiness stay unauthenticated.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Prometheus text
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: |
            `MACHINE_REQUIRE` includes `metrics` and the named principal
            is missing, revoked, or lacks `ops.metrics.read`.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      summary: Published OpenAPI YAML
      description: |
        Requires `platform.administer` (`PLATFORM_ADMINS`) or machine
        `ops.metrics.read`. Same credentials as `GET /metrics` (session
        cookie, Bearer session token from `POST /machine/token`, or
        trusted-dev headers). `503` when `MACHINE_REQUIRE` includes
