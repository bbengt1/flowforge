        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /executions/{executionId}/steps/{stepId}/logs:
    get:
      operationId: getStepLogs
      summary: Read bounded step logs
      description: |
        Returns a window of log lines from stored log artifacts. Query
        `limit` (default 200, max 200), `offset`, `maxBytes` (default 16KiB,
        max 256KiB). Tokens in stored logs are already redacted. Requires
        `execution.view`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: executionId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: stepId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0}
        - name: maxBytes
          in: query
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Bounded log window
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepLogs"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
