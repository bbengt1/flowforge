      description: Requires `opsconfig.view`. Returns kinds, collections, YAML ref fields, use permissions, `kubernetesEngine` (E7.1), `sshEngine` (E8.1), `scriptEngine` (E9.1), and `httpNotificationEngine` (E10.4).
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
