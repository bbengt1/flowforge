          type: string
          description: Same value as the `ff_csrf` cookie. Never log or persist in localStorage.
    SessionAuditEvent:
      type: object
      required: [id, event_type, outcome, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - session.created
            - session.refreshed
            - session.revoked
            - session.expired
            - session.csrf_rejected
            - session.origin_rejected
            - session.privilege_denied
            - session.auth_rejected
        outcome:
          type: string
          enum: [allowed, denied]
        reason:
          type: string
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
    SessionAuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionAuditEvent"
    WorkflowFieldError:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
          example: spec.nodes[0].with.namespace
        line:
          type: integer
        column:
          type: integer
        code:
          type: string
          example: invalid-uuid
        message:
          type: string
    WorkflowPort:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [object, string, integer, boolean, any]
        required:
          type: boolean
        classification:
          type: string
          enum: [public, internal, confidential, secret, inherit]
          description: Port data classification. `inherit` copies the inbound label. `secret` is never a legal payload.
        maxBytes:
          type: integer
        description:
          type: string
    WorkflowWithField:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
        required:
          type: boolean
        enum:
          type: array
          items:
            type: string
        description:
          type: string
    WorkflowNodePolicy:
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string
        retrySafe:
          type: boolean
        sideEffects:
          type: boolean
        idempotent:
          type: boolean
        cancellation:
          type: string
        verification:
          type: string
        defaultMaxAttempts:
          type: integer
    WorkflowNodeBounds:
      type: object
      properties:
        maxInputBytes:
          type: integer
        maxOutputBytes:
          type: integer
        maxWithBytes:
          type: integer
        maxAggregationItems:
          type: integer
        maxDurationSeconds:
          type: integer
    WorkflowRedactionPolicy:
      type: object
      properties:
        auditFields:
          type: array
          items:
            type: string
        redactInputs:
          type: boolean
        redactOutputs:
          type: boolean
        strategy:
          type: string
    WorkflowCatalog:
      type: object
      required: [apiVersion, triggers, nodes]
      properties:
        apiVersion:
          type: string
          example: flowforge/v1
        rules:
          type: object
          properties:
            triggersAreWorkflowLevel:
              type: boolean
            graphNodesExcludeTriggers:
              type: boolean
            unsupportedPhasesRejected:
              type: boolean
        triggers:
          type: array
          items:
            type: object
            required: [type, phase]
            properties:
              type:
                type: string
              phase:
                type: string
                enum: [core, next, provider]
              outputs:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowPort"
        nodes:
          type: array
          items:
            type: object
            required: [type, phase]
            properties:
              type:
                type: string
              phase:
                type: string
                enum: [core, next, provider]
              title:
                type: string
              description:
                type: string
              inputs:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowPort"
              outputs:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowPort"
              requiredWith:
                type: array
                items:
                  type: string
              allowedWith:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowWithField"
              policy:
                $ref: "#/components/schemas/WorkflowNodePolicy"
              bounds:
                $ref: "#/components/schemas/WorkflowNodeBounds"
              redaction:
                $ref: "#/components/schemas/WorkflowRedactionPolicy"
    WorkflowDefinitionEnvelope:
