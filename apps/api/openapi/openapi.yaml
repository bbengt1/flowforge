      description: |
        Returns a window of log lines from stored log artifacts. Query
        `limit` (default 200, max 200), `offset`, `maxBytes` (default 16KiB,
        max 256KiB). Tokens in stored logs are already redacted. Requires
        `execution.view`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: executionId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: stepId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0}
        - name: maxBytes
          in: query
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Bounded log window
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepLogs"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: uploadStepLogs
      summary: Upload bounded step logs as an artifact
      description: |
        Same scan/encryption as artifact upload. Default `kind` is `log`.
        Requires `workflow.execute` and CSRF for cookie callers.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/CSRFToken"
        - name: executionId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: stepId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadArtifactRequest"
      responses:
        "201":
          description: Log artifact created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionArtifact"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /artifacts/{artifactId}:
    get:
      operationId: getProductArtifact
      summary: Get artifact metadata
      description: |
        Metadata only. No storage locators or credentials. Distinct from
        the E2.2 isolation hook `GET /workspace/artifacts/{id}`. Requires
        `execution.view`. Expired artifacts without a legal hold are `404`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: artifactId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Artifact metadata
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionArtifact"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /artifacts/{artifactId}/downloads:
    post:
      operationId: createArtifactDownload
      summary: Mint a short-lived download grant
      description: |
        Re-evaluates `execution.view` and retention on every call. Returns
        a same-origin `href` (`/api/v1/artifact-downloads/{grantId}`) —
        never a durable public URL or bucket credential. Default TTL 60s
        (`ARTIFACT_DOWNLOAD_TTL`), max 5m. CSRF required for cookie callers.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/CSRFToken"
        - name: artifactId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyDispatchRequest"
      responses:
        "201":
          description: Grant minted
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDownloadEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /artifact-downloads/{grantId}:
    get:
      operationId: downloadArtifactGrant
      summary: Stream artifact bytes through a grant
      description: |
        Authorization is re-evaluated on every request (workspace
        membership, `execution.view`, artifact retention, grant expiry).
        Session cookie or identity headers required. `Cache-Control:
        no-store`. Expired grants and expired artifacts are `404`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: grantId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Artifact bytes
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Cache-Control:
              schema: {type: string}
              description: Always `no-store`
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /artifacts/{artifactId}/legal-hold:
    post:
      operationId: setArtifactLegalHold
      summary: Place or release a legal hold
      description: |
        Requires `workspace.administer` and CSRF for cookie callers.
        Placement requires a non-empty `reason` and writes
        `artifact.legal_hold.placed` to the audit log. Release writes
        `artifact.legal_hold.released`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/CSRFToken"
        - name: artifactId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalHoldRequest"
      responses:
        "200":
          description: Updated artifact metadata
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionArtifact"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /retention/purge:
    post:
      operationId: purgeRetention
      summary: Purge expired executions and artifacts
      description: |
        Requires `workspace.administer` and CSRF for cookie callers.
        Deletes artifact metadata and object payloads. Artifacts (and
        their parent executions) under legal hold are skipped. Writes
        `artifact.retention.purged` / `artifact.retention.held`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyDispatchRequest"
      responses:
        "200":
          description: Purge summary
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPurgeResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /jobs/claim:
    post:
      operationId: claimJob
      summary: Claim the next queued job
      description: |
        Requires `workflow.execute`. Recovers expired leases to
        `indeterminate` first, then claims one queued job with
        `FOR UPDATE SKIP LOCKED`. Returns an HMAC `jobToken` bound to
        workspace, workflow version/digest, policy digest, fencing token,
        and expiry. `204` when the queue is empty.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimJobRequest"
      responses:
        "200":
          description: Claimed job and authenticated ticket
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimJobResponse"
        "204":
          description: No eligible job
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /jobs/recover:
    post:
      operationId: recoverJobs
      summary: Mark expired leases indeterminate
      description: Requires `workflow.execute`. Unsafe lease loss never silently retries a provider call.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      responses:
        "200":
          description: Recovery count
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverJobsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /jobs/{jobId}/heartbeat:
    post:
      operationId: heartbeatJob
      summary: Extend a job lease
      description: Requires `workflow.execute` plus a valid `jobToken`. First heartbeat marks the job `running` (provider fence). Stale fencing tokens are `409`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobActionRequest"
      responses:
        "200":
          description: Updated job
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchJobResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /jobs/{jobId}/release:
    post:
      operationId: releaseJob
      summary: Release a claimed job
      description: Requires `workflow.execute` plus a valid `jobToken`. Release before heartbeat requeues; release after heartbeat is `indeterminate`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobActionRequest"
      responses:
        "200":
          description: Updated job
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchJobResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /jobs/{jobId}/complete:
    post:
      operationId: completeJob
      summary: Complete a claimed job
      description: Requires `workflow.execute` plus a matching `jobToken` and fencing token. Output is redacted before persist.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobActionRequest"
      responses:
        "200":
          description: Completed job
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchJobResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /jobs/{jobId}/fail:
    post:
      operationId: failJob
      summary: Fail a claimed job
      description: Requires `workflow.execute` plus a matching `jobToken` and fencing token. Error is redacted before persist.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobActionRequest"
      responses:
        "200":
          description: Failed job
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchJobResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /audit-events:
    get:
      operationId: listWorkspaceAuditEvents
      summary: List workspace audit events
      description: Requires `execution.view`. Redacted details only. Distinct from E2.2 `GET /workspace/audit-events` isolation hooks.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: resourceType
          in: query
          schema: {type: string}
        - name: resourceId
          in: query
          schema: {type: string, format: uuid}
        - name: action
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        "200":
          description: Audit events
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /permission-matrix:
    get:
      operationId: getPermissionMatrix
      summary: Role and permission catalog
      description: Returns the deny-by-default permission matrix (view, edit, publish, execute, credential, approval, administration).
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      responses:
        "200":
          description: Permission matrix
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionMatrix"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /roles:
    get:
      operationId: listRoles
      summary: List role vocabulary
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      responses:
        "200":
          description: Roles
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /permissions:
    get:
      operationId: listPermissions
      summary: List permission vocabulary
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      responses:
        "200":
          description: Permissions
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /tenants:
    post:
      operationId: createTenant
      summary: Create a tenant
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug:
                  type: string
                name:
                  type: string
      responses:
        "201":
          description: Tenant created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces the caller belongs to
      description: Memberships are loaded from server-side bindings. Host workspace IDs are ignored.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      responses:
        "200":
          description: Memberships
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createWorkspace
      summary: Create a workspace
      description: |
        Creates a workspace unique on `(tenant_id, workbench_key)` and binds the
        caller as `admin`. `id` and `workspace_id` in the body are rejected.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workbench_key, name]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                tenant_slug:
                  type: string
                workbench_key:
                  type: string
                name:
                  type: string
      responses:
        "201":
          description: Workspace created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /workspace:
    get:
      operationId: getCurrentWorkspace
      summary: Resolve the current workspace
      description: |
        Resolves workspace identity from tenant + workbench_key headers.
        `X-FlowForge-Workspace-ID` is untrusted host context and is rejected
        unless it matches the server-derived workspace.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      responses:
        "200":
          description: Server-derived workspace, roles, and permissions
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentWorkspace"
