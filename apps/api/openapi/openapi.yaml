                $ref: "#/components/schemas/WorkflowCatalog"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /workflows/validate:
    post:
      operationId: validateWorkflowDefinition
