        Safe type/field shapes for the vault wizard. Requires `credential.view`.
        Never includes secret values. Isolation hook `POST /workspace/records`
        with `kind=credential` is not the product vault.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      responses:
        "200":
          description: Type catalog
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialCatalog"
        "401":
          $ref: "#/components/responses/Unauthenticated"
