        "403":
          $ref: "#/components/responses/Forbidden"
  /scripts/catalog:
    get:
      operationId: getScriptCatalog
      summary: Script engine catalog
      description: |
        Requires `opsconfig.view`. Documents `script.python` / `script.go`
        node fields, publish/scan/sign/pin rules, runtime-profile digest
        pinning, E9.2 isolation guarantees (UID/FS/caps/no_new_privs/egress),
        E9.3 typed I/O + retry/indeterminate contract (io, retry.ui, retry.probe,
        scoped handles, allowlisted env), and E9.4 revocation + emergency-stop
        (`revocation`, `emergencyStop`, error codes). Does not start a runner.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      responses:
        "200":
          description: Script engine catalog
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptEngineCatalog"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /http/catalog:
    get:
      operationId: getHTTPNotificationCatalog
      summary: HTTP and notification engine catalog
      description: |
        Requires `opsconfig.view`. Documents `http.request`,
        `notification.webhook`, and `notification.email` node fields,
        pinned connection/recipient/template/schema UUIDs, SSRF and
        destination-IP allowlists, redirect/TLS/size/secret-field
        policies, and the integration gate. Does not make a remote call.
