  /hooks/{publicId}:
    post:
      operationId: deliverWebhook
      summary: Public replay-safe webhook ingress
      description: |
        E10.2 public ingress. No session or CSRF. Reads the raw body first
        and verifies `X-FlowForge-Signature: v1=<hex>` over
        `v1.{timestamp}.{raw}` before JSON parse. Fail closed on bad
        signature, replay, timestamp skew, oversize, rate/concurrency,
        or a disabled/unpublished trigger. Mapped fields become bounded
        typed input; execution start uses E10.1 idempotency/fingerprint
        semantics. Never put the secret in the URL.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - name: publicId
          in: path
          required: true
          schema: {type: string, pattern: '^wh_[0-9a-f]{64}$'}
        - name: X-FlowForge-Timestamp
          in: header
          required: true
          schema: {type: string}
        - name: X-FlowForge-Signature
          in: header
          required: true
          schema: {type: string}
        - name: Idempotency-Key
          in: header
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: New execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "200":
          description: Idempotent replay of the same fingerprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
