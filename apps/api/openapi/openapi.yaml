      properties:
        left:
          $ref: "#/components/schemas/CompareRef"
        right:
          $ref: "#/components/schemas/CompareRef"
    CompareChange:
      type: object
      required: [path, op]
      properties:
        path:
          type: string
        op:
          type: string
