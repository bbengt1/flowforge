openapi: 3.0.3
info:
  title: FlowForge Control Plane API
  version: 0.4.0
  description: |
    Versioned control-plane API. Conventions:

    - Correlation: every response sets `X-Request-ID`. A caller value is
      accepted only when it is 16–128 ASCII letters, digits, or hyphens;
      otherwise the API generates one. The same id is returned in problem
      documents as `request_id` and in structured request logs.
    - Errors: 4xx/5xx responses use RFC 9457 `application/problem+json`
      (`type`, `title`, `status`, `detail`, `instance`) plus `code` and
      `request_id`. Problem details never echo request bodies, credentials,
      or other secret material.
    - Invalid requests use `invalid-request` (400) or `request-too-large` (413).
      Authenticated-but-failed flows use `unauthenticated` (401) and
      `forbidden` (403). Unique identity collisions use `conflict` (409).
    - Browser clients authenticate with `ff_session` / `ff_csrf` cookies from
      `POST /session`. State-changing cookie requests require `X-CSRF-Token`.
      Non-browser callers may keep using `X-FlowForge-Issuer` /
      `X-FlowForge-Subject`. A session cookie wins; conflicting identity
      headers fail closed.
    - Workspace identity is server-derived from `(tenant_id|tenant_slug,
      workbench_key)`. A host-supplied workspace UUID is never the lookup key
      and is rejected when it is the only identity or does not match resolution.
    - Workspace-owned queries set transaction-local `app.workspace_id` only
      after membership authorization. Cross-workspace reads, writes,
      credential use, artifact access, and realtime subscribe fail closed.
    - CORS is an exact origin allowlist (`CORS_ALLOWED_ORIGINS`). Empty
      allowlist plus a foreign `Origin` fails closed. Wildcard credentialed
      CORS is rejected at process start.
    - Request bodies are capped at 1048576 bytes.
    - OpenAPI is published at `/api/v1/openapi.yaml`, `/api/v1/openapi.json`,
      and `/api/v1/swagger`.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process liveness
      description: Returns process liveness. Does not check dependencies.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /readiness:
    get:
      operationId: getReadiness
      summary: PostgreSQL dependency readiness
      description: Returns ready when PostgreSQL is reachable; otherwise a problem details response.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: PostgreSQL is reachable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: PostgreSQL is not reachable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: urn:flowforge:problem:dependency-unavailable
                title: Dependency Unavailable
                status: 503
                detail: PostgreSQL is not reachable
                instance: /api/v1/readiness
                code: dependency-unavailable
                request_id: 0123456789abcdef0123456789abcdef
  /metrics:
    get:
      operationId: getMetrics
      summary: Baseline Prometheus metrics
      description: |
        Prometheus 0.0.4 text exposition of HTTP request counts and
        duration histograms. Labels are method, route, and status only.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Prometheus text
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            text/plain:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      summary: Published OpenAPI YAML
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: OpenAPI document
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/yaml:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      summary: Published OpenAPI JSON
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: OpenAPI document
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                type: object
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /swagger:
    get:
      operationId: getSwagger
      summary: Specification landing page
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Human-readable specification landing page
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            text/html:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /session:
    post:
      operationId: createSession
      summary: Create a browser session
      description: |
        Establishes a server-side session from bootstrap issuer/subject.
        Identity headers win when present. JSON `issuer` / `external_subject`
        are used only when those headers are absent; a conflicting body is
        `403`. Sets `ff_session` (`HttpOnly`, `SameSite=Lax`, `Secure` on
        HTTPS, `Path=/api/v1`) and `ff_csrf` (readable, `SameSite=Strict`,
        `Secure` on HTTPS, `Path=/api/v1`). Non-browser callers may keep
        using identity headers without cookies. Until OIDC, issuer/subject
        is the same E2.1 bootstrap used by header auth.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/DisplayName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              description: "ff_session (HttpOnly) and ff_csrf (readable) cookies."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
    get:
      operationId: getSession
      summary: Current browser session
      description: Requires the `ff_session` cookie. Header-only callers receive `401`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Current session
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /session/refresh:
    post:
      operationId: refreshSession
      summary: Refresh session idle expiry
      description: |
        Extends idle expiry up to the absolute cap and rotates the CSRF
        token. Requires `ff_session` plus matching `ff_csrf` / `X-CSRF-Token`.
        Concurrent refresh with a stale CSRF pair returns `409`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Session refreshed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /session/logout:
    post:
      operationId: logoutSession
      summary: Revoke the current session
      description: Requires CSRF when a session cookie is present. Clears both cookies.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session revoked
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /session/audit-events:
    get:
      operationId: listSessionAuditEvents
      summary: Session audit events for the caller
      description: |
        Secret-free session security events for the authenticated principal
        (created, refreshed, revoked, expired, CSRF/origin/privilege denials).
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      responses:
        "200":
          description: Audit events
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAuditEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /permission-matrix:
    get:
      operationId: getPermissionMatrix
      summary: Role and permission catalog
      description: Returns the deny-by-default permission matrix (view, edit, publish, execute, credential, approval, administration).
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      responses:
        "200":
          description: Permission matrix
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionMatrix"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /roles:
    get:
      operationId: listRoles
      summary: List role vocabulary
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      responses:
        "200":
          description: Roles
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /permissions:
    get:
      operationId: listPermissions
      summary: List permission vocabulary
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      responses:
        "200":
          description: Permissions
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /tenants:
    post:
      operationId: createTenant
      summary: Create a tenant
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug:
                  type: string
                name:
                  type: string
      responses:
        "201":
          description: Tenant created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces the caller belongs to
      description: Memberships are loaded from server-side bindings. Host workspace IDs are ignored.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      responses:
        "200":
          description: Memberships
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createWorkspace
      summary: Create a workspace
      description: |
        Creates a workspace unique on `(tenant_id, workbench_key)` and binds the
        caller as `admin`. `id` and `workspace_id` in the body are rejected.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workbench_key, name]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                tenant_slug:
                  type: string
                workbench_key:
                  type: string
                name:
                  type: string
      responses:
        "201":
          description: Workspace created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /workspace:
    get:
      operationId: getCurrentWorkspace
      summary: Resolve the current workspace
      description: |
        Resolves workspace identity from tenant + workbench_key headers.
        `X-FlowForge-Workspace-ID` is untrusted host context and is rejected
        unless it matches the server-derived workspace.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      responses:
        "200":
          description: Server-derived workspace, roles, and permissions
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentWorkspace"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace/members:
    get:
      operationId: listWorkspaceMembers
      summary: List workspace members
      description: Requires `workspace.administer`. Workspace is server-derived.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      responses:
        "200":
          description: Members
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putWorkspaceMember
      summary: Bind roles for a workspace member
      description: Requires `workspace.administer`. Replaces the member's roles. Rejects host-supplied workspace IDs in the body.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_keys]
              properties:
                user_id:
                  type: string
                  format: uuid
                issuer:
                  type: string
                external_subject:
                  type: string
                display_name:
                  type: string
                role_keys:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Updated member
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /workspace/members/{userID}:
    delete:
      operationId: deleteWorkspaceMember
      summary: Remove a workspace member
      description: Requires `workspace.administer`. Cannot remove the last administrator.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Member removed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /workspace/records:
    get:
      operationId: listWorkspaceRecords
      summary: List workspace-scoped isolation records
      description: Requires a `kind` query and the matching read permission. Results are RLS-scoped to the server-derived workspace.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/IsolationKind"
      responses:
        "200":
          description: Records visible in the current workspace
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecordList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkspaceRecord
      summary: Create a workspace-scoped isolation record
      description: Body `id` / `workspace_id` are rejected. Scope is server-derived after authorization.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind:
                  $ref: "#/components/schemas/IsolationKind"
                name:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Record created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecord"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /workspace/records/{id}:
    get:
      operationId: getWorkspaceRecord
      summary: Get a workspace-scoped record
      description: A valid UUID from another workspace returns `not-found`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Record
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecord"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace/records/{id}/links:
    post:
      operationId: createWorkspaceRecordLink
      summary: Attach a child record in the same workspace
      description: Composite `(workspace_id, parent_id)` FK rejects a parent UUID from another workspace.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  $ref: "#/components/schemas/IsolationKind"
      responses:
        "201":
          description: Link created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecordLink"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace/credentials/{id}/use:
    post:
      operationId: useWorkspaceCredential
      summary: Use a workspace credential
      description: Requires `credential.use`. Cross-workspace IDs return `not-found`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Credential use authorized
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace/artifacts/{id}:
    get:
      operationId: getWorkspaceArtifact
      summary: Access a workspace artifact
      description: Requires `execution.view`. Cross-workspace IDs return `not-found`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Artifact metadata
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecord"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace/jobs:
    get:
      operationId: listWorkspaceJobs
      summary: List workspace jobs
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      responses:
        "200":
          description: Jobs
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecordList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkspaceJob
      summary: Enqueue a workspace job hook
      description: Requires `workflow.execute`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Job created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecord"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /workspace/cache/{key}:
    get:
      operationId: getWorkspaceCache
      summary: Read a workspace cache entry
      description: Cache keys are server-prefixed with the derived workspace ID.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cache value
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheValue"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putWorkspaceCache
      summary: Write a workspace cache entry
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        "200":
          description: Cache value stored
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheValue"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /workspace/realtime/channels/{id}/subscribe:
    post:
      operationId: subscribeWorkspaceRealtime
      summary: Subscribe to a workspace realtime channel
      description: Requires `workflow.view`. Cross-workspace channel IDs return `not-found`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Subscribed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                type: object
                required: [channel_id, status]
                properties:
                  channel_id:
                    type: string
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace/audit-events:
    get:
      operationId: listWorkspaceAuditEvents
      summary: List workspace audit events
      description: Requires `workspace.administer`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      responses:
        "200":
          description: Audit events
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecordList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation identifier. Accepted only when 16–128 ASCII letters, digits, or hyphens.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9-]{16,128}$
    Issuer:
      name: X-FlowForge-Issuer
      in: header
      required: false
      description: |
        Host identity issuer for non-browser callers. Browser clients should
        use `ff_session` instead. Ignored when a session cookie is present
        unless it conflicts (conflict fails closed). Does not authorize a workspace.
      schema:
        type: string
    Subject:
      name: X-FlowForge-Subject
      in: header
      required: false
      description: Host identity subject. Unique with issuer. Does not authorize a workspace.
      schema:
        type: string
    DisplayName:
      name: X-FlowForge-Display-Name
      in: header
      required: false
      description: Optional display name applied on user upsert.
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        Required on state-changing requests authenticated by `ff_session`.
        Must match the `ff_csrf` cookie and the server-side session secret.
      schema:
        type: string
    TenantID:
      name: X-FlowForge-Tenant-ID
      in: header
      required: false
      description: Tenant UUID used with workbench_key to resolve workspace identity.
      schema:
        type: string
        format: uuid
    TenantSlug:
      name: X-FlowForge-Tenant-Slug
      in: header
      required: false
      description: Tenant slug used with workbench_key when tenant id is omitted.
      schema:
        type: string
    WorkbenchKey:
      name: X-FlowForge-Workbench-Key
      in: header
      required: false
      description: Host workbench key. Combined with tenant identity, this is the only accepted workspace lookup.
      schema:
        type: string
    HostWorkspaceID:
      name: X-FlowForge-Workspace-ID
      in: header
      required: false
      description: Untrusted host-supplied workspace UUID. Rejected unless it matches the server-derived `(tenant, workbench_key)` workspace.
      schema:
        type: string
        format: uuid
  headers:
    XRequestID:
      description: Correlation identifier. Caller values are accepted only when 16–128 ASCII letters, digits, or hyphens.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9-]{16,128}$
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    Problem:
      type: object
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - invalid-request
            - unauthenticated
            - forbidden
            - not-found
            - conflict
            - method-not-allowed
            - request-too-large
            - internal-error
            - dependency-unavailable
        request_id:
          type: string
    Tenant:
      type: object
      required: [id, slug, name, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Workspace:
      type: object
      required: [id, tenant_id, workbench_key, name, status]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        workbench_key:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, issuer, external_subject, status]
      properties:
        id:
          type: string
          format: uuid
        issuer:
          type: string
        external_subject:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled]
    CreateSessionRequest:
      type: object
      properties:
        issuer:
          type: string
        external_subject:
          type: string
        display_name:
          type: string
    Session:
      type: object
      required: [id, created_at, last_seen_at, idle_expires_at, absolute_expires_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
    SessionResponse:
      type: object
      required: [session, principal, csrf_token]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        principal:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
          description: Same value as the `ff_csrf` cookie. Never log or persist in localStorage.
    SessionAuditEvent:
      type: object
      required: [id, event_type, outcome, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - session.created
            - session.refreshed
            - session.revoked
            - session.expired
            - session.csrf_rejected
            - session.origin_rejected
            - session.privilege_denied
            - session.auth_rejected
        outcome:
          type: string
          enum: [allowed, denied]
        reason:
          type: string
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
    SessionAuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionAuditEvent"
    CurrentWorkspace:
      type: object
      required: [workspace, tenant, principal, roles, permissions]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        tenant:
          $ref: "#/components/schemas/Tenant"
        principal:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    Member:
      type: object
      required: [user, roles, permissions]
      properties:
        user:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    MembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [workspace, tenant, roles, permissions]
            properties:
              workspace:
                $ref: "#/components/schemas/Workspace"
              tenant:
                $ref: "#/components/schemas/Tenant"
              roles:
                type: array
                items:
                  type: string
              permissions:
                type: array
                items:
                  type: string
    PermissionMatrix:
      type: object
      required: [permissions, roles]
      properties:
        permissions:
          type: array
          items:
            type: object
            required: [key, family]
            properties:
              key:
                type: string
              family:
                type: string
                enum: [view, edit, publish, execute, credential, approval, administration]
        roles:
          type: array
          items:
            type: object
            required: [key, description, permissions]
            properties:
              key:
                type: string
              description:
                type: string
              permissions:
                type: array
                items:
                  type: string
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                type: string
              description:
                type: string
              permissions:
                type: array
                items:
                  type: string
    IsolationKind:
      type: string
      enum: [credential, artifact, job, cache, realtime, audit]
    WorkspaceRecord:
      type: object
      required: [workspace_id, id, kind, name, created_at]
      properties:
        workspace_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/IsolationKind"
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    WorkspaceRecordList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceRecord"
    WorkspaceRecordLink:
      type: object
      required: [workspace_id, id, parent_id, kind, created_at]
      properties:
        workspace_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/IsolationKind"
        created_at:
          type: string
          format: date-time
    CacheValue:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
    PermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                type: string
  responses:
    InvalidRequest:
      description: Malformed JSON, missing body, or unsupported Content-Type
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:invalid-request
            title: Invalid Request
            status: 400
            detail: Request body is not valid JSON.
            instance: /api/v1/example
            code: invalid-request
            request_id: 0123456789abcdef0123456789abcdef
    Unauthenticated:
      description: Missing or invalid credentials
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:unauthenticated
            title: Unauthenticated
            status: 401
            detail: Authentication is required.
            instance: /api/v1/example
            code: unauthenticated
            request_id: 0123456789abcdef0123456789abcdef
    Forbidden:
      description: Authenticated caller is not authorized
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:forbidden
            title: Forbidden
            status: 403
            detail: You are not authorized to perform this action.
            instance: /api/v1/example
            code: forbidden
            request_id: 0123456789abcdef0123456789abcdef
    Conflict:
      description: Unique identity collision or last-admin protection
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:conflict
            title: Conflict
            status: 409
            detail: A unique identity already exists.
            instance: /api/v1/workspaces
            code: conflict
            request_id: 0123456789abcdef0123456789abcdef
    NotFound:
      description: The requested path does not exist
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:not-found
            title: Not Found
            status: 404
            detail: The requested path does not exist.
            instance: /api/v1/missing
            code: not-found
            request_id: 0123456789abcdef0123456789abcdef
    MethodNotAllowed:
      description: HTTP method is not allowed for this path
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Allow:
          schema:
            type: string
            example: GET, HEAD
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:method-not-allowed
            title: Method Not Allowed
            status: 405
            detail: The POST method is not allowed for this path.
            instance: /api/v1/health
            code: method-not-allowed
            request_id: 0123456789abcdef0123456789abcdef
    RequestTooLarge:
      description: Request body exceeds 1048576 bytes
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:request-too-large
            title: Request Too Large
            status: 413
            detail: The request body exceeds the 1048576 byte limit.
            instance: /api/v1/health
            code: request-too-large
            request_id: 0123456789abcdef0123456789abcdef
    InternalError:
      description: Unexpected server failure
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:internal-error
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred.
            instance: /api/v1/health
            code: internal-error
            request_id: 0123456789abcdef0123456789abcdef
