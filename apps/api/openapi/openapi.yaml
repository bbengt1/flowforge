        Requires `workflow.view`. Execution uses these digests, not draft source.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/WorkflowID"
        - $ref: "#/components/parameters/VersionID"
      responses:
        "200":
          description: Script pins
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptPinList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /policy/evaluate:
    post:
      operationId: evaluatePolicy
      summary: Evaluate target/action policy before dispatch
      description: |
        Requires `workflow.view`. Resolves current published target and policy
        revisions for a pinned workflow version. Returns allow / deny /
        approval-required plus bound requirement shapes. Host-supplied
        workspace IDs are rejected. Cross-workspace UUIDs are `404`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyEvaluateRequest"
      responses:
        "200":
          description: Evaluation
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyEvaluateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /approvals/catalog:
    get:
      operationId: getApprovalCatalog
      summary: Approval statuses and decisions
      description: Requires `approval.view`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      responses:
        "200":
          description: Catalog
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalCatalog"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /approvals:
    get:
      operationId: listApprovals
      summary: List approval requirements
      description: Requires `approval.view`. Stale bindings are refreshed fail-closed.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, expired, invalidated]
        - name: workflowId
          in: query
          schema: {type: string, format: uuid}
        - name: workflowVersionId
          in: query
          schema: {type: string, format: uuid}
        - name: executionId
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Approvals
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createApprovals
      summary: Materialize approval requirements
      description: |
        Requires `workflow.execute`. Creates pending rows bound to the current
        workflow version, target revision, policy revision, operation, and
        expiry. Idempotent on an active binding fingerprint.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalCreateRequest"
      responses:
        "201":
          description: Created or existing active bindings
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /approvals/{approvalId}:
    get:
      operationId: getApproval
      summary: Get one approval
      description: Requires `approval.view`. Refreshes expiry and binding freshness.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/ApprovalID"
      responses:
        "200":
          description: Approval
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /approvals/{approvalId}/decide:
    post:
      operationId: decideApproval
      summary: Approve or reject
      description: |
        Requires `approval.decide` and the bound `approverRole` (or `admin`).
        Authorization is rechecked server-side. The requester cannot decide
        their own approval. Changed workflow version, target revision, or
        policy revision invalidates the row (`409`).
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/ApprovalID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecideRequest"
      responses:
        "200":
          description: Decision
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /approvals/{approvalId}/events:
    get:
      operationId: listApprovalEvents
      summary: Approval audit events
      description: Requires `approval.view`. Secret-free.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/ApprovalID"
      responses:
        "200":
          description: Events
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  pathItems:
    OpsCollection:
      get:
        summary: List operational configuration resources
        description: Requires `opsconfig.view`. Returns heads only (no draft spec).
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
        responses:
          "200":
            description: Resource summaries
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsResourceList"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
      post:
        summary: Create a draft resource
        description: Requires `opsconfig.edit`. Host-supplied `id` / `workspaceId` is `400`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsCreateRequest"
        responses:
          "201":
            description: Created draft
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsDetail"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "409":
            $ref: "#/components/responses/Conflict"
    OpsItem:
      get:
        summary: Get resource head
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Resource
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsResource"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsDraft:
      get:
        summary: Get mutable draft
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Draft
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsDraft"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
      put:
        summary: Conflict-safe draft save
        description: Requires `opsconfig.edit` and current `revision`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsSaveDraftRequest"
        responses:
          "200":
            description: Saved draft
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsDetail"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
    OpsPublish:
      post:
        summary: Publish an immutable revision
        description: Requires `opsconfig.publish`. Duplicate digest is `409`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        requestBody:
          required: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsPublishRequest"
        responses:
          "201":
            description: Published version
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsPublishResponse"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
    OpsVersions:
      get:
        summary: Version history
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Versions newest first
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsVersionList"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsVersion:
      get:
        summary: Frozen published snapshot
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
          - $ref: "#/components/parameters/OpsVersionID"
        responses:
          "200":
            description: Version
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsVersion"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsDisable:
      post:
        summary: Disable a resource
        description: Select and pin fail closed until re-enabled. Requires `opsconfig.edit`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Disabled resource
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsResource"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsEnable:
      post:
        summary: Re-enable a resource
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Enabled resource
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsResource"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsSelect:
      post:
        summary: Server-authorized selection
        description: Pins an exact published revision. Drafts are `400`. Cross-workspace IDs are `404`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        requestBody:
          required: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsSelectRequest"
        responses:
          "200":
            description: Pin
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsPin"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation identifier. Accepted only when 16–128 ASCII letters, digits, or hyphens.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9-]{16,128}$
    Issuer:
      name: X-FlowForge-Issuer
      in: header
      required: false
      description: |
        Host identity issuer for non-browser callers. Browser clients should
        use `ff_session` instead. Ignored when a session cookie is present
        unless it conflicts (conflict fails closed). Does not authorize a workspace.
      schema:
        type: string
    Subject:
      name: X-FlowForge-Subject
      in: header
      required: false
      description: Host identity subject. Unique with issuer. Does not authorize a workspace.
      schema:
        type: string
    DisplayName:
      name: X-FlowForge-Display-Name
      in: header
      required: false
      description: Optional display name applied on user upsert.
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        Required on state-changing requests authenticated by `ff_session`.
        Must match the `ff_csrf` cookie and the server-side session secret.
      schema:
        type: string
    TenantID:
      name: X-FlowForge-Tenant-ID
      in: header
      required: false
      description: Tenant UUID used with workbench_key to resolve workspace identity.
      schema:
        type: string
        format: uuid
    TenantSlug:
      name: X-FlowForge-Tenant-Slug
      in: header
      required: false
      description: Tenant slug used with workbench_key when tenant id is omitted.
      schema:
        type: string
    WorkbenchKey:
      name: X-FlowForge-Workbench-Key
      in: header
      required: false
      description: Host workbench key. Combined with tenant identity, this is the only accepted workspace lookup.
      schema:
        type: string
    HostWorkspaceID:
      name: X-FlowForge-Workspace-ID
      in: header
      required: false
      description: Untrusted host-supplied workspace UUID. Rejected unless it matches the server-derived `(tenant, workbench_key)` workspace.
      schema:
        type: string
        format: uuid
    WorkflowID:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FolderID:
      name: folderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowFolderQuery:
      name: folderId
      in: query
      required: false
      description: Filter list to one folder UUID, or `unfiled` for `folderId == null`. Omit for the full workspace list.
      schema:
        type: string
    VersionID:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialID:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobID:
      name: jobId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApprovalID:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AlertID:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OpsResourceID:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OpsVersionID:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    XRequestID:
      description: Correlation identifier. Caller values are accepted only when 16–128 ASCII letters, digits, or hyphens.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9-]{16,128}$
  schemas:
    OpsCatalog:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          items:
            type: object
            required: [kind, collection, yamlFields, usePermission]
            properties:
              kind: {type: string}
              collection: {type: string}
              displayName: {type: string}
              yamlFields:
                type: array
                items: {type: string}
              usePermission: {type: string}
