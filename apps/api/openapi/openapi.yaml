  /machine/token:
    post:
      operationId: mintMachineSession
      summary: Mint a session for a machine principal
      description: |
        Non-human door for scrapers, the scheduler consumer, and
        automation. Body is `client_id` plus exactly one factor:
        `secret` or a short-lived Ed25519 `assertion`
        (`typ=machine-assertion`, `aud=flowforge:machine`, max TTL 5m).
        Success mints the **same** standalone `ff_session` / `ff_csrf`
        pair as `POST /login` (no `session.embed`). This route is not
        local Login, not trusted-dev `POST /session`, and not
        `POST /embed/exchange`. Unknown client and bad secret are the
        same `401` (`Invalid credentials.`). The secret, hash, assertion,
        and public key are never echoed. Rate-limited by client IP
        (60/min) and `client_id` (30/min) on a counter separate from
        login and embed exchange. A nil limiter fails closed.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineTokenRequest"
      responses:
        "201":
          description: Standalone session issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              description: "ff_session (HttpOnly, SameSite=Lax) and ff_csrf (readable, SameSite=Strict)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /machine/principals:
    get:
      operationId: listMachinePrincipals
      summary: List machine principals
      description: |
        Requires `platform.administer` and CSRF when a session cookie is
        present. Items are display name, UUID, `client_id`, status, and
        grants. No secret, hash, assertion, or public key.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Machine principals
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachinePrincipalList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
    post:
      operationId: createMachinePrincipal
      summary: Create a machine principal
      description: |
        Requires `platform.administer` and CSRF. `secret` or
        `assertion_public_key` (raw 32-byte Ed25519, base64) is POST once
        and is not returned. Grants are explicit and deny-by-default;
        empty authorizes nothing. `embed.impersonate` is not grantable.
        Workspace-scoped grants require `tenant_slug` or `tenant_id` plus
        `workbench_key`. `platform.administer` is granted only when listed.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachinePrincipalCreate"
      responses:
        "201":
          description: Principal created. Secret material is omitted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachinePrincipal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /machine/principals/{id}:
    get:
      operationId: getMachinePrincipal
      summary: Get a machine principal
      description: |
        Requires `platform.administer`. Display name, UUID, `client_id`,
        status, and grants only.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
