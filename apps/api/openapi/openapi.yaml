        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /kubernetes/catalog:
    get:
      operationId: getKubernetesCatalog
      summary: Kubernetes engine catalog
      description: |
        Requires `opsconfig.view`. Documents cluster-target credential type
        (`kubernetes` / kubeconfig), namespace/kind/verb evaluation keys,
        fail-closed empty allowlists, least-privilege service-account
        templates, and E7.2 apply/get/list node contracts (`nodes`, `errors`,
        `apply`). Does not contact a cluster.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      responses:
        "200":
          description: Kubernetes engine catalog
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KubernetesEngineCatalog"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /ssh/catalog:
    get:
      operationId: getSSHCatalog
      summary: SSH engine catalog
      description: |
        Requires `opsconfig.view`. Documents SSH-target credential type
        (`ssh_private_key`), reviewed renderer rules (no raw shell
        interpolation), typed parameter schemas, retry defaults
        (`maxAttempts=0`; E8.2 never blindly re-runs), isolation guarantees
        (ephemeral handle, known-host verification, address allowlists,
        key-only auth), publish/select constraints, and error codes.
        Does not open an SSH connection.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
