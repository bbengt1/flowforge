openapi: 3.0.3
info:
  title: FlowForge Control Plane API
  version: 0.12.0
  description: |
    Versioned control-plane API. Conventions:

    - Correlation: every response sets `X-Request-ID`. A caller value is
      accepted only when it is 16–128 ASCII letters, digits, or hyphens;
      otherwise the API generates one. The same id is returned in problem
      documents as `request_id` and in structured request logs.
    - Errors: 4xx/5xx responses use RFC 9457 `application/problem+json`
      (`type`, `title`, `status`, `detail`, `instance`) plus `code` and
      `request_id`. Problem details never echo request bodies, credentials,
      or other secret material.
      - Invalid requests use `invalid-request` (400) or `request-too-large` (413).
      Invalid workflow YAML uses `invalid-workflow` (400) with an `errors`
      array (path, line, column, code, message). Authenticated-but-failed
      flows use `unauthenticated` (401) and `forbidden` (403). Unique
      identity collisions, draft revision mismatches, and duplicate
      published digests use `conflict` (409).
    - Browser clients authenticate with `ff_session` / `ff_csrf` cookies from
      `POST /session`. State-changing cookie requests require `X-CSRF-Token`.
      Non-browser callers may keep using `X-FlowForge-Issuer` /
      `X-FlowForge-Subject`. A session cookie wins; conflicting identity
      headers fail closed.
    - Workspace identity is server-derived from `(tenant_id|tenant_slug,
      workbench_key)`. A host-supplied workspace UUID is never the lookup key
      and is rejected when it is the only identity or does not match resolution.
    - Workspace-owned queries set transaction-local `app.workspace_id` only
      after membership authorization. Cross-workspace reads, writes,
      credential use, artifact access, and realtime subscribe fail closed.
    - CORS is an exact origin allowlist (`CORS_ALLOWED_ORIGINS`). Empty
      allowlist plus a foreign `Origin` fails closed. Wildcard credentialed
      CORS is rejected at process start.
    - Request bodies are capped at 1048576 bytes.
    - OpenAPI is published at `/api/v1/openapi.yaml`, `/api/v1/openapi.json`,
      and `/api/v1/swagger`.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process liveness
      description: Returns process liveness. Does not check dependencies.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /readiness:
    get:
      operationId: getReadiness
      summary: PostgreSQL dependency readiness
      description: Returns ready when PostgreSQL is reachable; otherwise a problem details response.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: PostgreSQL is reachable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: PostgreSQL is not reachable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: urn:flowforge:problem:dependency-unavailable
                title: Dependency Unavailable
                status: 503
                detail: PostgreSQL is not reachable
                instance: /api/v1/readiness
                code: dependency-unavailable
                request_id: 0123456789abcdef0123456789abcdef
  /metrics:
    get:
      operationId: getMetrics
      summary: Baseline Prometheus metrics
      description: |
        Prometheus 0.0.4 text exposition of HTTP request counts and
        duration histograms. Labels are method, route, and status only.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Prometheus text
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            text/plain:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      summary: Published OpenAPI YAML
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: OpenAPI document
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/yaml:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      summary: Published OpenAPI JSON
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: OpenAPI document
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                type: object
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /swagger:
    get:
      operationId: getSwagger
      summary: Specification landing page
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Human-readable specification landing page
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            text/html:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /session:
    post:
      operationId: createSession
      summary: Create a browser session
      description: |
        Establishes a server-side session from bootstrap issuer/subject.
        Identity headers win when present. JSON `issuer` / `external_subject`
        are used only when those headers are absent; a conflicting body is
        `403`. Sets `ff_session` (`HttpOnly`, `SameSite=Lax`, `Secure` on
        HTTPS, `Path=/api/v1`) and `ff_csrf` (readable, `SameSite=Strict`,
        `Secure` on HTTPS, `Path=/api/v1`). Non-browser callers may keep
        using identity headers without cookies. Until OIDC, issuer/subject
        is the same E2.1 bootstrap used by header auth.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/DisplayName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              description: "ff_session (HttpOnly) and ff_csrf (readable) cookies."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
    get:
      operationId: getSession
      summary: Current browser session
      description: Requires the `ff_session` cookie. Header-only callers receive `401`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Current session
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /session/refresh:
    post:
      operationId: refreshSession
      summary: Refresh session idle expiry
      description: |
        Extends idle expiry up to the absolute cap and rotates the CSRF
        token. Requires `ff_session` plus matching `ff_csrf` / `X-CSRF-Token`.
        Concurrent refresh with a stale CSRF pair returns `409`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Session refreshed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /session/logout:
    post:
      operationId: logoutSession
      summary: Revoke the current session
      description: Requires CSRF when a session cookie is present. Clears both cookies.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session revoked
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /session/audit-events:
    get:
      operationId: listSessionAuditEvents
      summary: Session audit events for the caller
      description: |
        Secret-free session security events for the authenticated principal
        (created, refreshed, revoked, expired, CSRF/origin/privilege denials).
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      responses:
        "200":
          description: Audit events
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAuditEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /workflows/catalog:
    get:
      operationId: getWorkflowCatalog
      summary: Core node and trigger catalog
      description: |
        Typed graph vocabulary for the YAML editor and canvas. Requires
        `workflow.view`. Next/provider types are listed so the UI can
        reject them; only `phase: core` is publishable in MVP.

        E3.3 adds full contracts for the core neutral nodes
        (`flow.condition`, `flow.delay`, `data.set`, `data.map`,
        `data.validate`, `flow.stop`, `flow.fail`): typed ports with
        classification and byte bounds, allowlisted `with` fields,
        policy/redaction metadata, and aggregation limits. Triggers
        remain workflow-level `spec.triggers` entries (`rules` on the
        catalog), never graph nodes.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      responses:
        "200":
          description: Catalog
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowCatalog"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /workflows/validate:
    post:
      operationId: validateWorkflowDefinition
      summary: Validate workflow YAML
      description: |
        Ephemeral parse and graph validation. Does not persist a draft
        (E3.2). Requires `workflow.edit`. Accepts `application/yaml` or
        JSON `{definitionYaml}`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefinitionEnvelope"
          application/yaml:
            schema:
              type: string
      responses:
        "200":
          description: Definition is valid
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowValidateResult"
        "400":
          $ref: "#/components/responses/InvalidWorkflow"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
  /workflows/normalize:
    post:
      operationId: normalizeWorkflowDefinition
      summary: Normalize workflow YAML and compute digest
      description: |
        Validates, emits deterministic YAML, and returns `sha256:<hex>`.
        Does not persist (E3.2 consumes this payload). Requires
        `workflow.edit`. Accepts `application/yaml` or JSON
        `{definitionYaml}`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefinitionEnvelope"
          application/yaml:
            schema:
              type: string
      responses:
        "200":
          description: Normalized definition
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowNormalizeResult"
        "400":
          $ref: "#/components/responses/InvalidWorkflow"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
  /workflows:
    get:
      operationId: listWorkflows
      summary: List workspace workflows
      description: Requires `workflow.view`. Returns summaries without YAML bodies.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      responses:
        "200":
          description: Workflow list
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkflow
      summary: Create workflow and first draft
      description: |
        Parses and normalizes YAML, then persists only the normalized
        document as revision 1. Requires `workflow.edit`. Body `id` /
        `workspace_id` / `workspaceId` is rejected.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowRequest"
      responses:
        "201":
          description: Workflow and draft
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDetail"
        "400":
          $ref: "#/components/responses/InvalidWorkflow"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /workflows/{workflowId}:
    get:
      operationId: getWorkflow
      summary: Get workflow summary
      description: Requires `workflow.view`. Foreign-workspace UUIDs are 404.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/WorkflowID"
      responses:
        "200":
          description: Workflow
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRecord"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workflows/{workflowId}/draft:
    get:
      operationId: getWorkflowDraft
      summary: Get current draft
      description: Requires `workflow.view`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/WorkflowID"
      responses:
        "200":
          description: Draft
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDraft"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveWorkflowDraft
      summary: Conflict-safe draft save
      description: |
        Requires `workflow.edit`. JSON `{revision,definitionYaml}` or
        `application/yaml` plus `If-Match: <revision>`. Only normalized
        YAML is persisted. Stale revision is `409` `conflict`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/WorkflowID"
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: Required for raw YAML bodies; current draft revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDraftRequest"
          application/yaml:
            schema:
              type: string
      responses:
        "200":
          description: Saved draft
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDetail"
        "400":
          $ref: "#/components/responses/InvalidWorkflow"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /workflows/{workflowId}/publish:
    post:
      operationId: publishWorkflow
      summary: Publish immutable version
      description: |
        Copies the current normalized draft into a new immutable version.
        Requires `workflow.publish`. Duplicate digest is `409`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/WorkflowID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishWorkflowRequest"
      responses:
        "201":
          description: Published version
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishWorkflowResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /workflows/{workflowId}/compare:
    post:
      operationId: compareWorkflow
      summary: Compare draft or versions
      description: Requires `workflow.view`. `kind` is `draft` or `version`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/WorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareWorkflowRequest"
      responses:
        "200":
          description: Structured diff
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareWorkflowResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workflows/{workflowId}/versions:
    get:
      operationId: listWorkflowVersions
      summary: List immutable versions
      description: Requires `workflow.view`. Newest version first.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - $ref: "#/components/parameters/WorkflowID"
      responses:
        "200":
          description: Versions
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
