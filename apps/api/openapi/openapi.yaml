        "409":
          $ref: "#/components/responses/Conflict"
  /workflows/{workflowId}/executions:
    post:
      operationId: startWorkflowExecution
      summary: Pin a published version for execution
      description: |
        E3.2 stub. Requires `workflow.execute` and `workflowVersionId`.
        Drafts cannot run (`400` `invalid-request`). The created row
        stores `workflowVersionId` + `workflowDigest` and later draft
        edits cannot change that pin. Full durable engine is E5.
