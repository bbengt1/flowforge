          description: Principal revoked
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachinePrincipal"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /login:
    post:
      operationId: localLogin
      summary: Local email/username + password sign-in
      description: |
        V.0a standalone local login. Verifies an existing local-login
        account (`identifier`, or `email` / `username`) and password,
        then mints the **same** `ff_session` / `ff_csrf` pair as a
        first-party session (`HttpOnly` + `SameSite=Lax` / readable +
        `SameSite=Strict`, `Path=/api/v1`, `Secure` on HTTPS). CSRF is
        not required (no session yet). Password is POST-once and never
        echoed. Unknown identifier and wrong password are the same `401`
        (`Invalid credentials.`) — the response does not say which field
        failed.         `GET /session` after success is a normal non-embed
        session (`session.embed` omitted). First-run one-time
        `admin` / `admin` sets `session.must_change_password`
        so product chrome can gate until `POST /session/password`.

        Rate-limited by client IP (default 60/min) and identifier
        (default 30/min) **before** lookup or bcrypt (`DummyVerify`
        included). Burst returns `429` `rate-limited` with
        `Retry-After`. A nil limiter fails closed. These counters are
        separate from `POST /embed/exchange` — do not share that IP
        budget. Configurable via `LOGIN_RATE_LIMIT_IP`,
        `LOGIN_RATE_LIMIT_IDENTIFIER`, `LOGIN_RATE_LIMIT_WINDOW`.
        Identity-store failures other than unknown identifier are
        `503` `dependency-unavailable` (not `401`).

        Do not use this from `/embed/v1`. Embed stays
        `POST /embed/exchange` only (ADV-021). Trusted-dev `POST /session`
        is unchanged and stays non-prod fail-closed.

        This path is local password only. OIDC Authorization Code +
        PKCE is `POST /oidc/start` and `POST /oidc/callback`. Do not
        fold an IdP code, verifier, or `client_secret` into this body.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
            example:
              identifier: admin@example.com
              password: "********"
      responses:
        "201":
          description: Standalone session issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              description: "ff_session (HttpOnly, SameSite=Lax) and ff_csrf (readable, SameSite=Strict)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /oidc/start:
    post:
      operationId: oidcStart
      summary: Begin OIDC Authorization Code + PKCE
      description: |
        Enterprise IdP start. No session and no CSRF (there is no
        `ff_session` yet). Body is empty or `{}`. The response is the
        IdP authorize URL, `state`, and `expires_at`. Sets
        `ff_oidc_state` (`HttpOnly`, `SameSite=Lax`, `Path=/api/v1`,
        `Secure` on HTTPS, about 10 minutes). That cookie is not the
        PKCE verifier. `authorization_url` includes `response_type=code`,
        server-configured `client_id` and `redirect_uri`, `scope`,
        `state`, `nonce`, `code_challenge`, and
        `code_challenge_method=S256`. It never includes `client_secret`
        or `code_verifier`. Chrome redirects the browser to
        `authorization_url`, then posts `code` and `state` to
        `POST /oidc/callback`. Rate-limited 30/min per client IP (`429`).
        All `OIDC_*` unset returns `503` `OIDC is not configured.`
        Discovery or IdP failure is `503` `Identity provider is not
        available.` Partial `OIDC_*` or a malformed `OIDC_STATE_KEY`
        refuses process start. Production requires `https` issuer and
        redirect URI. This door is not local login, trusted-dev
        `POST /session`, machine token, or `POST /embed/exchange`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCStartRequest"
      responses:
        "200":
          description: Authorize URL issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              description: "ff_oidc_state (HttpOnly, SameSite=Lax). Not the PKCE verifier."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCStartResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /oidc/callback:
    post:
      operationId: oidcCallback
      summary: Complete OIDC Authorization Code + PKCE
      description: |
        Exchanges `code` and `state` at the IdP and mints the same
        `ff_session` / `ff_csrf` pair as `POST /login` (`201`
        `SessionResponse`). Requires the `ff_oidc_state` cookie from
        start to match `state` (constant-time). The cookie is cleared
        on success and on failure. Body is only `code` and `state`.
        `client_secret`, `code_verifier`, `id_token`, and access or
        refresh tokens are never accepted and never returned. Unknown
        or replayed state, a bad code, a bad signature, or an
        issuer/audience/nonce mismatch is `401` `Invalid credentials.`
        A disabled user is the same `401`. IdP unavailability is `503`.
        Unconfigured OIDC is `503` `OIDC is not configured.` Subject is
        the IdP `sub` (never the email). Display name is `name`, else
        email, else `sub`. Rate-limited 30/min per client IP. Does not
        set `must_change_password`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCCallbackRequest"
      responses:
        "201":
          description: Standalone session issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              description: "Clears ff_oidc_state. Sets ff_session (HttpOnly, SameSite=Lax) and ff_csrf (readable, SameSite=Strict)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /session/mfa:
    get:
      operationId: getSessionMFA
      summary: MFA status for the current session
      description: |
        Session required. Returns TOTP enrollment and whether this
        session has completed step-up. No secret and no `otpauth_uri`.
        `applicable` is true only for local-login and OIDC sessions.
        Machine, trusted-dev, embed, and header-only sessions report
        `applicable: false` and `satisfied: true` — chrome must not
        force MFA on those doors. `privileged_permissions` is the
        stable list gated after step-up (`platform.administer` and
        every `credential.*`).
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: MFA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /session/mfa/enroll:
    post:
      operationId: enrollSessionMFA
      summary: Enroll a TOTP factor
      description: |
        Session and CSRF required. Body is empty or `{}`. On first
        enroll (or while enrollment is still pending) the `200` status
        includes `otpauth_uri` once. That URI contains the TOTP secret.
        Chrome may display it once for the authenticator app and must
        not store it in `localStorage`, the room, or logs. `GET
        /session/mfa` never returns it. A confirmed factor is `409`
        `MFA is already enrolled.` with no URI. A missing
        `MFA_SECRET_KEY` is `503` `MFA is not configured.` The secret
        at rest is AES-GCM sealed with that key. Pending enrollment can
        be replaced; a confirmed factor cannot.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCStartRequest"
      responses:
        "200":
          description: Enrollment started; otpauth URI returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /session/mfa/verify:
    post:
      operationId: verifySessionMFA
      summary: Verify a TOTP code and step up the session
      description: |
        Session and CSRF required. Body is `{code}` (six digits). A
        matching RFC 6238 SHA1 code (30s step, window ±1, replay
        rejected) marks this session stepped up (`mfa_verified_at`)
        until it ends. Refresh keeps that stamp. Success is the status
        object with `enrolled` and `satisfied` true and no
        `otpauth_uri` and no echoed code. A bad, replayed, or missing
        factor is `401` `Invalid credentials.` Rate-limited 8/min per
        user (`429`). Missing `MFA_SECRET_KEY` or a decrypt failure is
        `503` `MFA is not configured.` Privileged grants
        (`platform.administer`, `credential.*`) on a local-login or
        OIDC session that has not enrolled return `403` `mfa-required`
        (`Enroll and verify MFA before using this permission.`). An
        enrolled session that has not verified returns `403`
        `mfa-required` (`Verify MFA before using this permission.`).
        Machine, trusted-dev, and embed sessions are not this gate.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: Session stepped up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatus"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /session:
    post:
      operationId: createSession
      summary: Create a browser session
      description: |
        Trusted-dev only. Establishes a server-side session from bootstrap
        issuer/subject. Identity headers win when present. JSON `issuer` /
        `external_subject` are used only when those headers are absent; a
        conflicting body is `403`. Production (fail-closed) returns `401` and
        does not upsert a principal — use `POST /login` (standalone) or
        `POST /embed/exchange` (embed). Never rewrite login onto this
        route. Sets `ff_session` (`HttpOnly`, `SameSite=Lax`, `Secure` on
        HTTPS, `Path=/api/v1`) and `ff_csrf` (readable, `SameSite=Strict`,
        `Secure` on HTTPS, `Path=/api/v1`) when allowed.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/DisplayName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              description: "ff_session (HttpOnly) and ff_csrf (readable) cookies."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
    get:
      operationId: getSession
      summary: Current browser session
      description: |
        Requires the `ff_session` cookie. Header-only callers receive `401`.
        Embed-bound sessions (after `POST /embed/exchange`) include
        `session.embed` as the authoritative chrome payload: `mode`, `sdk`,
        `tenantId`, `tenantSlug`, `tenantName`, `workbenchKey`, `workspaceId`,
        `workspaceName`, and session-capped `capabilities`. Standalone
        sessions omit `session.embed`. `session.must_change_password` is
        true while the local-login credential still requires rotation
        (first-run one-time). The body never includes a compact JWS,
        assertion leftovers, password, hash, or signing material.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Current session
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /session/refresh:
    post:
      operationId: refreshSession
      summary: Refresh session idle expiry
      description: |
        Extends idle expiry up to the absolute cap and rotates the CSRF
        token. Requires `ff_session` plus matching `ff_csrf` / `X-CSRF-Token`.
        Concurrent refresh with a stale CSRF pair returns `409`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Session refreshed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /session/logout:
    post:
      operationId: logoutSession
      summary: Revoke the current session
      description: Requires CSRF when a session cookie is present. Clears both cookies.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session revoked
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /session/password:
    post:
      operationId: changeLocalPassword
      summary: Change the local-login password
      description: |
        Standalone first-run / rotation door. Requires `ff_session` plus
        matching `ff_csrf` / `X-CSRF-Token`. Embed sessions are `403`
        (ADV-021 / `POST /embed/exchange` is untouched). Password is
        POST-once and never echoed.

        The new password must meet the documented minimum length, must
        not match the current secret, and must not be the one-time
        default `admin`. Success replaces the hash, clears
        `must_change_password`, and makes `admin` / `admin` the same
        `401` as an unknown identifier.

        Trusted-dev `POST /session` is a separate identity path and is
        not this credential.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            example:
              password: "********"
      responses:
        "200":
          description: Password rotated; session claim cleared
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /session/audit-events:
    get:
      operationId: listSessionAuditEvents
      summary: Session audit events for the caller
      description: |
        Secret-free session security events for the authenticated principal
        (created, refreshed, revoked, expired, CSRF/origin/privilege denials).
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
      responses:
        "200":
          description: Audit events
