      summary: List artifact metadata for an execution
      description: |
        Returns encrypted-at-rest artifact **metadata** only (`{items}`).
        Never includes `storageRef`, envelope keys, bucket names, or
        download URLs. Query `stepId`, `kind`. Requires `execution.view`.
      parameters:
