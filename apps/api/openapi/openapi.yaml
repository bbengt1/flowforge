      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
          description: Server-derived. Never accepted from the client on writes.
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Null is a top-level folder.
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkflowFolderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowFolder"
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Applied page size. Default 50. Always present.
        cursor:
          type: string
          description: Opaque keyset token that produced this page. Empty on the first page. Always present.
        next:
          type: string
          description: Opaque token for the following page. Empty when this page is the last. Always present.
    CreateWorkflowFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
    UpdateWorkflowFolderRequest:
      type: object
      properties:
        name:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Null re-parents to top-level. Omit to leave unchanged.
    MoveWorkflowFolderRequest:
      type: object
      properties:
        folderId:
          type: string
          format: uuid
          nullable: true
          description: Null or omitted moves the workflow to Unfiled.
    SaveDraftRequest:
      type: object
      required: [revision, definitionYaml]
      properties:
        revision:
          type: integer
          format: int64
        definitionYaml:
          type: string
    PublishWorkflowRequest:
      type: object
      properties:
        revision:
          type: integer
          format: int64
          description: Optional optimistic lock against the current draft revision
        note:
          type: string
    PublishWorkflowResult:
      type: object
      required: [workflow, version]
      properties:
        workflow:
          $ref: "#/components/schemas/WorkflowRecord"
        version:
          $ref: "#/components/schemas/WorkflowVersion"
        pins:
          type: array
          items:
            $ref: "#/components/schemas/OpsPin"
        scriptArtifacts:
          type: array
          items:
            $ref: "#/components/schemas/ScriptVersionPin"
    CompareRef:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [draft, version]
        versionId:
          type: string
          format: uuid
        versionNumber:
          type: integer
    CompareWorkflowRequest:
      type: object
      required: [left, right]
      properties:
        left:
          $ref: "#/components/schemas/CompareRef"
        right:
          $ref: "#/components/schemas/CompareRef"
    CompareChange:
      type: object
      required: [path, op]
      properties:
        path:
          type: string
        op:
          type: string
          enum: [add, remove, replace]
        left: {}
        right: {}
    CompareWorkflowResult:
      type: object
      required: [equal, digestMatch, left, right, leftDigest, rightDigest, changes]
      properties:
        equal:
          type: boolean
        digestMatch:
          type: boolean
        left:
          $ref: "#/components/schemas/CompareRef"
        right:
          $ref: "#/components/schemas/CompareRef"
        leftDigest:
          type: string
        rightDigest:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/CompareChange"
    RestoreDraftRequest:
      type: object
      properties:
        expectedRevision:
          type: integer
          format: int64
    WorkflowExport:
      type: object
      required: [workflowId, versionId, versionNumber, digest, filename, definitionYaml]
      properties:
        workflowId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        digest:
          type: string
        filename:
          type: string
        definitionYaml:
          type: string
    StartExecutionRequest:
      type: object
      required: [workflowVersionId]
      properties:
        workflowVersionId:
          type: string
          format: uuid
          description: Published workflow version. Drafts and omitted values are 400.
        idempotencyKey:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9._~:-]{1,128}$'
          description: Required for the E10.1 run dialog. Also accepted as Idempotency-Key.
        input:
          type: object
          additionalProperties: true
          description: Bounded typed start input (16 KiB). Validated against the published manual trigger schema when declared. Secrets are redacted before persist.
        correlationId:
          type: string
        triggerId:
          type: string
          format: uuid
    WorkflowExecution:
      type: object
      required: [id, workflowId, workflowVersionId, workflowDigest, status, createdAt, input, policySnapshot, replayed]
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        workflowSlug:
          type: string
        workflowName:
          type: string
        workflowVersionId:
          type: string
          format: uuid
        workflowDigest:
          type: string
        triggerId:
          type: string
        status:
          type: string
          enum: [queued, pinned, running, waiting, succeeded, failed, canceled, indeterminate]
        idempotencyKey:
          type: string
        input:
          type: object
          additionalProperties: true
        policySnapshot:
          type: object
          additionalProperties: true
        correlationId:
          type: string
        requestedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        retentionUntil:
          type: string
          format: date-time
        replayed:
          type: boolean
        statusReason:
          type: string
          enum: [no-worker]
          description: >
            Additive operator hint when status is still queued and no job has
            been claimed after 15s. Does not change status or fencing.
            Chloe can show “no worker is claiming jobs”.
        pins:
          type: array
          items: {$ref: "#/components/schemas/OpsPin"}
        steps:
          type: array
          items: {$ref: "#/components/schemas/ExecutionStep"}
        artifacts:
          type: array
          items: {$ref: "#/components/schemas/ExecutionArtifact"}
          description: Artifact metadata only (E5.3). Never includes storage locators or credentials.
        jobs:
          type: array
          items: {$ref: "#/components/schemas/ExecutionJob"}
        auditEvents:
          type: array
          items: {$ref: "#/components/schemas/AuditEvent"}
    WebhookTrigger:
      type: object
      additionalProperties: false
      required: [id, publicId, ingressPath, workflowId, workflowVersionId, type, status, secretCredentialId, contentType, fieldMapping]
      properties:
        id: {type: string, format: uuid}
        publicId: {type: string, pattern: '^wh_[0-9a-f]{64}$'}
        ingressPath: {type: string, example: /api/v1/hooks/wh_0123}
        workflowId: {type: string, format: uuid}
        workflowVersionId: {type: string, format: uuid}
        type: {type: string, enum: [webhook]}
        status: {type: string, enum: [enabled, disabled]}
        secretCredentialId: {type: string, format: uuid, description: Vault webhook_secret reference. Never a plaintext secret.}
        contentType: {type: string, example: application/json}
        fieldMapping:
          type: object
          additionalProperties: {type: string}
          description: Destination field → dotted source path. Empty mapping copies the root JSON object.
        maxBodyBytes: {type: integer, minimum: 1, maximum: 262144}
        clockSkewSeconds: {type: integer, minimum: 1, maximum: 3600}
        replayRetentionSeconds: {type: integer, minimum: 1, maximum: 7200}
        rateLimitPerMinute: {type: integer, minimum: 1, maximum: 600}
        workspaceRatePerMinute: {type: integer, minimum: 1, maximum: 3000}
        maxConcurrency: {type: integer, minimum: 1, maximum: 20}
        workspaceMaxConcurrency: {type: integer, minimum: 1, maximum: 100}
        createdBy: {type: string}
        updatedBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      description: Safe webhook trigger metadata. The API never returns the HMAC secret.
    WebhookTriggerWrite:
      type: object
      additionalProperties: false
      properties:
        type: {type: string, enum: [webhook]}
        workflowVersionId: {type: string, format: uuid, description: Published version UUID. Drafts are 400.}
        secretCredentialId: {type: string, format: uuid, description: Existing vault webhook_secret. Omit when creating via secret.}
        contentType: {type: string, example: application/json}
        fieldMapping:
          type: object
          additionalProperties: {type: string}
        maxBodyBytes: {type: integer, minimum: 1, maximum: 262144}
        clockSkewSeconds: {type: integer, minimum: 1, maximum: 3600}
        replayRetentionSeconds: {type: integer, minimum: 1, maximum: 7200}
        rateLimitPerMinute: {type: integer, minimum: 1, maximum: 600}
        workspaceRatePerMinute: {type: integer, minimum: 1, maximum: 3000}
        maxConcurrency: {type: integer, minimum: 1, maximum: 20}
        workspaceMaxConcurrency: {type: integer, minimum: 1, maximum: 100}
        secret:
          type: object
          additionalProperties: {type: string}
          description: Create only. `{secret:"..."}` stores a new webhook_secret. Rejected on PATCH; use rotate.
        id: {type: string, description: Rejected if present}
        workspace_id: {type: string, description: Rejected if present}
        workspaceId: {type: string, description: Rejected if present}
    Schedule:
      type: object
      additionalProperties: false
      required: [id, workflowId, workflowVersionId, timezone, overlapPolicy, misfirePolicy, catchUp, status, nextFireAt]
      properties:
        id: {type: string, format: uuid}
        workflowId: {type: string, format: uuid}
        workflowVersionId: {type: string, format: uuid}
        workflowDigest: {type: string}
        triggerId: {type: string}
        timezone: {type: string, description: IANA timezone. Required.}
        cron: {type: string}
        interval: {type: string}
        overlapPolicy: {type: string, enum: [skip, reject, queue]}
        misfirePolicy: {type: string, enum: [ignore, fire-once]}
        catchUp: {type: integer, minimum: 0, maximum: 5}
        status: {type: string, enum: [enabled, disabled]}
        nextFireAt: {type: string, format: date-time}
        lastFiredAt: {type: string, format: date-time}
        lastExecutionId: {type: string, format: uuid}
        lastError: {type: string}
        createdBy: {type: string}
        updatedBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ScheduleWrite:
      type: object
      additionalProperties: false
      properties:
        workflowId: {type: string, format: uuid}
        workflowVersionId: {type: string, format: uuid, description: Published version UUID. Drafts are 400.}
        triggerId: {type: string}
        timezone: {type: string, description: IANA name. Required on create.}
        cron: {type: string}
        interval: {type: string}
        overlapPolicy: {type: string, enum: [skip, reject, queue]}
        misfirePolicy: {type: string, enum: [ignore, fire-once]}
        catchUp: {type: integer, minimum: 0, maximum: 5}
        id: {type: string, description: Rejected if present}
        workspace_id: {type: string, description: Rejected if present}
        workspaceId: {type: string, description: Rejected if present}
    ScheduleCatalog:
      type: object
