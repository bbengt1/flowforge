        status:
          type: string
          enum: [draft, published, archived]
        draftRevision:
          type: integer
          format: int64
        draftDigest:
          type: string
        latestVersionNumber:
          type: integer
        latestVersionId:
          type: string
          format: uuid
        latestVersionDigest:
          type: string
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkflowList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRecord"
    WorkflowDraft:
