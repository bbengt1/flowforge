      operationId: getWorkspaceCache
      summary: Read a workspace cache entry
      description: Cache keys are server-prefixed with the derived workspace ID.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cache value
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheValue"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putWorkspaceCache
      summary: Write a workspace cache entry
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        "200":
          description: Cache value stored
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheValue"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /workspace/realtime/channels/{id}/subscribe:
    post:
      operationId: subscribeWorkspaceRealtime
      summary: Subscribe to a workspace realtime channel
      description: Requires `workflow.view`. Cross-workspace channel IDs return `not-found`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Subscribed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                type: object
                required: [channel_id, status]
                properties:
                  channel_id:
                    type: string
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace/audit-events:
    get:
      operationId: listWorkspaceAuditEvents
      summary: List workspace audit events
      description: Requires `workspace.administer`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Issuer"
        - $ref: "#/components/parameters/Subject"
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkbenchKey"
        - $ref: "#/components/parameters/HostWorkspaceID"
      responses:
        "200":
          description: Audit events
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRecordList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation identifier. Accepted only when 16–128 ASCII letters, digits, or hyphens.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9-]{16,128}$
    Issuer:
      name: X-FlowForge-Issuer
      in: header
      required: false
      description: |
        Host identity issuer for non-browser callers. Browser clients should
        use `ff_session` instead. Ignored when a session cookie is present
        unless it conflicts (conflict fails closed). Does not authorize a workspace.
      schema:
        type: string
    Subject:
      name: X-FlowForge-Subject
      in: header
      required: false
      description: Host identity subject. Unique with issuer. Does not authorize a workspace.
      schema:
        type: string
    DisplayName:
      name: X-FlowForge-Display-Name
      in: header
      required: false
      description: Optional display name applied on user upsert.
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        Required on state-changing requests authenticated by `ff_session`.
        Must match the `ff_csrf` cookie and the server-side session secret.
      schema:
        type: string
    TenantID:
      name: X-FlowForge-Tenant-ID
      in: header
      required: false
      description: Tenant UUID used with workbench_key to resolve workspace identity.
      schema:
        type: string
        format: uuid
    TenantSlug:
      name: X-FlowForge-Tenant-Slug
      in: header
      required: false
      description: Tenant slug used with workbench_key when tenant id is omitted.
      schema:
        type: string
    WorkbenchKey:
      name: X-FlowForge-Workbench-Key
      in: header
      required: false
      description: Host workbench key. Combined with tenant identity, this is the only accepted workspace lookup.
      schema:
        type: string
    HostWorkspaceID:
      name: X-FlowForge-Workspace-ID
      in: header
      required: false
      description: Untrusted host-supplied workspace UUID. Rejected unless it matches the server-derived `(tenant, workbench_key)` workspace.
      schema:
        type: string
        format: uuid
    WorkflowID:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionID:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    XRequestID:
      description: Correlation identifier. Caller values are accepted only when 16–128 ASCII letters, digits, or hyphens.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9-]{16,128}$
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    Problem:
      type: object
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - invalid-request
            - unauthenticated
            - forbidden
            - not-found
            - conflict
            - method-not-allowed
            - request-too-large
            - internal-error
            - dependency-unavailable
            - invalid-workflow
        request_id:
          type: string
        errors:
          type: array
          description: Field-level workflow validation errors (invalid-workflow only).
          items:
            $ref: "#/components/schemas/WorkflowFieldError"
    Tenant:
      type: object
      required: [id, slug, name, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Workspace:
      type: object
      required: [id, tenant_id, workbench_key, name, status]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        workbench_key:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, issuer, external_subject, status]
      properties:
        id:
          type: string
          format: uuid
        issuer:
          type: string
        external_subject:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled]
    CreateSessionRequest:
      type: object
      properties:
        issuer:
          type: string
        external_subject:
          type: string
        display_name:
          type: string
    Session:
      type: object
      required: [id, created_at, last_seen_at, idle_expires_at, absolute_expires_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
    SessionResponse:
      type: object
      required: [session, principal, csrf_token]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        principal:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
          description: Same value as the `ff_csrf` cookie. Never log or persist in localStorage.
    SessionAuditEvent:
      type: object
      required: [id, event_type, outcome, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - session.created
            - session.refreshed
            - session.revoked
            - session.expired
            - session.csrf_rejected
            - session.origin_rejected
            - session.privilege_denied
            - session.auth_rejected
        outcome:
          type: string
          enum: [allowed, denied]
        reason:
          type: string
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
    SessionAuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionAuditEvent"
    WorkflowFieldError:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
          example: spec.nodes[0].with.namespace
        line:
          type: integer
        column:
          type: integer
        code:
          type: string
          example: invalid-uuid
        message:
          type: string
    WorkflowPort:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [object, string, integer, boolean, any]
        required:
          type: boolean
    WorkflowCatalog:
      type: object
      required: [apiVersion, triggers, nodes]
      properties:
        apiVersion:
          type: string
          example: flowforge/v1
        triggers:
          type: array
          items:
            type: object
            required: [type, phase]
            properties:
              type:
                type: string
              phase:
                type: string
                enum: [core, next, provider]
              outputs:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowPort"
        nodes:
          type: array
          items:
            type: object
            required: [type, phase]
            properties:
              type:
                type: string
              phase:
                type: string
                enum: [core, next, provider]
              inputs:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowPort"
              outputs:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowPort"
              requiredWith:
                type: array
                items:
                  type: string
    WorkflowDefinitionEnvelope:
      type: object
      required: [definitionYaml]
      properties:
        definitionYaml:
          type: string
          description: Canonical flowforge/v1 YAML document
    WorkflowSummary:
      type: object
      required: [apiVersion, name, triggers, nodes, edges, outputs]
      properties:
        apiVersion:
          type: string
        name:
          type: string
        description:
          type: string
        triggers:
          type: array
          items:
            type: object
            required: [id, type]
            properties:
              id:
                type: string
              type:
                type: string
        nodes:
          type: array
          items:
            type: object
            required: [id, type, name]
            properties:
              id:
                type: string
              type:
                type: string
              name:
                type: string
        edges:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from:
                type: string
              to:
                type: string
        outputs:
          type: array
          items:
            type: object
            required: [name, from]
            properties:
              name:
                type: string
              from:
                type: string
    WorkflowValidateResult:
      type: object
      required: [valid, summary, warnings]
      properties:
        valid:
          type: boolean
        summary:
          $ref: "#/components/schemas/WorkflowSummary"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowFieldError"
    WorkflowNormalizeResult:
      type: object
      required: [definitionYaml, digest, summary, warnings]
      properties:
        definitionYaml:
          type: string
        digest:
          type: string
          description: sha256 digest of normalized YAML
          example: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        summary:
          $ref: "#/components/schemas/WorkflowSummary"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowFieldError"
    WorkflowRecord:
      type: object
      required: [id, slug, name, status, draftRevision, draftDigest, latestVersionNumber, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        draftRevision:
          type: integer
          format: int64
        draftDigest:
          type: string
        latestVersionNumber:
          type: integer
        latestVersionId:
          type: string
          format: uuid
        latestVersionDigest:
          type: string
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkflowList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRecord"
    WorkflowDraft:
      type: object
      required: [workflowId, revision, definitionYaml, digest, summary, warnings, validationState, updatedAt]
      properties:
        workflowId:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
        definitionYaml:
          type: string
        digest:
          type: string
        summary:
          $ref: "#/components/schemas/WorkflowSummary"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowFieldError"
        validationState:
          type: string
          enum: [valid, invalid]
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    WorkflowDetail:
      type: object
      required: [workflow, draft]
      properties:
        workflow:
          $ref: "#/components/schemas/WorkflowRecord"
        draft:
          $ref: "#/components/schemas/WorkflowDraft"
    WorkflowVersion:
      type: object
      required: [id, workflowId, versionNumber, definitionYaml, digest, summary, publishNote, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        definitionYaml:
          type: string
        digest:
          type: string
        summary:
          $ref: "#/components/schemas/WorkflowSummary"
        publishNote:
          type: string
        publishedBy:
          type: string
        publishedAt:
          type: string
          format: date-time
    WorkflowVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowVersion"
    CreateWorkflowRequest:
      type: object
      required: [definitionYaml]
      properties:
        slug:
          type: string
        name:
          type: string
        definitionYaml:
          type: string
    SaveDraftRequest:
      type: object
      required: [revision, definitionYaml]
      properties:
        revision:
          type: integer
          format: int64
        definitionYaml:
          type: string
    PublishWorkflowRequest:
      type: object
      properties:
        revision:
          type: integer
          format: int64
          description: Optional optimistic lock against the current draft revision
        note:
          type: string
    PublishWorkflowResult:
      type: object
      required: [workflow, version]
      properties:
        workflow:
          $ref: "#/components/schemas/WorkflowRecord"
        version:
          $ref: "#/components/schemas/WorkflowVersion"
    CompareRef:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [draft, version]
        versionId:
          type: string
          format: uuid
        versionNumber:
          type: integer
    CompareWorkflowRequest:
      type: object
      required: [left, right]
      properties:
        left:
          $ref: "#/components/schemas/CompareRef"
        right:
          $ref: "#/components/schemas/CompareRef"
    CompareChange:
      type: object
      required: [path, op]
      properties:
        path:
          type: string
        op:
          type: string
          enum: [add, remove, replace]
        left: {}
        right: {}
    CompareWorkflowResult:
      type: object
      required: [equal, digestMatch, left, right, leftDigest, rightDigest, changes]
      properties:
        equal:
          type: boolean
        digestMatch:
          type: boolean
        left:
          $ref: "#/components/schemas/CompareRef"
        right:
          $ref: "#/components/schemas/CompareRef"
        leftDigest:
          type: string
        rightDigest:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/CompareChange"
    RestoreDraftRequest:
      type: object
      properties:
        expectedRevision:
          type: integer
          format: int64
    WorkflowExport:
      type: object
      required: [workflowId, versionId, versionNumber, digest, filename, definitionYaml]
      properties:
        workflowId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        digest:
          type: string
        filename:
          type: string
        definitionYaml:
          type: string
    StartExecutionRequest:
      type: object
      required: [workflowVersionId]
      properties:
        workflowVersionId:
          type: string
          format: uuid
    WorkflowExecution:
      type: object
      required: [id, workflowId, workflowVersionId, workflowDigest, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        workflowVersionId:
          type: string
          format: uuid
        workflowDigest:
          type: string
        status:
          type: string
          enum: [queued, pinned]
        requestedBy:
          type: string
        createdAt:
          type: string
          format: date-time
    CurrentWorkspace:
      type: object
      required: [workspace, tenant, principal, roles, permissions]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        tenant:
          $ref: "#/components/schemas/Tenant"
        principal:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    Member:
      type: object
      required: [user, roles, permissions]
      properties:
        user:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    MembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [workspace, tenant, roles, permissions]
            properties:
              workspace:
                $ref: "#/components/schemas/Workspace"
              tenant:
                $ref: "#/components/schemas/Tenant"
              roles:
                type: array
                items:
                  type: string
              permissions:
                type: array
                items:
                  type: string
    PermissionMatrix:
      type: object
      required: [permissions, roles]
      properties:
        permissions:
          type: array
          items:
            type: object
            required: [key, family]
            properties:
              key:
                type: string
              family:
                type: string
                enum: [view, edit, publish, execute, credential, approval, administration]
        roles:
          type: array
          items:
            type: object
            required: [key, description, permissions]
            properties:
              key:
                type: string
              description:
                type: string
              permissions:
                type: array
                items:
                  type: string
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                type: string
              description:
                type: string
              permissions:
                type: array
                items:
                  type: string
    IsolationKind:
      type: string
      enum: [credential, artifact, job, cache, realtime, audit]
    WorkspaceRecord:
      type: object
      required: [workspace_id, id, kind, name, created_at]
      properties:
        workspace_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/IsolationKind"
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    WorkspaceRecordList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceRecord"
    WorkspaceRecordLink:
      type: object
      required: [workspace_id, id, parent_id, kind, created_at]
      properties:
        workspace_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/IsolationKind"
        created_at:
          type: string
          format: date-time
    CacheValue:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
    PermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                type: string
  responses:
    InvalidWorkflow:
      description: Workflow YAML failed parse, normalization, or graph validation
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:invalid-workflow
            title: Invalid Workflow
            status: 400
            detail: The workflow definition is not valid.
            instance: /api/v1/workflows/validate
            code: invalid-workflow
            request_id: 0123456789abcdef0123456789abcdef
            errors:
              - path: spec.edges[0].from
                line: 24
                column: 11
