    post:
      operationId: publishScriptArtifact
      summary: Publish a scanned and signed script artifact
      description: |
        Requires `workflow.publish`. Validates source, entrypoint, published
        runtime profile, and declared I/O schema shape. Packages an immutable
        content-addressed artifact, scans and signs it, and rejects secrets
        in source. Host-supplied workspace IDs are rejected. The package blob
        is never returned.
      parameters:
