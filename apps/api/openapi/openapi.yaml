        id:
          type: string
          format: uuid
        issuer:
          type: string
        external_subject:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled]
    CreateSessionRequest:
      type: object
      properties:
        issuer:
          type: string
        external_subject:
          type: string
        display_name:
          type: string
    Session:
      type: object
      required: [id, created_at, last_seen_at, idle_expires_at, absolute_expires_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
    SessionResponse:
      type: object
      required: [session, principal, csrf_token]
