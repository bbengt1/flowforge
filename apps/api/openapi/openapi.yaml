        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        draftRevision:
          type: integer
          format: int64
        draftDigest:
          type: string
        latestVersionNumber:
          type: integer
        latestVersionId:
          type: string
          format: uuid
        latestVersionDigest:
          type: string
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        folderId:
          type: string
          format: uuid
          nullable: true
          description: Null means Unfiled. Not stored in YAML.
    WorkflowList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRecord"
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Applied page size. Default 50. Always present.
        cursor:
          type: string
          description: Opaque keyset token that produced this page. Empty on the first page. Always present.
        next:
          type: string
          description: Opaque token for the following page. Empty when this page is the last. Always present.
    WorkflowDraft:
      type: object
      required: [workflowId, revision, definitionYaml, digest, summary, warnings, validationState, updatedAt]
      properties:
        workflowId:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
        definitionYaml:
          type: string
        digest:
          type: string
        summary:
          $ref: "#/components/schemas/WorkflowSummary"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowFieldError"
        validationState:
          type: string
