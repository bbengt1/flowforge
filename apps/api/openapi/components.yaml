        policyRevision: {type: integer}
        approverRole: {type: string}
        expiresIn: {type: string}
        expiresAt: {type: string, format: date-time}
        reason: {type: string}
    Approval:
      type: object
      required: [id, workflowId, workflowVersionId, workflowDigest, nodeId, operation, bindingFingerprint, approverRole, status, expiresAt]
      properties:
        id: {type: string, format: uuid}
        workflowId: {type: string, format: uuid}
        workflowVersionId: {type: string, format: uuid}
        workflowDigest: {type: string}
        executionId: {type: string, format: uuid}
        nodeId: {type: string}
        nodeName: {type: string}
        operation: {type: string}
        targetKind: {type: string}
        targetId: {type: string, format: uuid}
        targetVersionId: {type: string, format: uuid}
        targetDigest: {type: string}
        policyResourceId: {type: string, format: uuid}
        policyVersionId: {type: string, format: uuid}
        policyDigest: {type: string}
        policyRevision: {type: integer}
        bindingFingerprint: {type: string}
        approverRole: {type: string}
        status: {type: string, enum: [pending, approved, rejected, expired, invalidated, canceled]}
        closeReason:
          type: string
          description: Set only when status is canceled. run_canceled, workflow_deleted, or requirement_unresolvable. No decider is recorded.
          enum: [run_canceled, workflow_deleted, requirement_unresolvable]
        closeReasonDetails:
          $ref: "#/components/schemas/StatusReasonDetails"
          description: Set with closeReason requirement_unresolvable when the cause is known (no_eligible_decider).
        approvers:
          $ref: "#/components/schemas/ApprovalApprovers"
          description: >
            Present only on a targeted gate (with.approvers in the pinned YAML).
            Omitted when untargeted. users is the park-time snapshot of eligible
            named users; groups are the named group ids, whose membership is
            checked live at decide time. Display name and UUID only, never
            member lists, emails, or roles.
        capabilities:
          $ref: "#/components/schemas/ApprovalCapabilities"
        expiresAt: {type: string, format: date-time}
        requestedBy: {type: string, format: uuid}
        decidedBy: {type: string, format: uuid}
        decidedAt: {type: string, format: date-time}
        decisionNote: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ApprovalPrincipalRef:
      type: object
      required: [id, displayName]
      description: Display name and UUID only. A deleted user or group is not listed.
      properties:
        id: {type: string, format: uuid}
        displayName: {type: string}
    ApprovalApprovers:
      type: object
      required: [users, groups]
      properties:
        users:
          type: array
          items: {$ref: "#/components/schemas/ApprovalPrincipalRef"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/ApprovalPrincipalRef"}
    ApprovalDecideCapability:
      type: object
      required: [allowed]
      description: >
        Read-only decide eligibility for the caller, computed by the same
        function as POST decide on the stored row. Decide stays authoritative.
        allowed true sets via and omits code. allowed false sets code and
        omits via.
      properties:
        allowed: {type: boolean}
        via:
          type: string
          enum: [target, admin_override]
          description: >
            target when the caller is a snapshot user or a live member of a
            snapshot group, or the gate is untargeted. admin_override when the
            caller is a workspace admin who is not the requester and is not
            targeted; deciding writes decided_by_admin_override.
        code:
          type: string
          enum: [missing_permission, self_approval, role_mismatch, approver_not_targeted, not_pending, approval_closed]
        reason: {type: string}
    ApprovalCapabilities:
      type: object
      required: [decide]
      properties:
        decide: {$ref: "#/components/schemas/ApprovalDecideCapability"}
    ApproverCandidateList:
      type: object
      required: [users, groups]
      description: >
        Builder picker source. users are active workspace members whose roles
        grant approval.decide and meet the requested role (exact role or
        admin). groups are every workspace group. Display name and UUID only:
        no emails, no role details, no member lists.
      properties:
        users:
          type: array
          items: {$ref: "#/components/schemas/ApprovalPrincipalRef"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/ApprovalPrincipalRef"}
    StatusReasonDetails:
      type: object
      description: Machine-readable detail for requirement_unresolvable.
      properties:
        cause:
          type: string
          enum: [no_eligible_decider]
          description: >
            no_eligible_decider when a targeted gate had no eligible decider
            at park or boot resync: no named user or group member who is
            active, bound, holds approval.decide, meets the role, and is not
            the requester, and no active workspace admin other than the
            requester. The gate fails instead of waiting.
    ApprovalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Approval"}
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Applied page size. Default 50. Always present.
        cursor:
          type: string
          description: Opaque keyset token that produced this page. Empty on the first page. Always present.
        next:
          type: string
          description: Opaque token for the following page. Empty when this page is the last. Always present.
    ApprovalCatalog:
      type: object
      required: [statuses, decisions, defaultExpiresIn]
      properties:
        statuses:
          type: array
          items: {type: string}
        decisions:
          type: array
          items: {type: string}
        defaultExpiresIn: {type: string}
        waitResumeEnabled: {type: boolean}
        resumeRoute: {type: string}
        waitSurvivesWorkerLoss: {type: boolean}
        selfApprovalDenied: {type: boolean}
        freshAuthRequired: {type: boolean}
        help: {type: string}
    ApprovalCreateRequest:
      type: object
      required: [workflowId, workflowVersionId]
      properties:
        workflowId: {type: string, format: uuid}
        workflowVersionId: {type: string, format: uuid}
        executionId: {type: string, format: uuid}
        nodeId: {type: string}
    ApprovalDecideRequest:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [approved, rejected, approve, reject]}
        note: {type: string}
    ApprovalEvent:
      type: object
      required: [id, approvalId, eventType, occurredAt]
      properties:
        id: {type: string, format: uuid}
        approvalId: {type: string, format: uuid}
        eventType: {type: string, enum: [created, approved, rejected, expired, invalidated, canceled, corrected]}
        actorId: {type: string, format: uuid}
        details:
          type: object
          additionalProperties: true
          description: >
            approved and rejected carry via (target or admin_override). An
            override also writes audit action approval.decided_by_admin_override.
            corrected may carry approvers {from, to} digests. canceled with
            requirement_unresolvable may carry cause no_eligible_decider.
        occurredAt: {type: string, format: date-time}
    ApprovalEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ApprovalEvent"}
    OpsCreateRequest:
      type: object
      required: [name, spec]
      properties:
        slug: {type: string}
        name: {type: string}
        spec: {type: object, additionalProperties: true}
    OpsSaveDraftRequest:
      type: object
      required: [revision, spec]
      properties:
        revision: {type: integer}
        name: {type: string}
        spec: {type: object, additionalProperties: true}
    OpsPublishRequest:
      type: object
      properties:
        revision: {type: integer}
        note: {type: string}
    OpsSelectRequest:
      type: object
      properties:
        versionId: {type: string, format: uuid}
    OpsSelectBatchRequest:
      type: object
      required: [refs]
      properties:
        refs:
          type: array
          items:
            type: object
            required: [kind, resourceId]
            properties:
              kind: {type: string}
              resourceId: {type: string, format: uuid}
              versionId: {type: string, format: uuid}
    Health:
      type: object
      required: [status, version, sha]
      description: |
        Process liveness plus non-secret build identity. `version` and
        `sha` come from image ldflags (`BUILD_VERSION` / `BUILD_SHA`
        build args) or the same env names at runtime. Missing or
        unsafe values are `dev` / `unknown`. Health never fails because
        identity is absent. No secrets, DSNs, or keys.
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Release or image tag. Default `dev`.
        sha:
          type: string
          description: Git object name (7–40 hex) or `unknown`.
    Readiness:
      type: object
      required: [status, version, sha]
      description: |
        PostgreSQL reachable, plus the same non-secret build identity
        as `/health`. 503 problem responses do not include version/sha.
      properties:
        status:
          type: string
          enum: [ready]
        version:
          type: string
        sha:
          type: string
    BootstrapPersistenceConfirm:
      type: object
      additionalProperties: false
      required: [confirm]
      description: |
        Operator confirmation that process DATABASE_URL persistence is
        ready. Never a DSN, password, or connection string.
      properties:
        confirm:
          type: boolean
          enum: [true]
          description: Must be true. The server pings PostgreSQL; the client does not send credentials.
    BootstrapFirstAdmin:
      type: object
      additionalProperties: false
      required: [issuer, external_subject]
      description: |
        First admin identity. Prefer existing localseed /
        PLATFORM_ADMINS upsert (issuer + external_subject). This step
        does not accept a password. The seeded admin password is
        POST /bootstrap/admin-password.
      properties:
        issuer:
          type: string
          minLength: 1
          maxLength: 512
          description: Identity issuer. Same vocabulary as localseed PLATFORM_ADMINS.
        external_subject:
          type: string
          minLength: 1
          maxLength: 256
          description: External subject. Same vocabulary as localseed PLATFORM_ADMINS.
        display_name:
          type: string
          maxLength: 200
    BootstrapAdminPasswordRequest:
      type: object
      additionalProperties: false
      required: [setup_token, password]
      description: |
        One-time setup token and the new admin password. Both are
        password-type fields. Never send them as query parameters.
        Neither value is returned.
      properties:
        setup_token:
          type: string
          format: password
          minLength: 16
          maxLength: 256
          description: One-time token from the API log or FLOWFORGE_SETUP_TOKEN.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: New admin password. Must not be the retired default and must not equal setup_token.
    BootstrapAdminPasswordResult:
      type: object
      additionalProperties: false
      required: [adminPasswordSet, mustChangePassword, loginReady, identifier, bootstrap]
      description: |
        Password is set and the setup token is consumed. No session is
        minted. The next step is POST /login. The password and the
        token are absent.
      properties:
        adminPasswordSet:
          type: boolean
          enum: [true]
        mustChangePassword:
          type: boolean
          enum: [false]
          description: First-run set-password does not require another change. POST /login omits must_change_password.
        loginReady:
          type: boolean
          enum: [true]
        identifier:
          type: string
          enum: [admin]
          description: Seeded username. Not a secret.
        bootstrap:
          $ref: "#/components/schemas/BootstrapStatus"
    BootstrapPublicURL:
      type: object
      additionalProperties: false
      required: [publicBaseUrl]
      description: |
        Public origin for this instance. HTTPS is preferred. HTTP is
        allowed for local installs. Never echoed on GET /bootstrap.
      properties:
        publicBaseUrl:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: |
            Origin only (`https://host[:port]`). Trailing slash is
            stripped. No userinfo, query, fragment, or path. HTTP is
            documented for local (for example `http://localhost:3000`).
    BootstrapTLS:
      description: |
        Wizard step 4 body. PEM fields POST once and are never
        returned. Skip writes no PEM. ACME is not accepted.
      oneOf:
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action:
              type: string
              enum: [create-self-signed]
        - type: object
          additionalProperties: false
          required: [action, certPem, keyPem]
          properties:
            action:
              type: string
              enum: [upload]
            certPem:
              type: string
              minLength: 1
              maxLength: 262144
              description: Certificate PEM. POST once. Never returned.
            keyPem:
              type: string
              minLength: 1
              maxLength: 262144
              description: Private key PEM. POST once. Never returned.
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action:
              type: string
              enum: [skip]
    BootstrapStep:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready:
          type: boolean
        mode:
          type: string
          description: TLS status-only mode. Never a key or PEM.
          enum: [none, self_signed, uploaded, local_http, skipped]
    BootstrapStatus:
      type: object
      additionalProperties: false
      required: [complete, incomplete, skipped, standaloneOnly, steps]
      properties:
        complete:
          type: boolean
        incomplete:
          type: boolean
        skipped:
          type: boolean
          description: Trusted-dev / compose localseed skip (admin + URL).
        standaloneOnly:
          type: boolean
          description: Always true. Wizard and this gate never apply to /embed/v1.
        steps:
          type: object
          additionalProperties: false
          required: [persistence, firstAdmin, publicUrl, tls]
          properties:
            persistence:
              $ref: "#/components/schemas/BootstrapStep"
            firstAdmin:
              $ref: "#/components/schemas/BootstrapStep"
            publicUrl:
              $ref: "#/components/schemas/BootstrapStep"
            tls:
              $ref: "#/components/schemas/BootstrapStep"
    Problem:
      type: object
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - invalid-request
            - unauthenticated
            - forbidden
            - csrf-invalid
            - not-found
            - conflict
            - method-not-allowed
            - request-too-large
            - rate-limited
            - internal-error
            - dependency-unavailable
            - invalid-workflow
            - retry-denied
            - artifact-mutable
            - artifact-unscanned
            - artifact-unsigned
            - artifact-scan-failed
            - mfa-required
            - password_change_required
            - workflow_has_active_executions
            - workflow_slug_reserved
            - workflow_slug_taken
            - slug_immutable
            - workflow_deleted
            - execution_not_retryable
            - step_attempt_superseded
            - approval_closed
            - approval_requirement_unavailable
            - group_name_taken
            - group_member_not_in_workspace
            - group_managed_by_scim
            - approver_not_targeted
            - scim_token_limit
            - scim_not_configured
        request_id:
          type: string
        reason:
          type: string
          description: Machine-readable cause. Set on execution_not_retryable (run_canceled, run_not_failed, step_not_started, step_not_failed, incoming_unresolved, retry_not_allowed, workflow_deleted).
        errors:
          type: array
          description: >
            Field-level errors. invalid-workflow lists YAML paths. Create and
            import slug conflicts (workflow_slug_taken, workflow_slug_reserved),
            an invalid new slug (invalid-request), and a draft save that changes
            metadata.slug (slug_immutable) use path slug. Workspace group
            name clashes (group_name_taken) and invalid group names
            (invalid-request) use path displayName. A group member that is not
            an active, bound workspace member (group_member_not_in_workspace)
            uses path userId. A flow.approval gate whose with.approvers names
            a group that is not in this workspace (invalid-workflow, error code
            approver-group-not-found) uses the YAML path, for example
            spec.nodes[2].with.approvers.groups[0]. A random UUID and another
            tenant's group id get the same error. A named user at
            with.approvers.users[i] that is not a workspace member
            (approver-not-member), is a machine account rather than a person
            (approver-not-person), is disabled (approver-disabled), has no
            approval.decide (approver-cannot-decide), or lacks the gate's
            approverRole (approver-role-mismatch) is rejected the same way. A
            group that contains machine accounts still publishes; those
            members never count as approvers. Clients place field errors
            by path, never by message text.
          items:
            $ref: "#/components/schemas/WorkflowFieldError"
        suggestedSlug:
          type: string
          description: >
            Optional. Set on a 409 workflow_slug_taken or workflow_slug_reserved
            from POST /workflows (create and YAML import). A free slug built by
            the derived-slug rules from the slug that clashed: the next numeric
            suffix after the highest one already used for that base, live or
            deleted. It is a hint, not a hold. Retrying with it explicitly can
            still return 409, and that 409 carries a fresh suggestion. Absent
            when no suggestion could be built.
          example: orders-sync-3
    Tenant:
      type: object
      required: [id, slug, name, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Workspace:
      type: object
      required: [id, tenant_id, workbench_key, name, status]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        workbench_key:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, issuer, external_subject, status]
      properties:
        id:
          type: string
          format: uuid
        issuer:
          type: string
        external_subject:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled]
    MachineTokenRequest:
      type: object
      additionalProperties: false
      required: [client_id]
      description: |
        Exactly one of `secret` or `assertion`. Both are POST once and
        never returned.
      properties:
        client_id:
          type: string
          minLength: 2
          maxLength: 64
          description: Public identifier. Not a secret.
        secret:
          type: string
          minLength: 16
          maxLength: 72
          format: password
        assertion:
          type: string
          description: Compact Ed25519 assertion. aud=flowforge:machine. Max TTL 5 minutes.
    MachinePrincipalCreate:
      type: object
      additionalProperties: false
      required: [display_name]
      description: |
        `secret` or `assertion_public_key` is required and is not echoed.
        Grants default to empty (authorize nothing).
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        client_id:
          type: string
          minLength: 2
          maxLength: 64
        secret:
          type: string
          minLength: 16
          maxLength: 72
          format: password
        assertion_public_key:
          type: string
          description: Base64 raw 32-byte Ed25519 public key. Not a private key.
        grants:
          type: array
          items:
            type: string
        tenant_id:
          type: string
          format: uuid
        tenant_slug:
          type: string
        workbench_key:
          type: string
    MachinePrincipalRotate:
      type: object
      additionalProperties: false
      description: Credential only. Grants are not changed. Secret is not echoed.
      properties:
        secret:
          type: string
          minLength: 16
          maxLength: 72
          format: password
        assertion_public_key:
          type: string
    MachinePrincipal:
      type: object
      required: [id, client_id, display_name, status, grants, created_at]
      description: Operator view. No secret, hash, assertion, or public key.
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [active, revoked]
        grants:
          type: array
          items:
            type: string
        tenant_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        workbench_key:
          type: string
        created_at:
          type: string
          format: date-time
        rotated_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    MachinePrincipalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MachinePrincipal"
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Applied page size. Default 50. Always present.
        cursor:
          type: string
          description: Opaque keyset token that produced this page. Empty on the first page. Always present.
        next:
          type: string
          description: Opaque token for the following page. Empty when this page is the last. Always present.
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      description: |
        Standalone local sign-in. Send `identifier` or `email` or
        `username` (they must agree if more than one is set) plus
        `password`. Password POST once; never echoed.
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 256
          description: Email or username. Case-insensitive. Matches bootstrap `external_subject`.
        email:
          type: string
          minLength: 1
          maxLength: 256
          description: Alias for identifier.
        username:
          type: string
          minLength: 1
          maxLength: 256
          description: Alias for identifier.
        password:
          type: string
          minLength: 1
          maxLength: 72
          format: password
          description: POST once. Never returned.
    OIDCStartRequest:
      type: object
      additionalProperties: false
      description: Empty object. Extra fields are rejected.
    OIDCStartResponse:
      type: object
      additionalProperties: false
      required: [authorization_url, state, expires_at]
      properties:
        authorization_url:
          type: string
          format: uri
          description: IdP authorize URL. No client_secret and no code_verifier.
        state:
          type: string
          description: Matches the ff_oidc_state cookie. Not a secret the chrome may persist beyond the redirect.
        expires_at:
          type: string
          format: date-time
    OIDCCallbackRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 2048
          description: Authorization code. POST once. Never echoed.
        state:
          type: string
          minLength: 1
          maxLength: 256
          description: Must match the ff_oidc_state cookie.
    MFAStatus:
      type: object
      additionalProperties: false
      required: [method, enrolled, satisfied, applicable, privileged_permissions, enforcement]
      properties:
        method:
          type: string
          enum: [totp]
        enrolled:
          type: boolean
        satisfied:
          type: boolean
          description: True when this session has stepped up, or when MFA does not apply to the door.
        applicable:
          type: boolean
          description: True only for local-login and OIDC sessions.
        privileged_permissions:
          type: array
          items:
            type: string
          description: platform.administer and credential.*
        enforcement:
          type: string
          enum: ["on", "off"]
          description: |
            Process step-up mode. `on` is unset or `MFA_ENFORCEMENT=on`.
            `off` is set only when `MFA_ENFORCEMENT=off` and the process is
            not production-locked. Other fields stay the enrollment and
            session state they already were.
        otpauth_uri:
          type: string
          description: Present only on the enroll response, once. Contains the TOTP secret. Do not store.
    MFAVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 8
          description: TOTP code. POST once. Never echoed.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      description: |
        New local-login password. POST once; never echoed. Must not
        match the current secret or the retired default `admin`.
        `current_password` is required when `must_change_password` is
        false. An administrator-initiated reset may omit it. A missing
        or blank current password on a voluntary change is `400`
        `invalid-request`. A wrong current password is `401`
        `unauthenticated`. Neither response echoes the password.
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: New password. POST once. Never returned.
        new_password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: Alias for password.
        current_password:
          type: string
          maxLength: 72
          format: password
          description: |
            Current password. Required when `must_change_password` is
            false. Optional on an administrator-initiated reset; a
            supplied value must still match the stored hash. POST once.
            Never returned.
    CreateSessionRequest:
      type: object
      properties:
        issuer:
          type: string
        external_subject:
          type: string
        display_name:
          type: string
    Session:
      type: object
      required: [id, created_at, last_seen_at, idle_expires_at, absolute_expires_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
        must_change_password:
          type: boolean
          description: |
            True after first-run one-time local login until
            `POST /session/password` succeeds. Chloe gates Overview /
            product chrome to the change-password screen. Omitted when
            false. Never a password or hash. While true, an authenticated
            call for that user other than `GET /session`, `POST /session/password`,
            and `POST /session/logout` is `403` `password_change_required`.
            Unauthenticated calls stay `401`. Embed-bound sessions and
            principals with no local login are not gated. The incomplete
            first-run wizard's session check is not this gate.
        embed:
          $ref: "#/components/schemas/SessionEmbedBinding"
    SessionEmbedBinding:
      type: object
      description: |
        Present only on embed-exchanged sessions. Authoritative chrome
        payload for the embed shell (ADV-021). Absence means standalone.
        No secrets and no raw assertion.
      required: [mode, sdk, tenantId, workbenchKey, workspaceId, capabilities]
      properties:
        mode:
          type: string
          enum: [embed]
          description: Explicit embed-mode flag. Always `embed` when this object is present.
        sdk:
          type: string
          enum: [embed.v1]
        tenantId: {type: string, format: uuid}
        tenantSlug: {type: string, description: Chrome-safe tenant display slug.}
        tenantName: {type: string, description: Chrome-safe tenant display name.}
        workbenchKey: {type: string}
        workspaceId: {type: string, format: uuid}
        workspaceName: {type: string, description: Chrome-safe workspace display name.}
        capabilities:
          type: array
          items: {type: string}
          description: Session-capped minted capabilities. Not the catalog set.
    SessionResponse:
      type: object
      required: [session, principal, csrf_token]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        principal:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
          description: Same value as the `ff_csrf` cookie. Never log or persist in localStorage.
    SessionAuditEvent:
      type: object
      required: [id, event_type, outcome, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - session.created
            - session.refreshed
            - session.revoked
            - session.expired
            - session.csrf_rejected
            - session.origin_rejected
            - session.privilege_denied
            - session.auth_rejected
            - bootstrap.admin_password_set
            - session.mfa_bypassed
        outcome:
          type: string
          enum: [allowed, denied]
        reason:
          type: string
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
        mfa_bypassed:
          type: boolean
          description: |
            True when this row's `event_type` is `session.mfa_bypassed`.
            Those rows are written when `MFA_ENFORCEMENT=off` skipped
            step-up for a privileged grant. `outcome` is `allowed`.
            `reason` is human text such as `mfa step-up skipped`.
            The flag is set from the event type. Omitted on every other event.
    SessionAuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionAuditEvent"
    EmbedCatalog:
      type: object
      description: |
        Versioned embed SDK/contract for Chloe and host backends.
        `rules.membershipIsolationGranted` is true only when the peeked
        session has `workspace.administer` or `platform.administer`.
        Public catalogs omit membership/isolation routes and those
        capabilities. `frameAncestors` is always present (ADV-011).
        `issuers` is the configured embed host issuer list and is
        always published.
    PortalAdapterCatalog:
      type: object
      description: Versioned CP Ops Portal adapter contract and host wiring map.
    MintPortalAssertionRequest:
      type: object
      description: Portal-backend mint. Provide portalRoles and/or capabilities.
      properties:
        subject:
          type: string
          description: End-user subject. Defaults to the minting caller. A different value requires embed.impersonate (PLATFORM_ADMINS); otherwise 403.
        displayName:
          type: string
        issuer:
          type: string
          description: Assertion iss. Must match the authenticated caller and be on a non-empty PORTAL_ISSUER / PORTAL_ISSUER_ALLOWLIST (empty fails closed). A mismatched issuer is 403.
        tenantId:
          type: string
          format: uuid
        workbenchKey:
          type: string
        workspaceId:
          type: string
          format: uuid
          description: Optional binding. Must match server resolution. Never the lookup key.
        portalRoles:
          type: array
          items: {type: string}
          description: Portal roles (`portal.viewer` or `viewer`, …) mapped to FlowForge capabilities.
        capabilities:
          type: array
          items: {type: string}
          description: Extra FlowForge permission keys. Must be known catalog keys.
        ttlSeconds:
          type: integer
          minimum: 15
          maximum: 300

    EmbedJWKS:
      type: object
      required: [keys, signingReady]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, kid, use, alg]
            properties:
              kty: {type: string, enum: [OKP]}
              crv: {type: string, enum: [Ed25519]}
              x: {type: string, description: Public key (base64url). Never `d`.}
              kid: {type: string}
              use: {type: string, enum: [sig]}
              alg: {type: string, enum: [EdDSA]}
              status: {type: string, enum: [active, overlap]}
              overlapUntil:
                type: string
                format: date-time
                description: |
                  Required on overlap verification keys (max 4h from now).
                  Omitted on the active signing key — that key is not an
                  overlap key and does not expire via overlapUntil.
        signingReady:
          type: boolean
    MintEmbedAssertionRequest:
      type: object
      required: [capabilities]
      properties:
        subject:
          type: string
          description: End-user subject. Defaults to the minting caller. A different value requires embed.impersonate (PLATFORM_ADMINS); otherwise 403.
        displayName:
          type: string
        issuer:
          type: string
          description: Assertion iss. Must match the authenticated caller (defaults to the caller). A mismatched issuer is 403.
        tenantId:
          type: string
          format: uuid
          description: Optional confirmation of the header-resolved tenant.
        workbenchKey:
          type: string
          description: Optional confirmation of the header-resolved workbench.
        workspaceId:
          type: string
          format: uuid
          description: Optional binding. Must match server resolution. Never the lookup key.
        capabilities:
          type: array
          items: {type: string}
          minItems: 1
        ttlSeconds:
          type: integer
          minimum: 15
          maximum: 300
    MintedEmbedAssertion:
      type: object
      required: [sdk, assertion, tokenId, audience, issuer, subject, tenantId, workbenchKey, capabilities, expiresAt, keyId, algorithm]
      properties:
        sdk: {type: string, example: embed.v1}
        assertion:
          type: string
          description: Compact JWS. Returned once. Never log or put in a URL.
        tokenId: {type: string, format: uuid}
        audience: {type: string, example: flowforge}
        issuer: {type: string}
        subject: {type: string}
        tenantId: {type: string, format: uuid}
        workbenchKey: {type: string}
        workspaceId: {type: string, format: uuid}
        capabilities:
          type: array
          items: {type: string}
        notBefore: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        keyId: {type: string}
        algorithm: {type: string, example: EdDSA}
        displayName: {type: string}
    RotateEmbedKeyRequest:
      type: object
      properties:
        action:
          type: string
          enum: [register-overlap, retire]
          default: register-overlap
        kid:
          type: string
          description: Required for retire when publicJwk.kid is omitted.
        publicJwk:
          type: object
          description: Public OKP/Ed25519 JWK only. Never include `d`.
          properties:
            kty: {type: string, enum: [OKP]}
            crv: {type: string, enum: [Ed25519]}
            x: {type: string}
            kid: {type: string}
            use: {type: string, enum: [sig]}
            alg: {type: string, enum: [EdDSA]}
        overlapUntil:
          type: string
          format: date-time
          description: |
            Required on register-overlap. RFC3339 expiry for the overlap
            verification window (must be in the future and no longer than
            4h). Missing, zero, past, or farther-future is 400. After this
            instant, exchange and JWKS drop the kid even if it is still in
            an in-memory ring (verify refreshes from the store). The active
            signing key is not an overlap key and does not use this field.
    ExchangeEmbedAssertionRequest:
      type: object
      required: [assertion]
      properties:
        assertion:
          type: string
          description: Compact JWS from POST /embed/assertions. Body only — never a URL.
        sdk:
          type: string
          example: embed.v1
        hostIssuer:
          type: string
          description: |
            Optional configured host issuer (same as X-FlowForge-Host-Issuer).
            Must equal assertion iss when sent. Must agree with the header
            when both are present.
        hostContext:
          type: string
          enum: [embed, portal]
          description: |
            Optional path declaration (same as X-FlowForge-Host-Context).
            Must agree with signed ctx when both are present.
    EmbedExchangeResponse:
      type: object
      required: [session, principal, csrf_token, assertion, workspace, tenant, capabilities]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        principal:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
        assertion:
          $ref: "#/components/schemas/EmbedAssertionPublic"
        workspace:
          $ref: "#/components/schemas/Workspace"
        tenant:
          $ref: "#/components/schemas/Tenant"
        capabilities:
          type: array
          items: {type: string}
    EmbedAssertionPublic:
      type: object
      description: Secret-free assertion metadata. Never includes the compact JWS or private keys.
      required: [sdk, tokenId, issuer, audience, subject, tenantId, workbenchKey, capabilities]
      properties:
        sdk: {type: string}
        tokenId: {type: string, format: uuid}
        issuer: {type: string}
        audience: {type: string}
        subject: {type: string}
        tenantId: {type: string, format: uuid}
        workbenchKey: {type: string}
        workspaceId: {type: string, format: uuid}
        capabilities:
          type: array
          items: {type: string}
        notBefore: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        keyId: {type: string}
        algorithm: {type: string}
        displayName: {type: string}
    WorkflowFieldError:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
          example: spec.nodes[0].with.namespace
        line:
          type: integer
        column:
          type: integer
        code:
          type: string
          example: invalid-uuid
        message:
          type: string
    WorkflowPort:
