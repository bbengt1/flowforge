          type: boolean
        capabilities:
          $ref: "#/components/schemas/ExecutionCapabilities"
          description: Present on execution detail. Omitted from list rows.
        statusReason:
          type: string
          enum: [no-worker, workflow_deleted, requirement_unresolvable]
          description: >
            Additive operator hint. no-worker when status is still queued and
            no job has been claimed after 15s. workflow_deleted when a waiting
