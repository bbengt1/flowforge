    WorkflowExecution:
      type: object
      required: [id, workflowId, workflowVersionId, workflowDigest, status, createdAt, input, policySnapshot, replayed]
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        workflowSlug:
          type: string
        workflowName:
          type: string
        workflowVersionId:
          type: string
          format: uuid
        workflowDigest:
          type: string
        triggerId:
          type: string
        status:
          type: string
          enum: [queued, pinned, running, waiting, succeeded, failed, canceled, indeterminate]
        idempotencyKey:
          type: string
        input:
          type: object
          additionalProperties: true
        policySnapshot:
          type: object
          additionalProperties: true
        correlationId:
          type: string
        requestedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        retentionUntil:
          type: string
          format: date-time
        replayed:
          type: boolean
        capabilities:
          $ref: "#/components/schemas/ExecutionCapabilities"
          description: Present on execution detail. Omitted from list rows.
        statusReason:
          type: string
          enum: [no-worker, workflow_deleted, requirement_unresolvable]
          description: >
            Additive operator hint. no-worker when status is still queued and
            no job has been claimed after 15s. workflow_deleted when a waiting
            run was stopped because the workflow was deleted.
            requirement_unresolvable when a pending approval could not be
            rebuilt: the gate failed with that code and the run is failed.
            That is not an expired wait. Does not change status or fencing.
            Chloe can show “no worker is claiming jobs”.
        statusReasonDetails:
          $ref: "#/components/schemas/StatusReasonDetails"
          description: >
            Set with statusReason requirement_unresolvable when the failing
            step's error carries details (cause no_eligible_decider).
        pins:
          type: array
          items: {$ref: "#/components/schemas/OpsPin"}
        steps:
          type: array
          items: {$ref: "#/components/schemas/ExecutionStep"}
        artifacts:
          type: array
          items: {$ref: "#/components/schemas/ExecutionArtifact"}
          description: Artifact metadata only (E5.3). Never includes storage locators or credentials.
        jobs:
          type: array
          items: {$ref: "#/components/schemas/ExecutionJob"}
        auditEvents:
          type: array
          items: {$ref: "#/components/schemas/AuditEvent"}
