          enum: [execution_not_retryable, step_attempt_superseded]
        reason:
          type: string
          description: Set when code is execution_not_retryable.
          enum: [run_canceled, run_not_failed, step_not_started, step_not_failed, incoming_unresolved, retry_not_allowed, workflow_deleted]
