    ExecutionStep:
      type: object
      required: [id, executionId, nodeId, nodeType, attempt, status, input, output, error]
      properties:
        id: {type: string, format: uuid}
        executionId: {type: string, format: uuid}
        nodeId: {type: string}
        nodeType: {type: string}
        attempt: {type: integer}
        status:
          type: string
          description: "pending: incoming edges have not all resolved. queued: eligible for a worker. running: a worker holds the step. waiting: parked on an approval or delay. succeeded: the step finished and emitted its ports. failed: the step failed and did not release downstream edges. canceled: the run or step was canceled. indeterminate: the lease was lost after work may have started. skipped: an incoming edge resolved unsatisfied under the default AND join, or every incoming edge resolved unsatisfied under join any. skipped is finished and does not fail the run."
          enum: [pending, queued, running, waiting, succeeded, failed, canceled, indeterminate, skipped]
        leaseId: {type: string}
        fencingToken: {type: integer}
        idempotencyKey: {type: string}
        policySnapshot: {type: object, additionalProperties: true}
        targetSnapshot: {type: object, additionalProperties: true}
        input: {type: object, additionalProperties: true}
        output: {type: object, additionalProperties: true, description: "Redacted, size-bounded step output (E5.3)."}
        error:
          type: object
          additionalProperties: true
          description: >
            Failure detail. A flow.approval gate that failed with code
            requirement_unresolvable may carry details.cause
            no_eligible_decider (see StatusReasonDetails).
        outputTruncated: {type: boolean, description: "True when output or error maps were truncated for the response."}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
