  responses:
    InvalidWorkflow:
      description: Workflow YAML failed parse, normalization, or graph validation
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:invalid-workflow
            title: Invalid Workflow
            status: 400
            detail: The workflow definition is not valid.
            instance: /api/v1/workflows/validate
            code: invalid-workflow
            request_id: 0123456789abcdef0123456789abcdef
            errors:
              - path: spec.edges[0].from
                line: 24
                column: 11
                code: cycle
                message: Workflow graph contains a cycle.
    InvalidRequest:
      description: Malformed JSON, missing body, or unsupported Content-Type
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:invalid-request
            title: Invalid Request
            status: 400
            detail: Request body is not valid JSON.
            instance: /api/v1/example
            code: invalid-request
            request_id: 0123456789abcdef0123456789abcdef
    Unauthenticated:
      description: Missing or invalid credentials
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:unauthenticated
            title: Unauthenticated
            status: 401
            detail: Authentication is required.
            instance: /api/v1/example
            code: unauthenticated
            request_id: 0123456789abcdef0123456789abcdef
    Forbidden:
      description: Authenticated caller is not authorized
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:forbidden
            title: Forbidden
            status: 403
            detail: You are not authorized to perform this action.
            instance: /api/v1/example
            code: forbidden
            request_id: 0123456789abcdef0123456789abcdef
    Conflict:
      description: Unique identity collision or last-admin protection
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:conflict
            title: Conflict
            status: 409
            detail: A unique identity already exists.
            instance: /api/v1/workspaces
            code: conflict
            request_id: 0123456789abcdef0123456789abcdef
    FolderNotEmpty:
      description: Folder still has child folders or workflows. Never cascade-deletes workflows.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                required: [workflowCount, childFolderCount]
                properties:
                  workflowCount: {type: integer}
                  childFolderCount: {type: integer}
          example:
            type: urn:flowforge:problem:conflict
            title: Conflict
            status: 409
            detail: Move or delete contents first.
            instance: /api/v1/workflow-folders/11111111-1111-4111-8111-111111111111
            code: conflict
            request_id: 0123456789abcdef0123456789abcdef
            workflowCount: 2
            childFolderCount: 1
    NotFound:
      description: The requested path does not exist
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:not-found
            title: Not Found
            status: 404
            detail: The requested path does not exist.
            instance: /api/v1/missing
            code: not-found
            request_id: 0123456789abcdef0123456789abcdef
    MethodNotAllowed:
      description: HTTP method is not allowed for this path
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Allow:
          schema:
            type: string
            example: GET, HEAD
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:method-not-allowed
            title: Method Not Allowed
            status: 405
            detail: The POST method is not allowed for this path.
            instance: /api/v1/health
            code: method-not-allowed
            request_id: 0123456789abcdef0123456789abcdef
    RequestTooLarge:
      description: Request body exceeds 1048576 bytes
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:request-too-large
            title: Request Too Large
            status: 413
            detail: The request body exceeds the 1048576 byte limit.
            instance: /api/v1/health
            code: request-too-large
            request_id: 0123456789abcdef0123456789abcdef
    RateLimited:
      description: |
        Rate or concurrency limit exceeded. `Retry-After` is seconds.
        Workspace quotas cover mutating routes, expensive lists, artifact
        downloads, and execution starts. Login, embed mint/exchange, and
        machine token keep separate budgets. Webhook ingress keeps its own limit.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:rate-limited
            title: Rate Limited
            status: 429
            detail: Webhook rate or concurrency limit was exceeded.
            instance: /api/v1/hooks/wh_example
            code: rate-limited
            request_id: 0123456789abcdef0123456789abcdef
    InternalError:
      description: Unexpected server failure
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:internal-error
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred.
            instance: /api/v1/health
            code: internal-error
            request_id: 0123456789abcdef0123456789abcdef
    ApprovalRequirementUnavailable:
      description: |
        The pinned approval requirement could not be rebuilt because of a database, network, or timeout failure.
        Retry-After is 5 seconds. Nothing is recorded and the approval is unchanged.
        The problem document has no errors array.
      headers:
        Retry-After:
          description: Seconds to wait before retrying. Always 5 for this response.
          schema:
            type: integer
            example: 5
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:approval_requirement_unavailable
            title: Service Unavailable
            status: 503
            detail: The approval requirement could not be rebuilt. Retry.
            instance: /api/v1/approvals/00000000-0000-4000-8000-000000000001/decide
            code: approval_requirement_unavailable
            request_id: 0123456789abcdef0123456789abcdef
    DependencyUnavailable:
      description: Required dependency is not configured or reachable
