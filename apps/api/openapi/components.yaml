# Schemas, responses, parameters, and pathItems. Not a route list.
components:
  pathItems:
    OpsCollection:
      get:
        summary: List operational configuration resources
        description: Requires `opsconfig.view`. Returns heads only (no draft spec). Keyset page. `q` matches name and slug, not spec.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/PageLimit"
          - $ref: "#/components/parameters/PageCursor"
          - $ref: "#/components/parameters/PageSearch"
          - $ref: "#/components/parameters/HostWorkspaceID"
        responses:
          "200":
            description: Resource summaries
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsResourceList"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
      post:
        summary: Create a draft resource
        description: Requires `opsconfig.edit`. Host-supplied `id` / `workspaceId` is `400`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsCreateRequest"
        responses:
          "201":
            description: Created draft
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsDetail"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "409":
            $ref: "#/components/responses/Conflict"
    OpsItem:
      get:
        summary: Get resource head
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Resource
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsResource"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsDraft:
      get:
        summary: Get mutable draft
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Draft
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsDraft"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
      put:
        summary: Conflict-safe draft save
        description: Requires `opsconfig.edit` and current `revision`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsSaveDraftRequest"
        responses:
          "200":
            description: Saved draft
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsDetail"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
    OpsPublish:
      post:
        summary: Publish an immutable revision
        description: Requires `opsconfig.publish`. Duplicate digest is `409`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        requestBody:
          required: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsPublishRequest"
        responses:
          "201":
            description: Published version
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsPublishResponse"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
    OpsVersions:
      get:
        summary: Version history
        description: Keyset page. `q` matches the publish note, not the spec.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/PageLimit"
          - $ref: "#/components/parameters/PageCursor"
          - $ref: "#/components/parameters/PageSearch"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Versions newest first
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsVersionList"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsVersion:
      get:
        summary: Frozen published snapshot
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
          - $ref: "#/components/parameters/OpsVersionID"
        responses:
          "200":
            description: Version
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsVersion"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsDisable:
      post:
        summary: Disable a resource
        description: Select and pin fail closed until re-enabled. Requires `opsconfig.edit`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Disabled resource
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsResource"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsEnable:
      post:
        summary: Re-enable a resource
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        responses:
          "200":
            description: Enabled resource
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsResource"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    OpsSelect:
      post:
        summary: Server-authorized selection
        description: Pins an exact published revision. Drafts are `400`. Cross-workspace IDs are `404`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/Issuer"
          - $ref: "#/components/parameters/Subject"
          - $ref: "#/components/parameters/CSRFToken"
          - $ref: "#/components/parameters/TenantID"
          - $ref: "#/components/parameters/TenantSlug"
          - $ref: "#/components/parameters/WorkbenchKey"
          - $ref: "#/components/parameters/HostWorkspaceID"
          - $ref: "#/components/parameters/OpsResourceID"
        requestBody:
          required: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsSelectRequest"
        responses:
          "200":
            description: Pin
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpsPin"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
    BootstrapAdminPassword:
      post:
        operationId: postBootstrapAdminPassword
        summary: Set the seeded admin password with a one-time setup token
        description: |
          Standalone only. Sets the password for the seeded `admin`
          identity and consumes the one-time setup token in the same
          transaction. Works while the wizard is incomplete and after
          localseed has already marked bootstrap complete. Does not mint
          `ff_session`. CSRF matches the other bootstrap POSTs: required
          when `ff_session` is present, not required when it is absent.
          Embed-bound sessions are forbidden. `setup_token` and
          `password` belong in this body, never the query string.
          Success does not return the password or the token.
          A per-IP limit returns 429 with `Retry-After`.
        parameters:
          - $ref: "#/components/parameters/RequestID"
          - $ref: "#/components/parameters/CSRFToken"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapAdminPasswordRequest"
        responses:
          "201":
            description: Password set and setup token consumed. Login is ready.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/BootstrapAdminPasswordResult"
          "400":
            $ref: "#/components/responses/InvalidRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "409":
            $ref: "#/components/responses/Conflict"
          "429":
            $ref: "#/components/responses/RateLimited"
          "503":
            $ref: "#/components/responses/DependencyUnavailable"
  parameters:
    PageLimit:
      name: limit
      in: query
      required: false
      description: |
        Page size. Default 50 when omitted. Values outside 1–100 are 400.
        The applied size is always returned as `limit`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque keyset token from a previous response `next`. Empty selects the first page.
        A malformed token, or a token minted for a different collection, is 400.
        The error body does not echo the token.
      schema:
        type: string
        maxLength: 1024
    PageSearch:
      name: q
      in: query
      required: false
      description: |
        Case-insensitive substring search over the collection's safe fields
        (names, slugs, statuses, and similar identifiers). Secret material,
        ciphertext, YAML bodies, specs, and free-form details are not searched.
        Longer than 200 runes, or containing ASCII controls, is 400.
        The error body does not echo `q`.
      schema:
        type: string
        maxLength: 200
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation identifier. Accepted only when 16–128 ASCII letters, digits, or hyphens.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9-]{16,128}$
    Issuer:
      name: X-FlowForge-Issuer
      in: header
      required: false
      description: |
        Host identity issuer for non-browser callers. Browser clients should
        use `ff_session` instead. Ignored when a session cookie is present
        unless it conflicts (conflict fails closed). Does not authorize a workspace.
      schema:
        type: string
    Subject:
      name: X-FlowForge-Subject
      in: header
      required: false
      description: Host identity subject. Unique with issuer. Does not authorize a workspace.
      schema:
        type: string
    DisplayName:
      name: X-FlowForge-Display-Name
      in: header
      required: false
      description: Optional display name applied on user upsert.
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        Required on state-changing requests authenticated by `ff_session`.
        Must match the `ff_csrf` cookie and the server-side session secret.
        A missing or mismatched token is `403` with problem code `csrf-invalid`.
      schema:
        type: string
    TenantID:
      name: X-FlowForge-Tenant-ID
      in: header
      required: false
      description: Tenant UUID used with workbench_key to resolve workspace identity.
      schema:
        type: string
        format: uuid
    TenantSlug:
      name: X-FlowForge-Tenant-Slug
      in: header
      required: false
      description: Tenant slug used with workbench_key when tenant id is omitted.
      schema:
        type: string
    WorkbenchKey:
      name: X-FlowForge-Workbench-Key
      in: header
      required: false
      description: Host workbench key. Combined with tenant identity, this is the only accepted workspace lookup.
      schema:
        type: string
    HostWorkspaceID:
      name: X-FlowForge-Workspace-ID
      in: header
      required: false
      description: Untrusted host-supplied workspace UUID. Rejected unless it matches the server-derived `(tenant, workbench_key)` workspace.
      schema:
        type: string
        format: uuid
    WorkflowID:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FolderID:
      name: folderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceGroupID:
      name: groupId
      in: path
      required: true
      description: Workspace group id. Unknown ids, ids from another workspace, and values that are not a UUID are 404.
      schema:
        type: string
        format: uuid
    ScimTokenID:
      name: tokenId
      in: path
      required: true
      description: SCIM workspace token id. Unknown ids, ids from another workspace, and values that are not a UUID are 404.
      schema:
        type: string
        format: uuid
    WorkspaceGroupUserID:
      name: userId
      in: path
      required: true
      description: User id. A value that is not a UUID is 400 invalid-request with errors[].path userId. A valid id that is not a member is a 204 no-op.
      schema:
        type: string
        format: uuid
    WorkflowFolderQuery:
      name: folderId
      in: query
      required: false
      description: Filter list to one folder UUID, or `unfiled` for `folderId == null`. Omit for the full workspace list.
      schema:
        type: string
    VersionID:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialID:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobID:
      name: jobId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApprovalID:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AlertID:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OpsResourceID:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OpsVersionID:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    XRequestID:
      description: Correlation identifier. Caller values are accepted only when 16–128 ASCII letters, digits, or hyphens.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9-]{16,128}$
  schemas:
    OpsCatalog:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          items:
            type: object
            required: [kind, collection, yamlFields, usePermission]
            properties:
              kind: {type: string}
              collection: {type: string}
              displayName: {type: string}
              yamlFields:
                type: array
                items: {type: string}
              usePermission: {type: string}
              allowedCredentialTypes:
                type: array
                items: {type: string}
              engine: {type: string}
        kubernetesEngine:
          $ref: "#/components/schemas/KubernetesEngineCatalog"
        sshEngine:
          $ref: "#/components/schemas/SSHEngineCatalog"
        scriptEngine:
          $ref: "#/components/schemas/ScriptEngineCatalog"
        httpNotificationEngine:
          $ref: "#/components/schemas/HTTPNotificationEngineCatalog"
    HTTPNotificationEngineCatalog:
      type: object
      additionalProperties: true
      required: [credentialType, publishRules, isolation, nodes, integrationGate]
      properties:
        credentialType: {type: string, enum: [token]}
        publishRules: {type: object, additionalProperties: true}
        isolation: {type: object, additionalProperties: true}
        retry: {type: object, additionalProperties: true}
        evaluationKeys:
          type: array
          items: {type: object, additionalProperties: true}
        nodes:
          type: array
          items: {type: object, additionalProperties: true}
        errors:
          type: array
          items: {type: object, additionalProperties: true}
        permissions:
          type: array
          items: {type: string}
        integrationGate:
          type: object
          additionalProperties: true
    KubernetesEngineCatalog:
      type: object
      required: [credentialType, allowedKinds, allowedVerbs, evaluationKeys, serviceAccount, publishRules]
      properties:
        credentialType: {type: string, enum: [kubernetes]}
        credentialSecretField: {type: string, enum: [kubeconfig]}
        allowedKinds:
          type: array
          items: {type: string}
        allowedVerbs:
          type: array
          items: {type: string}
        evaluationKeys:
          type: array
          items:
            type: object
            required: [canonical, aliases]
            properties:
              canonical: {type: string}
              aliases:
                type: array
                items: {type: string}
              failClosedWhenPresent: {type: boolean}
              requiredForPublish: {type: boolean}
        serviceAccount:
          type: object
          properties:
            defaultName: {type: string}
            roleTemplate: {type: string}
            roleTemplatePath: {type: string}
            roleBindingTemplatePath: {type: string}
            serviceAccountPath: {type: string}
            clusterRoles: {type: boolean}
            notes: {type: string}
        publishRules:
          type: object
          properties:
            clusterTargetRequired:
              type: array
              items: {type: string}
            kubernetesPolicyRequired:
              type: array
              items: {type: string}
            emptyAllowlistsRejected: {type: boolean}
            credentialType: {type: string}
            denyAllowsMissingAllowlist: {type: boolean}
        clusterRoles: {type: boolean}
        nodes:
          type: array
          items:
            type: object
            properties:
              type: {type: string}
              verb: {type: string}
              permissions:
                type: array
                items: {type: string}
              requiredWith:
                type: array
                items: {type: string}
              allowedWith:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    kind: {type: string}
                    required: {type: boolean}
                    enum:
                      type: array
                      items: {type: string}
                    description: {type: string}
              fieldManager: {type: string}
              force: {type: boolean}
              serverDryRunAlways: {type: boolean}
              waitReady: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
              status: {type: integer}
              meaning: {type: string}
        apply:
          type: object
          properties:
            fieldManager: {type: string}
            force: {type: boolean}
            serverDryRunAlways: {type: boolean}
            clientDryRunAddsLocalValidationOnly: {type: boolean}
            waitReady: {type: string}
        observation:
          type: object
          properties:
            waitReady: {type: string}
            states:
              type: array
              items: {type: string}
            kinds:
              type: array
              items: {type: string}
            verb: {type: string}
            cancel: {type: string}
            timeout: {type: string}
            neverDeletesOrRollsBack: {type: boolean}
    SSHEngineCatalog:
      type: object
      required: [credentialType, parameterTypes, render, retry, publishRules, isolation]
      properties:
        credentialType: {type: string, enum: [ssh_private_key]}
        credentialSecretFields:
          type: array
          items: {type: string}
        parameterTypes:
          type: array
          items:
            type: object
            properties:
              type: {type: string}
              constraints:
                type: array
                items: {type: string}
              description: {type: string}
        render:
          type: object
          properties:
            owner: {type: string}
            placeholderSyntax: {type: string}
            quoting: {type: string}
            rawShellInterpolation: {type: boolean}
            forbiddenTokens:
              type: array
              items: {type: string}
            rejectValuesOutsideSchema: {type: boolean}
        retry:
          type: object
          properties:
            defaultMaxAttempts: {type: integer}
            maxAttempts: {type: integer}
            retrySafeFlag: {type: string}
            semantics: {type: string}
            note: {type: string}
            blindRetry: {type: boolean}
            leaseLossOutcome: {type: string}
            unknownOutcome: {type: string}
            requiresVerificationWhenRetrySafe: {type: boolean}
            verification: {type: string}
            whenRetryAllowed: {type: string}
            states:
              type: array
              items: {type: string}
            ui:
              type: object
              properties:
                indeterminateBadge: {type: string}
                retrySafeFlag: {type: string}
                retryEnabledWhen: {type: string}
                hideRetryWhen: {type: string}
                neverAssumeAbsent: {type: boolean}
            probe:
              type: object
              properties:
                requiredWhenRetrySafe: {type: boolean}
                field: {type: string}
                template: {type: string}
                expectExitCodeDefault: {type: integer}
                onMatchDefault: {type: string}
                onMismatchDefault: {type: string}
                onError: {type: string}
                outcomes:
                  type: array
                  items: {type: string}
                note: {type: string}
        publishRules:
          type: object
          properties:
            sshTargetRequired:
              type: array
