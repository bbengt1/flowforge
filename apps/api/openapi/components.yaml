        id: {type: string, format: uuid}
        executionId: {type: string, format: uuid}
        executionStepId: {type: string, format: uuid}
        status:
          type: string
          description: "blocked: the step is not eligible to run. queued: a worker may claim it. claimed: a worker holds the lease and has not heartbeated. running: the worker has heartbeated. waiting: parked with no lease until an approval decision or a delay timer. succeeded: the job finished. failed: the job failed. canceled: the run was canceled. indeterminate: the lease was lost. skipped: the step was skipped, so this job will not run."
          enum: [blocked, queued, claimed, running, waiting, succeeded, failed, canceled, indeterminate, skipped]
