    WorkspaceGroup:
      type: object
      description: >
        A named set of workspace members used only to target approvals.
        A group never grants a permission. Membership never grants
        approval.decide. Groups are not nested and carry no roles or
        email. managedBy says whether a workspace SCIM token manages the
        group.
      required: [id, displayName, memberCount, managedBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Trimmed, 1-128 characters. Unique in the workspace without
            regard to case.
        memberCount:
          type: integer
          minimum: 0
          description: >
            Number of membership rows. Counts the same rows the detail
            members array lists, including a disabled user that still
            has rows.
        managedBy:
          type: string
          nullable: true
          enum: [scim, null]
          description: >
            "scim" for a group a workspace SCIM token created while the
            instance ran SCIM_GROUPS_MODE=groups; null for a local group.
            Always present. The marker is kept when the instance switches
            back to SCIM_GROUPS_MODE=workspaces. While the instance is in
            groups mode (ScimTokenList.groupsMode), a local rename, member
            add or remove, or delete of a "scim" group is 409
            group_managed_by_scim; in workspaces mode it is allowed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceGroupMember:
      type: object
      description: >
        One group member. No email is returned. A user removed from the
        workspace is not listed: removal deletes their group rows in the
        same transaction that deletes their role bindings. A user whose
        account is disabled (for example by SCIM) but who still has rows
        stays listed with canApprove false so an administrator can see and
        remove the row.
      required: [userId, displayName, canApprove]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        canApprove:
          type: boolean
          description: >
            Server-computed. True only when the user is active, has a live
            role binding in this workspace, and those roles grant
            approval.decide. Never true for an inactive user or a user with
            no live binding. Group membership itself never grants
            approval.decide; this flag only reports what the user's roles
            already allow.
    WorkspaceGroupDetail:
      allOf:
        - $ref: "#/components/schemas/WorkspaceGroup"
        - type: object
          required: [members, groupsMode]
          properties:
            members:
              type: array
              description: Every member row, ordered by display name without regard to case, then user id.
              items:
                $ref: "#/components/schemas/WorkspaceGroupMember"
            groupsMode:
              type: string
              enum: [workspaces, groups]
              description: >
                The instance's SCIM_GROUPS_MODE, the same value the group
                list reports. Always present; workspaces when SCIM is not
                configured. In groups mode a group with managedBy "scim"
                cannot be renamed, deleted, or have members changed here
                (409 group_managed_by_scim).
    WorkspaceGroupList:
      type: object
      required: [items, limit, cursor, next, groupsMode]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceGroup"
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Applied page size. Default 50. Always present.
        cursor:
          type: string
          description: Opaque keyset token that produced this page. Empty on the first page. Always present.
        next:
          type: string
          description: Opaque token for the following page. Empty when this page is the last. Always present.
        groupsMode:
          type: string
          enum: [workspaces, groups]
          description: >
            The instance's SCIM_GROUPS_MODE. Always present; workspaces
            when SCIM is not configured. workspaces: SCIM Groups are
            workspaces, and every group here can be changed locally.
            groups: SCIM Groups are this workspace's groups, managed only
            by its workspace SCIM tokens, and a group with managedBy
            "scim" cannot be renamed, deleted, or have members changed
            here (409 group_managed_by_scim).
    CreateWorkspaceGroupRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          description: Trimmed before validation. Empty or longer than 128 characters is 400 invalid-request with errors[].path displayName.
    UpdateWorkspaceGroupRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          description: New display name. Same rules as create.
    AddWorkspaceGroupMemberRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          description: Must be an active user with a role binding in this workspace.
    ScimTokenCreator:
      type: object
      required: [id, displayName]
      description: Display name and UUID only. No email.
      properties:
        id: {type: string, format: uuid}
        displayName: {type: string}
    ScimToken:
      type: object
      description: >
        One active SCIM workspace token. Never includes the token or its
        hash. Revoked tokens are not returned.
      required: [id, displayName, prefix, createdBy, createdAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        prefix:
          type: string
          enum: [ffscim_]
          description: >
            The fixed, non-secret token prefix. Every workspace token starts
            with it. Tell tokens apart by displayName and createdAt.
        createdBy:
          description: The administrator who created the token. null when that user no longer exists.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScimTokenCreator"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Last successful SCIM request with this token. null until first
            use. Updated at most once a minute per token, so it can lag by
            up to 60 seconds.
    ScimTokenList:
      type: object
      required: [items, maxActive, configured, groupsMode]
      properties:
        items:
          type: array
          description: Active tokens, newest first. At most maxActive items.
          maxItems: 2
          items:
            $ref: "#/components/schemas/ScimToken"
        maxActive:
          type: integer
          enum: [2]
          description: Active tokens a workspace may hold. Create is 409 scim_token_limit at this count.
        configured:
          type: boolean
          description: >
            false when SCIM is off on the instance (no SCIM_* variable
            set). Create is then 503 scim_not_configured. Existing tokens
            still list but cannot authenticate until SCIM is on again.
        groupsMode:
          type: string
          enum: [workspaces, groups]
          description: >
            The instance's SCIM_GROUPS_MODE. workspaces (the default): a
            SCIM Group is a workspace and Group member changes add or
            remove workspace membership. groups: SCIM Groups are this
            workspace's groups, managed only by its workspace tokens, and
            groups with managedBy "scim" cannot be changed locally (409
            group_managed_by_scim). Reported even when configured is false.
    ScimTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ScimToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              pattern: "^ffscim_[A-Za-z0-9_-]{43}$"
              description: >
                The plaintext bearer. Returned only here, once. The server
                keeps only its SHA-256 and cannot show it again; a lost
                token is revoked and replaced. Use it as
                Authorization: Bearer for /scim/v2.
    CreateScimTokenRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          description: Trimmed before validation. Empty, longer than 128 characters, or containing a control character is 400 invalid-request with errors[].path displayName. Other fields are ignored.
    MembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [workspace, tenant, roles, permissions]
            properties:
              workspace:
                $ref: "#/components/schemas/Workspace"
              tenant:
                $ref: "#/components/schemas/Tenant"
              roles:
                type: array
                items:
                  type: string
              permissions:
                type: array
                items:
                  type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Applied page size. Default 50. Always present.
        cursor:
          type: string
          description: Opaque keyset token that produced this page. Empty on the first page. Always present.
        next:
          type: string
          description: Opaque token for the following page. Empty when this page is the last. Always present.
    PermissionMatrix:
      type: object
      required: [permissions, roles]
      properties:
        permissions:
          type: array
          items:
            type: object
            required: [key, family]
            properties:
              key:
                type: string
              family:
                type: string
                enum: [view, edit, publish, execute, credential, approval, administration]
        roles:
          type: array
          items:
            type: object
            required: [key, description, permissions]
            properties:
              key:
                type: string
              description:
                type: string
              permissions:
                type: array
                items:
                  type: string
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                type: string
              description:
                type: string
              permissions:
                type: array
                items:
                  type: string
    CredentialType:
      type: string
      enum: [kubernetes, ssh_private_key, token, webhook_secret, provider]
    Credential:
      type: object
      description: Safe credential metadata. Never includes secret, ciphertext, or DEK fields.
      required: [id, type, displayName, status, tags, metadata, fingerprint, lastTestStatus]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/CredentialType"
        displayName:
          type: string
        status:
          type: string
          enum: [active, disabled]
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        fingerprint:
          type: string
        encryptionVersion:
          type: integer
        keyReference:
          type: string
        lastTestStatus:
          type: string
          enum: [untested, passed, failed]
        lastTestedAt:
          type: string
          format: date-time
        lastTestReason:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        lastUsedBy:
          type: string
        useCount:
          type: integer
        rotatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        disabledAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        permittedActions:
          type: array
          items:
            type: string
    CredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Applied page size. Default 50. Always present.
        cursor:
          type: string
          description: Opaque keyset token that produced this page. Empty on the first page. Always present.
        next:
          type: string
          description: Opaque token for the following page. Empty when this page is the last. Always present.
    CreateCredentialRequest:
      type: object
      required: [type, displayName, secret]
      properties:
        type:
          $ref: "#/components/schemas/CredentialType"
        displayName:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
        secret:
          type: object
          additionalProperties:
            type: string
          description: Plaintext accepted only on create/rotate; never returned.
    UpdateCredentialRequest:
      type: object
      properties:
        displayName:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    CredentialCatalog:
      type: object
      required: [types]
      properties:
        types:
          type: array
          items:
            type: object
            required: [type, displayName, secretFields]
            properties:
              type:
                $ref: "#/components/schemas/CredentialType"
              displayName:
                type: string
              secretFields:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialField"
              metadataFields:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialField"
    CredentialField:
      type: object
      required: [name, input]
      properties:
        name:
          type: string
        input:
          type: string
        required:
          type: boolean
    CredentialTestResponse:
      type: object
      required: [result, credential]
      properties:
        result:
          type: object
          required: [status, reason, checkedAt]
          properties:
            status:
              type: string
              enum: [passed, failed]
            reason:
              type: string
            checkedAt:
              type: string
              format: date-time
        credential:
          $ref: "#/components/schemas/Credential"
    CredentialRef:
      type: object
      required: [kind, workflowId]
      properties:
        kind:
          type: string
          enum: [draft, version, execution, trigger]
        workflowId:
          type: string
        workflowSlug:
          type: string
        workflowName:
          type: string
        versionId:
          type: string
        versionNumber:
          type: integer
        executionId:
          type: string
        executionStatus:
          type: string
    CredentialUsage:
      type: object
      required: [credentialId, drafts, versions, executions, triggers]
      properties:
        credentialId:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        lastUsedBy:
          type: string
        useCount:
          type: integer
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
        executions:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
        triggers:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
    CredentialDeletionImpact:
      type: object
      required: [credentialId, displayName, status, canDelete, drafts, versions, activeExecutions, triggers]
      properties:
        credentialId:
          type: string
        displayName:
          type: string
        status:
          type: string
        canDelete:
          type: boolean
        blockReason:
          type: string
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
        activeExecutions:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
        triggers:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
    CredentialEvent:
      type: object
      required: [id, credentialId, eventType, details, occurredAt]
      properties:
        id:
          type: string
        credentialId:
          type: string
        eventType:
          type: string
        actorId:
          type: string
        details:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
    CredentialEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CredentialEvent"
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Applied page size. Default 50. Always present.
        cursor:
          type: string
          description: Opaque keyset token that produced this page. Empty on the first page. Always present.
        next:
          type: string
          description: Opaque token for the following page. Empty when this page is the last. Always present.
    IsolationKind:
      type: string
      enum: [credential, artifact, job, cache, realtime, audit]
    WorkspaceRecord:
      type: object
      required: [workspace_id, id, kind, name, created_at]
      properties:
        workspace_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/IsolationKind"
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    WorkspaceRecordList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceRecord"
    WorkspaceRecordLink:
      type: object
      required: [workspace_id, id, parent_id, kind, created_at]
      properties:
        workspace_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/IsolationKind"
        created_at:
          type: string
          format: date-time
    CacheValue:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
    PermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                type: string
  responses:
    InvalidWorkflow:
      description: Workflow YAML failed parse, normalization, or graph validation
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:invalid-workflow
            title: Invalid Workflow
            status: 400
            detail: The workflow definition is not valid.
            instance: /api/v1/workflows/validate
            code: invalid-workflow
            request_id: 0123456789abcdef0123456789abcdef
            errors:
              - path: spec.edges[0].from
                line: 24
                column: 11
                code: cycle
                message: Workflow graph contains a cycle.
    InvalidRequest:
      description: Malformed JSON, missing body, or unsupported Content-Type
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:invalid-request
            title: Invalid Request
            status: 400
            detail: Request body is not valid JSON.
            instance: /api/v1/example
            code: invalid-request
            request_id: 0123456789abcdef0123456789abcdef
    Unauthenticated:
      description: Missing or invalid credentials
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:unauthenticated
            title: Unauthenticated
            status: 401
            detail: Authentication is required.
            instance: /api/v1/example
            code: unauthenticated
            request_id: 0123456789abcdef0123456789abcdef
    Forbidden:
      description: Authenticated caller is not authorized
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:forbidden
            title: Forbidden
            status: 403
            detail: You are not authorized to perform this action.
            instance: /api/v1/example
            code: forbidden
            request_id: 0123456789abcdef0123456789abcdef
    ApprovalDecideForbidden:
      description: >
        forbidden: the caller lacks approval.decide, is the run's requester
        (self-approval, including an admin requester), or fails the gate's
        role check. approver_not_targeted: the gate is targeted and the caller
        is not a snapshot user, not a live member of a snapshot group, and not
        a workspace admin. Nothing is recorded and the gate keeps waiting.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            forbidden:
              summary: Missing permission, self-approval, or role mismatch
              value:
                type: urn:flowforge:problem:forbidden
                title: Forbidden
                status: 403
                detail: You are not authorized to perform this action.
                instance: /api/v1/approvals/00000000-0000-4000-8000-000000000001/decide
                code: forbidden
                request_id: 0123456789abcdef0123456789abcdef
            notTargeted:
              summary: The caller is not a targeted approver
              value:
                type: urn:flowforge:problem:approver_not_targeted
                title: Forbidden
                status: 403
                detail: You are not an approver for this gate.
                instance: /api/v1/approvals/00000000-0000-4000-8000-000000000001/decide
                code: approver_not_targeted
                request_id: 0123456789abcdef0123456789abcdef
    ScimTokenAdminForbidden:
      description: >
        forbidden: the caller lacks workspace.administer in this workspace,
        or is an embed session. mfa-required: a local-login or OIDC session
        has not enrolled or not verified TOTP in this session.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            forbidden:
              summary: Not a workspace administrator, or an embed session
              value:
                type: urn:flowforge:problem:forbidden
                title: Forbidden
                status: 403
                detail: You are not authorized to perform this action.
                instance: /api/v1/workspace/scim-tokens
                code: forbidden
                request_id: 0123456789abcdef0123456789abcdef
            mfaRequired:
              summary: TOTP step-up required
              value:
                type: urn:flowforge:problem:mfa-required
                title: MFA Required
                status: 403
                detail: Verify MFA before using this permission.
                instance: /api/v1/workspace/scim-tokens
                code: mfa-required
                request_id: 0123456789abcdef0123456789abcdef
    ScimTokenLimit:
      description: >
        The workspace already has two active SCIM tokens. Revoke one first.
        A create that loses a race for the last slot gets the same answer.
        Nothing is stored.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:scim_token_limit
            title: Conflict
            status: 409
            detail: This workspace already has 2 active SCIM tokens. Revoke one before creating another.
            instance: /api/v1/workspace/scim-tokens
            code: scim_token_limit
            request_id: 0123456789abcdef0123456789abcdef
    GroupNameTaken:
      description: >
        Another group in this workspace already has this display name,
        compared without regard to case. Concurrent creates or renames that
        race on the unique index also return this code. errors[].path is
        displayName.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:group_name_taken
            title: Conflict
            status: 409
            detail: A group with this name already exists in the workspace.
            instance: /api/v1/workspace/groups
            code: group_name_taken
            request_id: 0123456789abcdef0123456789abcdef
            errors:
              - path: displayName
                code: group_name_taken
                message: A group with this name already exists in the workspace.
    GroupManagedBySCIM:
      description: >
        group_managed_by_scim: the group has managedBy "scim" and the
        instance runs SCIM_GROUPS_MODE=groups, so a local rename, member
        add or remove, or delete is refused. Nothing changes. Change the
        group in the identity provider. After the instance switches back
        to SCIM_GROUPS_MODE=workspaces the same request is allowed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:group_managed_by_scim
            title: Conflict
            status: 409
            detail: This group is managed by SCIM. Change it in the identity provider.
            instance: /api/v1/workspace/groups/00000000-0000-4000-8000-000000000000
            code: group_managed_by_scim
            request_id: 0123456789abcdef0123456789abcdef
    RenameGroupConflict:
      description: >
        group_name_taken: another group in this workspace already has this
        display name, compared without regard to case (including a rename
        that loses a race on the unique index); errors[].path is
        displayName. group_managed_by_scim: the group has managedBy "scim"
        and the instance runs SCIM_GROUPS_MODE=groups; nothing changes.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:group_managed_by_scim
            title: Conflict
            status: 409
            detail: This group is managed by SCIM. Change it in the identity provider.
            instance: /api/v1/workspace/groups/00000000-0000-4000-8000-000000000000
            code: group_managed_by_scim
            request_id: 0123456789abcdef0123456789abcdef
    AddGroupMemberInvalid:
      description: >
        group_member_not_in_workspace: the user is not an active member of
        this workspace (no role binding here, a disabled account, or an
        unknown user id). invalid-request: malformed JSON, a missing body,
        or a userId that is not a UUID. Both set errors[].path to userId,
        except a malformed or missing body, which has no errors[].
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notInWorkspace:
              summary: The user is not an active member of this workspace
              value:
                type: urn:flowforge:problem:group_member_not_in_workspace
                title: Invalid Request
                status: 400
                detail: The user is not an active member of this workspace.
                instance: /api/v1/workspace/groups/3f1c2a4e-9d7b-4c1a-8e2f-0a1b2c3d4e5f/members
                code: group_member_not_in_workspace
                request_id: 0123456789abcdef0123456789abcdef
                errors:
                  - path: userId
                    code: group_member_not_in_workspace
                    message: The user is not an active member of this workspace.
            invalidUserId:
              summary: userId is not a UUID
              value:
                type: urn:flowforge:problem:invalid-request
                title: Invalid Request
                status: 400
                detail: userId must be a UUID.
                instance: /api/v1/workspace/groups/3f1c2a4e-9d7b-4c1a-8e2f-0a1b2c3d4e5f/members
                code: invalid-request
                request_id: 0123456789abcdef0123456789abcdef
                errors:
                  - path: userId
                    code: invalid-request
                    message: userId must be a UUID.
    Conflict:
      description: Unique identity collision or last-admin protection
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:conflict
            title: Conflict
            status: 409
            detail: A unique identity already exists.
            instance: /api/v1/workspaces
            code: conflict
            request_id: 0123456789abcdef0123456789abcdef
    WorkflowSlugConflict:
      description: >
        Create or YAML import asked for a slug another workflow already holds.
        workflow_slug_taken is a live workflow. workflow_slug_reserved is a
        soft-deleted workflow. Both set errors[].path to slug and may carry
        suggestedSlug. conflict is not used for slug clashes.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            taken:
              summary: A live workflow holds the slug
              value:
                type: urn:flowforge:problem:workflow_slug_taken
                title: Conflict
                status: 409
                detail: A workflow with this slug already exists.
                instance: /api/v1/workflows
                code: workflow_slug_taken
                request_id: 0123456789abcdef0123456789abcdef
                suggestedSlug: orders-sync-3
                errors:
                  - path: slug
                    code: workflow_slug_taken
                    message: A workflow with this slug already exists.
            reserved:
              summary: A soft-deleted workflow holds the slug
              value:
                type: urn:flowforge:problem:workflow_slug_reserved
                title: Conflict
                status: 409
                detail: This slug is reserved by a deleted workflow.
                instance: /api/v1/workflows
                code: workflow_slug_reserved
                request_id: 0123456789abcdef0123456789abcdef
                suggestedSlug: orders-sync-3
                errors:
                  - path: slug
                    code: workflow_slug_reserved
                    message: This slug is reserved by a deleted workflow.
    FolderNotEmpty:
      description: Folder still has child folders or workflows. Never cascade-deletes workflows.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                required: [workflowCount, childFolderCount]
                properties:
                  workflowCount: {type: integer}
                  childFolderCount: {type: integer}
          example:
            type: urn:flowforge:problem:conflict
            title: Conflict
            status: 409
            detail: Move or delete contents first.
            instance: /api/v1/workflow-folders/11111111-1111-4111-8111-111111111111
            code: conflict
            request_id: 0123456789abcdef0123456789abcdef
            workflowCount: 2
            childFolderCount: 1
    NotFound:
      description: The requested path does not exist
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:not-found
            title: Not Found
            status: 404
            detail: The requested path does not exist.
            instance: /api/v1/missing
            code: not-found
            request_id: 0123456789abcdef0123456789abcdef
    MethodNotAllowed:
      description: HTTP method is not allowed for this path
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Allow:
          schema:
            type: string
            example: GET, HEAD
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:method-not-allowed
            title: Method Not Allowed
            status: 405
            detail: The POST method is not allowed for this path.
            instance: /api/v1/health
            code: method-not-allowed
            request_id: 0123456789abcdef0123456789abcdef
    RequestTooLarge:
      description: Request body exceeds 1048576 bytes
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:request-too-large
            title: Request Too Large
            status: 413
            detail: The request body exceeds the 1048576 byte limit.
            instance: /api/v1/health
            code: request-too-large
            request_id: 0123456789abcdef0123456789abcdef
    RateLimited:
      description: |
        Rate or concurrency limit exceeded. `Retry-After` is seconds.
        Workspace quotas cover mutating routes, expensive lists, artifact
        downloads, and execution starts. Login, embed mint/exchange, and
        machine token keep separate budgets. Webhook ingress keeps its own limit.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:rate-limited
            title: Rate Limited
            status: 429
            detail: Webhook rate or concurrency limit was exceeded.
            instance: /api/v1/hooks/wh_example
            code: rate-limited
            request_id: 0123456789abcdef0123456789abcdef
    InternalError:
      description: Unexpected server failure
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:internal-error
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred.
            instance: /api/v1/health
            code: internal-error
            request_id: 0123456789abcdef0123456789abcdef
    ApprovalRequirementUnavailable:
      description: |
        The pinned approval requirement could not be rebuilt because of a database, network, or timeout failure.
        Retry-After is 5 seconds. Nothing is recorded and the approval is unchanged.
        The problem document has no errors array.
      headers:
        Retry-After:
          description: Seconds to wait before retrying. Always 5 for this response.
          schema:
            type: integer
            example: 5
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:approval_requirement_unavailable
            title: Service Unavailable
            status: 503
            detail: The approval requirement could not be rebuilt. Retry.
            instance: /api/v1/approvals/00000000-0000-4000-8000-000000000001/decide
            code: approval_requirement_unavailable
            request_id: 0123456789abcdef0123456789abcdef
    DependencyUnavailable:
      description: Required dependency is not configured or reachable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:flowforge:problem:dependency-unavailable
            title: Dependency Unavailable
            status: 503
            detail: Credential encryption key is not configured.
            instance: /api/v1/credentials
            code: dependency-unavailable
            request_id: 0123456789abcdef0123456789abcdef
    ScimTokenCreateUnavailable:
      description: >
        scim_not_configured: SCIM is off on the instance (no SCIM_*
        variable set), so a token could not provision anyone. A platform
        operator must turn it on (SCIM_ISSUER is enough). dependency-unavailable: the store is not
        reachable. Nothing is stored in either case.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notConfigured:
              summary: SCIM is off on this instance
              value:
                type: urn:flowforge:problem:scim_not_configured
                title: Service Unavailable
                status: 503
                detail: SCIM is not configured on this instance.
                instance: /api/v1/workspace/scim-tokens
                code: scim_not_configured
                request_id: 0123456789abcdef0123456789abcdef
            unavailable:
              summary: Store not reachable
              value:
                type: urn:flowforge:problem:dependency-unavailable
                title: Dependency Unavailable
                status: 503
                detail: SCIM token store is not available.
                instance: /api/v1/workspace/scim-tokens
                code: dependency-unavailable
                request_id: 0123456789abcdef0123456789abcdef
