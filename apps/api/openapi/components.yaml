    CreateWorkflowRequest:
      type: object
      required: [definitionYaml]
      properties:
        slug:
          type: string
          description: >
            Optional on create. Precedence is this field, then metadata.slug
            in definitionYaml, then a slug derived from name (or from
            metadata.name when name is omitted). Derivation lowercases the
            name, replaces each run of characters that are not letters or
            digits with one hyphen, trims hyphens, prefixes a leading digit
            with w-, and caps the length at 63, dropping a trailing hyphen
            after the cap. An empty result becomes workflow. A derived slug
            that is reserved (catalog, validate, normalize) or already taken,
            including by a soft-deleted workflow, takes the next numeric
            suffix after the highest one already used for that base (base or
            base-N, live or deleted). The length cap trims the base before the
            suffix. A new slug, explicit or derived, must not start or end
            with a hyphen or contain two hyphens in a row; otherwise the
            response is 400 invalid-request with errors[].path slug. An
            explicit slug is never rewritten. A live clash is 409
            workflow_slug_taken and a tombstone clash is 409
            workflow_slug_reserved. Both set errors[].path to slug and carry
            suggestedSlug when one can be built. The chosen slug is written back to metadata.slug in
            the stored YAML and stays stable on later renames.
        name:
          type: string
          description: >
            Optional display name. When set, it is stored on the workflow
            row and is the name a derived slug is taken from. metadata.name
            in the YAML is left as submitted.
        definitionYaml:
          type: string
        folderId:
          type: string
          format: uuid
          nullable: true
          description: Optional. Missing or null files the workflow as Unfiled.
    WorkflowFolder:
      type: object
      required: [id, workspaceId, parentId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
          description: Server-derived. Never accepted from the client on writes.
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Null is a top-level folder.
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkflowFolderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowFolder"
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Applied page size. Default 50. Always present.
        cursor:
          type: string
          description: Opaque keyset token that produced this page. Empty on the first page. Always present.
        next:
          type: string
          description: Opaque token for the following page. Empty when this page is the last. Always present.
    CreateWorkflowFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
    UpdateWorkflowFolderRequest:
      type: object
      properties:
        name:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Null re-parents to top-level. Omit to leave unchanged.
    MoveWorkflowFolderRequest:
      type: object
      properties:
        folderId:
          type: string
          format: uuid
          nullable: true
          description: Null or omitted moves the workflow to Unfiled.
    SaveDraftRequest:
      type: object
      required: [revision, definitionYaml]
      properties:
        revision:
          type: integer
          format: int64
        definitionYaml:
          type: string
          description: >
            metadata.slug cannot change through a draft save. When it matches
            metadata.slug in the stored draft, equals the stored workflow slug,
            or is missing, the stored workflow slug is written back into
            metadata.slug. When this save changes it to anything else,
            the response is 400 slug_immutable with errors[].path slug. The
            stored slug is never re-validated on save, so a legacy slug keeps
            saving.
    PublishWorkflowRequest:
      type: object
      properties:
        revision:
          type: integer
          format: int64
          description: Optional optimistic lock against the current draft revision
        note:
          type: string
