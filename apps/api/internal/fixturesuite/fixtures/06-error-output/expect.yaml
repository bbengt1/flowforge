id: 06-error-output
drivers: [compose, runner]
cases:
  - name: today-fail-stops      # green since #664
    file: workflow.yaml
    run: {status: [failed]}
    steps:
      seed:  {status: succeeded}
      boom:  {status: failed, error: {code: fixture.boom, message: planned failure}}   # message in error field, not output
      after: {status: skipped, skipReason: upstream_failed}   # #660 (#664)
    noStepStatusIn: [pending, blocked]
    audit: {execution.start: 1, job.claim: 2, job.complete: 1, job.fail: 1, job.recover: 0}
  - name: guard-plain-fail      # green today: plain flow.fail, no onError
    file: workflow.yaml
    run: {status: [failed]}
    steps:
      boom:  {status: failed, errorHandling: none}
      after: {status: skipped, skipReason: upstream_failed}
    noStepStatusIn: [pending, blocked]
  - name: error-output
    file: errout.workflow.yaml
    actions: [start, drive, retry-refused]
    run: {status: [succeededWithErrors]}
    steps:
      # Chloe: handled gets exactly the error payload. Step input is the
      # node's own with, so the delivered payload is asserted on boom's
      # error port (outputExact), which is what feeds handled.input.
      boom:    {status: failed, errorHandling: errorOutput, error: {code: fixture.boom, message: planned failure}, outputExact: {error: {code: fixture.boom, message: planned failure, nodeId: boom, attempt: 1}}}
      handled: {status: succeeded}
      after:   {status: skipped, skipReason: branch_not_taken}
    noStepStatusIn: [pending, blocked]
    errorWorkflowFires: false
    audit: {execution.start: 1, job.fail: 1, step.error_routed: 1}
  - name: continue
    file: continue.workflow.yaml
    actions: [start, drive, retry-refused]
    run: {status: [succeededWithErrors]}
    steps:
      # Chloe: next gets {}; asserted on boom's main port (outputExact).
      boom:     {status: failed, errorHandling: continue, error: {code: fixture.cont}, outputExact: {result: {}}}
      next:     {status: succeeded}
    noStepStatusIn: [pending, blocked]
    errorWorkflowFires: false
    audit: {execution.start: 1, job.fail: 1, step.error_routed: 1}
  - name: pinned-version         # a run keeps v1's onError after v2 is published
    file: errout.workflow.yaml
    actions: [start, publish-v2: pinned.v2.workflow.yaml, drive]
    run: {status: [succeededWithErrors]}
    steps:
      boom: {status: failed, errorHandling: errorOutput}
