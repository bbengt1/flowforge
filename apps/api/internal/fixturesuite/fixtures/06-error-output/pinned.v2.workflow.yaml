apiVersion: flowforge/v1
kind: Workflow
# v2 of the pinned-version case: onError: stop. An error edge requires
# onError: errorOutput at save, so v2 drops the error edge and its handler
# (a v2 identical to v1 would be refused as already published). A run
# started on v1 must still route through v1's errorOutput.
metadata:
  name: e0-06-error-output
spec:
  triggers:
    - {id: manual, type: manual}
  nodes:
    - {id: seed, type: data.set, name: Seed, with: {value: {env: staging}}}
    - {id: boom, type: flow.fail, name: Boom, onError: stop, with: {code: fixture.boom, message: planned failure}}
    - {id: after, type: flow.stop, name: Main edge, with: {status: success}}
  edges:
    - {from: seed.result, to: boom.input}
    - {from: boom.result, to: after.input}
