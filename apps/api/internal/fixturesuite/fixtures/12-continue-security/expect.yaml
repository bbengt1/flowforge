id: 12-continue-security
drivers: [compose, runner]
# Gracie's H1 on #667: onError must never route a security failure. Codes are
# the ones workflowhttp/dispatch.go writes on a script re-check failure
# (scripts.CodeArtifact* default plus scriptEngineError codes), listed one by
# one (no prefix wildcard). Expected values: plain failed, run failed, no
# step.error_routed (Gracie's H1 / Arie's smoke ask); next as in 06 today.
cases:
  - name: emergency-stopped
    patch: {"spec.nodes[1].with.code": emergency-stopped}
    today:                      # onError is not publishable until #649 S2 (#667)
      save: {status: 201}
      publishGuards:
        - {patch: {}, status: 400, code: invalid-workflow, errors: [{code: on-error-not-yet-supported}]}
    target:
      actions: [start, drive]
      run: {status: [failed]}
      steps:
        boom: {status: failed, errorHandling: none, error: {code: emergency-stopped}}
        next: {status: skipped, skipReason: upstream_failed}
      noStepStatusIn: [pending, blocked]
      errorWorkflowFires: false
      audit: {job.fail: 1, step.error_routed: 0}
    xfail:
      - {part: emergency-stopped, reason: "onError continue is not publishable before #649 S2 (#667); at 34993b2 routableFailure still routes this code (Gracie H1)", issue: "#649 S2", drivers: [all]}

