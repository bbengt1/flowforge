id: 03-switch4
drivers: [compose, runner]
publish: {status: 201}
cases:
  - name: gold                 # as written (tier: gold)
    run: {status: [succeeded]}
    steps:
      route:      {status: succeeded}
      out-gold:   {status: succeeded, output: {result: {status: success, message: gold}}}
      out-bronze: {status: skipped, skipReason: branch_not_taken}
      out-silver: {status: skipped, skipReason: branch_not_taken}
      out-other:  {status: skipped, skipReason: branch_not_taken}
  - name: bronze
    patch: {"spec.nodes[0].with.value.tier": bronze}
    run: {status: [succeeded]}
    steps:
      out-bronze: {status: succeeded, output: {result: {status: success, message: bronze}}}
      out-gold:   {status: skipped, skipReason: branch_not_taken}
  - name: silver
    patch: {"spec.nodes[0].with.value.tier": silver}
    run: {status: [succeeded]}
    steps:
      out-silver: {status: succeeded, output: {result: {status: success, message: silver}}}
      out-gold:   {status: skipped, skipReason: branch_not_taken}
  - name: default
    patch: {"spec.nodes[0].with.value.tier": tin}
    run: {status: [succeeded]}
    steps:
      out-other:  {status: succeeded, output: {result: {status: success, message: other}}}
      out-gold:   {status: skipped, skipReason: branch_not_taken}
audit: {execution.start: 1, job.claim: 3, job.complete: 3, job.fail: 0}  # skipped branches: no claim
xfail: []
