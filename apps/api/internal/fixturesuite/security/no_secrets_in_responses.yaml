id: no_secrets_in_responses
source: terry/epic0-fixtures/security/no_secrets_in_responses.yaml (DESIGN-650 T5; UI scan is S4)
description: >
  Canary secrets (credential plaintext, webhook secret) never appear in any
  API response body or header captured while the world is seeded and the
  checks run (suite calls and compose worker traffic), nor in step output,
  audit details or run status reasons. Substring, base64 and URL-encoded.
drivers: [compose, runner]
checks:
  - name: data-set-password-refused
    kind: guard
    fixture: 01-linear/workflow.yaml
    patch: {"spec.nodes[0].with.value.password": not-a-real-password}
    status: 400
  - name: canary-api-db
    kind: canary-scan
    canaries: [CRED, WHSEC]
    scan: [api, db]
    forms: [substring, base64, urlencoded]
    hits: 0
