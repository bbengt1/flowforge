<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="title desc">
  <title id="title">Expired approval banner with decide disabled</title>
  <desc id="desc">/approvals expired row: ApprovalValidityBanner plus disabled Approve/Reject.</desc>
  <rect width="880" height="340" fill="#f4f4f5"/>
  <rect x="24" y="20" width="832" height="300" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="44" y="52" fill="#18181b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600">Approvals</text>
  <text x="44" y="76" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">/approvals · ApprovalValidityBanner + ApprovalDecideControls</text>
  <rect x="44" y="96" width="792" height="100" rx="10" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="64" y="124" fill="#4c0519" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Approval expired</text>
  <text x="64" y="146" fill="#4c0519" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">This approval has expired. A new server-side evaluation is required.</text>
  <text x="64" y="176" fill="#9f1239" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Authorization is rechecked on the server. Approve and reject stay disabled until a new evaluation produces a current pending request.</text>
  <rect x="44" y="216" width="120" height="36" rx="8" fill="#115e59" opacity="0.45"/>
  <text x="70" y="238" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Approve</text>
  <rect x="176" y="216" width="120" height="36" rx="8" fill="#ffffff" stroke="#d4d4d8" opacity="0.7"/>
  <text x="210" y="238" fill="#3f3f46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Reject</text>
  <text x="44" y="280" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">canDecideApproval=false · approveDisabled=true · rejectDisabled=true. Server decide is still 409 if forced.</text>
</svg>
