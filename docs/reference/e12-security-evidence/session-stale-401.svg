<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-labelledby="title desc">
  <title id="title">Existing stale session chrome after 401</title>
  <desc id="desc">GET /session 401 latches SessionExpiryBanner and SessionStatusChip. No new chrome.</desc>
  <rect width="880" height="280" fill="#f4f4f5"/>
  <rect x="24" y="20" width="832" height="240" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="44" y="52" fill="#18181b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">FlowForge embed</text>
  <text x="200" y="52" fill="#b91c1c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">session.embed missing  host query is not chrome authority</text>
  <rect x="700" y="34" width="132" height="28" rx="14" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="722" y="52" fill="#78350f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Session stale</text>
  <rect x="44" y="80" width="788" height="88" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="64" y="108" fill="#78350f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Stale session</text>
  <text x="64" y="132" fill="#78350f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">The control plane returned 401 unauthenticated. Re-establish a cookie session. Header identity is not used while a stale session is latched.</text>
  <text x="44" y="200" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Existing SessionExpiryBanner + SessionStatusChip. Workspace-delete revoke and idle/absolute expiry are the same 401 latch  no new chrome.</text>
  <text x="44" y="224" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Expired (still active locally): Session expired / ada · Session expired.</text>
</svg>
