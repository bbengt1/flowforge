# Local stack for E1.1 (docs/deployment.md):
#   docker compose up --build
#
# Services:
#   web      — Next.js UI (this PR). Build context ./apps/web.
#   api      — Go control plane (PR #2). Build context ./apps/api;
#              listens on HTTP_ADDR=:8080.
#   postgres — local PostgreSQL. Password comes from .env only.
#
# Published ports (host):
#   UI   http://localhost:3000
#   API  http://localhost:8080/api/v1/health
#        http://localhost:8080/api/v1/readiness

name: flowforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy env-template.txt)}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    # Image and module owned by the API slice. Listen addr is HTTP_ADDR.
    # Hardening matches deploy/k8s (UID 65532, read-only FS, dropped caps).
    # Web image/compose alignment is owned by the UI teammate.
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: flowforge-api:local
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    image: flowforge-web:local
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      API_INTERNAL_URL: http://api:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
