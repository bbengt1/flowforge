# Local stack for E1.1 (docs/deployment.md):
#   docker compose up --build
#
# Services:
#   web      — Next.js UI (Chloe). Image built from apps/web.
#   api      — Go control plane (jonny). Build context is apps/api;
#              replace the placeholder Dockerfile with the real Go image.
#   postgres — local PostgreSQL. Password comes from .env only.
#
# Published ports (host):
#   UI   http://localhost:3000
#   API  http://localhost:8080/api/v1/health
#        http://localhost:8080/api/v1/readiness

name: flowforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy env-template.txt)}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    # jonny: replace apps/api/Dockerfile with the multi-stage Go build.
    # Expected process: listen on :8080 (or $API_ADDR) and serve
    # GET /api/v1/health and GET /api/v1/readiness.
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: flowforge-api:local
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      API_ADDR: ${API_ADDR:-:8080}
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    image: flowforge-web:local
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      API_INTERNAL_URL: http://api:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
