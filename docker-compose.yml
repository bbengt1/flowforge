# Local stack (docs/deployment.md):
#   docker compose up --build
#
# Services:
#   web      — Next.js UI. Repo-root context, apps/web/Dockerfile (lockfile).
#              UID 65532, read-only root, tmpfs, cap_drop, no-new-privileges,
#              resource limits, secure headers.
#   api      — Go control plane. Build context ./apps/api; HTTP_ADDR=:8080.
#              Hardening from E1.3 #10 (UID 65532, read-only, caps, tmpfs,
#              mem/cpu/pid limits). HEALTHCHECK GET /api/v1/health.
#              Matches deploy/k8s.
#   worker   — Local/dev job runner. Same image as api, command worker.
#              Claims POST /api/v1/jobs/claim (lease + HMAC ticket + fence).
#              Required for Start published to leave queued. Not a k8s service.
#              Provider nodes stay fail-closed here. Production uses
#              /usr/local/bin/runner (deploy/k8s), which refuses this path.
#              Opt out: docker compose up --scale worker=0  or  LOCAL_WORKER=0
#   postgres — local PostgreSQL. Password comes from .env only.
#              Backup encryption + restore rehearsal: scripts/backup/.
#   minio    — local S3-compatible artifact store (G.1.5). Volume
#              minio_data keeps ciphertext across API restarts.
#              Local-only root credentials. Do not copy them to deploy/k8s.
#
# Published ports (host):
#   UI    http://localhost:3000
#   API   http://localhost:8080/api/v1/health
#         http://localhost:8080/api/v1/readiness
#   MinIO http://localhost:9000  (console http://localhost:9001)

name: flowforge

# Shared least-privilege defaults. Postgres is not merged into this anchor:
# the official image starts as root then drops, and cap_drop ALL breaks that.
x-security: &security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy env-template.txt)}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    # Image and module owned by the API slice (#10). Listen addr is HTTP_ADDR.
    # Hardening matches deploy/k8s (UID 65532, read-only FS, dropped caps).
    <<: *security
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        # G.0.10: bake commit identity into GET /api/v1/health.
        # CI sets BUILD_SHA=${{ github.sha }}. Local:
        #   BUILD_SHA=$(git rev-parse HEAD) docker compose up --build
        BUILD_SHA: ${BUILD_SHA:-unknown}
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    image: flowforge-api:local
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # Runtime override of image ldflags. Empty keeps the baked value.
      # Do not put secrets here — health publishes version/sha as-is
      # after a conservative allowlist (hex SHA / short tag).
      BUILD_SHA: ${BUILD_SHA:-}
      BUILD_VERSION: ${BUILD_VERSION:-}
      # G.0.11: session GUCs on every app-pool checkout. Go durations.
      STATEMENT_TIMEOUT: ${STATEMENT_TIMEOUT:-15s}
      LOCK_TIMEOUT: ${LOCK_TIMEOUT:-5s}
      # Browser sessions (E2.3). UI is http://localhost:3000; API is :8080.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-30m}
      SESSION_ABSOLUTE_TIMEOUT: ${SESSION_ABSOLUTE_TIMEOUT:-12h}
      # Local-only vault KEK so compose seed can write demo credentials.
      # 32-byte ASCII "flowforge-local-dev-kek-32bytes!" as base64.
      # Generate your own with: openssl rand -base64 32
      # Do not copy this default into deploy/k8s.
      CREDENTIAL_KEK: ${CREDENTIAL_KEK:-Zmxvd2ZvcmdlLWxvY2FsLWRldi1rZWstMzJieXRlcyE=}
      CREDENTIAL_KEK_ID: ${CREDENTIAL_KEK_ID:-local:compose}
      # Durable HMAC keys. Missing/malformed is a boot-fail (no per-process
      # random default). Compose uses documented local-only 32-byte ASCII
      # values as base64 so tickets/signatures survive restart. Generate
      # your own with: openssl rand -base64 32
      # Do not copy these defaults into deploy/k8s.
      # "flowforge-local-dev-job-32bytes!" / "flowforge-local-dev-scr-32bytes!"
      JOB_BINDING_SECRET: ${JOB_BINDING_SECRET:-Zmxvd2ZvcmdlLWxvY2FsLWRldi1qb2ItMzJieXRlcyE=}
      SCRIPT_SIGNING_KEY: ${SCRIPT_SIGNING_KEY:-Zmxvd2ZvcmdlLWxvY2FsLWRldi1zY3ItMzJieXRlcyE=}
      # In-process leader (G.1.3). Ticks schedule dispatch, lease recovery,
      # and retention purge. Only the replica holding advisory lock
      # 881726402 runs them — no CronJob for those three. Set 0 to opt out.
      # Invalid values are a boot-fail. Encrypted backups stay an operator job.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-1}
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-30s}
      # Durable artifact payloads (G.1.5). Ciphertext is envelope-encrypted
      # with CREDENTIAL_KEK before upload. MinIO volume survives API
      # restart. Local-only credentials — do not copy to deploy/k8s.
      # Production-locked processes refuse to start without S3 and refuse
      # ARTIFACT_S3_CREATE_BUCKET. Filesystem fallback: unset every
      # ARTIFACT_S3_* value and set ARTIFACT_STORE_DIR (non-production).
      ARTIFACT_S3_ENDPOINT: ${ARTIFACT_S3_ENDPOINT:-http://minio:9000}
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-flowforge-artifacts}
      ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-us-east-1}
      ARTIFACT_S3_ACCESS_KEY_ID: ${ARTIFACT_S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-flowforge}}
      ARTIFACT_S3_SECRET_ACCESS_KEY: ${ARTIFACT_S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-flowforge-local-dev-minio}}
      ARTIFACT_S3_USE_PATH_STYLE: ${ARTIFACT_S3_USE_PATH_STYLE:-true}
      ARTIFACT_S3_CREATE_BUCKET: ${ARTIFACT_S3_CREATE_BUCKET:-true}
      ARTIFACT_DOWNLOAD_TTL: ${ARTIFACT_DOWNLOAD_TTL:-60s}
      ARTIFACT_MAX_BYTES: ${ARTIFACT_MAX_BYTES:-1048576}
      # Local-only PKCS#8 PEM (ADV-022). Production Secret must set a unique
      # EMBED_SIGNING_KEY — the process boot-fails without one.
      # Do not copy this compose default into k8s. EMBED_SIGNING_KEY, when
      # set, wins over the mounted file.
      EMBED_SIGNING_KEY: ${EMBED_SIGNING_KEY:-}
      EMBED_SIGNING_KEY_FILE: ${EMBED_SIGNING_KEY_FILE:-/run/flowforge/embed-signing.pem}
      EMBED_SIGNING_KEY_ID: ${EMBED_SIGNING_KEY_ID:-local:compose}
      # Optional overlap JWKS. Every key requires overlapUntil (RFC3339, max 4h).
      # EMBED_OVERLAP_KEYS: ${EMBED_OVERLAP_KEYS:-}
      # Seeded local allowlists. Empty lists fail closed (403 on mint/exchange).
      # Production ConfigMap must set explicit issuers — do not copy these defaults.
      EMBED_ISSUER: ${EMBED_ISSUER:-https://idp.example}
      EMBED_ISSUER_ALLOWLIST: ${EMBED_ISSUER_ALLOWLIST:-}
      PORTAL_ISSUER: ${PORTAL_ISSUER:-https://portal.cp-ops.example}
      PORTAL_ISSUER_ALLOWLIST: ${PORTAL_ISSUER_ALLOWLIST:-}
      PORTAL_FRAME_ANCESTORS: ${PORTAL_FRAME_ANCESTORS:-}
      # Same merge as the web process (ADV-011). Catalog publishes this list.
      WEB_PORTAL_FRAME_ANCESTORS: ${WEB_PORTAL_FRAME_ANCESTORS:-}
      WEB_EMBED_FRAME_ANCESTORS: ${WEB_EMBED_FRAME_ANCESTORS:-}
      # Local/dev identity only. Production ConfigMap must omit these.
      APP_ENV: ${APP_ENV:-development}
      TRUSTED_DEV_IDENTITY_HEADERS: ${TRUSTED_DEV_IDENTITY_HEADERS:-1}
      PLATFORM_ADMINS: ${PLATFORM_ADMINS:-https://idp.example|admin-1}
      # Default on when APP_ENV is development|dev|local|test and REQUIRE_TLS
      # is false. Set 0 to skip. Do not set in deploy/k8s.
      SEED_LOCAL_DEFAULTS: ${SEED_LOCAL_DEFAULTS:-}
      # Operator-facing origin stored by localseed bootstrap skip (B.1).
      # Never returned by GET /api/v1/bootstrap. Do not copy to k8s.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # Path-2 first-run wizard B.5 destinations on the existing /tmp
      # tmpfs (read-only root; UID 65532). tlsmaterial mkdir's the
      # parent. Listen stays HTTP until both files exist (restart
      # after B.5). Lost on container recreate — production must
      # mount durable paths. Do not copy these localhost defaults
      # into deploy/k8s. Empty still fails closed (503). Never store
      # PEMs in PostgreSQL; never echo the key.
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/tmp/flowforge-tls/cert.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/tmp/flowforge-tls/key.pem}
    volumes:
      - ./deploy/local/embed-signing.pem:/run/flowforge/embed-signing.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Same probe as the image HEALTHCHECK and k8s liveness (process up).
    # Does not wait for PostgreSQL — that is GET /api/v1/readiness.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Local/dev only. Claims queued jobs so Start published can leave queued.
  # Uses the same ADV fencing / lease / jobToken contract as any worker.
  # Do not add a cmd/runner service here: production-locked APP_ENV or
  # REQUIRE_TLS makes /usr/local/bin/runner boot-fail, and this worker
  # refuses provider nodes. Production: deploy/k8s runner Deployment.
  # Opt out: --scale worker=0 or LOCAL_WORKER=0 (clean exit).
  worker:
    <<: *security
    image: flowforge-api:local
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    command: ["/usr/local/bin/worker"]
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    environment:
      API_URL: http://api:8080
      APP_ENV: ${APP_ENV:-development}
      # Explicit 1 with production APP_ENV or REQUIRE_TLS=true is a boot-fail.
      # Set 0/false/off to opt out (process exits 0 so compose stays healthy).
      LOCAL_WORKER: ${LOCAL_WORKER:-}
      WORKER_ID: ${WORKER_ID:-compose-local}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1s}
      WORKER_LEASE: ${WORKER_LEASE:-30s}
      # Same principal as the API trusted-dev / seed admin. Must have
      # workflow.execute on the workspace (PLATFORM_ADMINS membership).
      PLATFORM_ADMINS: ${PLATFORM_ADMINS:-https://idp.example|admin-1}
      WORKER_ISSUER: ${WORKER_ISSUER:-}
      WORKER_SUBJECT: ${WORKER_SUBJECT:-}
    depends_on:
      - api
    # Same image HEALTHCHECK hits :8080; this process does not listen.
    healthcheck:
      disable: true
    # on-failure so LOCAL_WORKER=0 (exit 0) stays down. Crashes still retry.
    restart: on-failure

  web:
    <<: *security
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    image: flowforge-web:local
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777,noexec,nosuid
      - /app/apps/web/.next/cache:size=128M,mode=1777,noexec,nosuid
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      API_INTERNAL_URL: http://api:8080
      WEB_HSTS: ${WEB_HSTS:-}
      WEB_CSP_CONNECT_SRC: ${WEB_CSP_CONNECT_SRC:-}
      WEB_EMBED_FRAME_ANCESTORS: ${WEB_EMBED_FRAME_ANCESTORS:-}
      WEB_PORTAL_FRAME_ANCESTORS: ${WEB_PORTAL_FRAME_ANCESTORS:-}
      # Server-only (not NEXT_PUBLIC_*). RSC passes these into the embed gate.
      EMBED_ISSUER: ${EMBED_ISSUER:-https://idp.example}
      PORTAL_ISSUER: ${PORTAL_ISSUER:-https://portal.cp-ops.example}
    depends_on:
      - api
    restart: unless-stopped

  # Local/dev S3 (G.1.5). Not merged into x-security: the image
  # starts as root. no-new-privileges matches postgres. Data volume
  # keeps artifact ciphertext when the API container is recreated.
  # Root user/password are local-only — do not copy to deploy/k8s.
  minio:
    # Last community image published to Quay. Later source tags are not
    # published as images (MinIO source-only distribution).
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flowforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flowforge-local-dev-minio}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
