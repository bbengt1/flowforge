# G.2.9 / #454. Kyverno 1.11+ ClusterPolicy.
# Enforce keyless cosign signatures and SLSA provenance v1 for FlowForge
# images, and reject a tag that is not digest-pinned.
#
# Not part of deploy/k8s (that kustomization sets a namespace; ClusterPolicy
# is cluster-scoped). Install Kyverno, then:
#   kubectl apply -k deploy/kyverno
#
# The signing identity is the main-branch supply-chain workflow only.
# A pull-request token cannot produce an admission-accepted signature.
# Missing signature, missing provenance, or a mutable tag is a deny.
# webhook failurePolicy Fail: if Kyverno cannot evaluate, the API server
# denies the pod. Rekor egress (rekor.sigstore.dev) is required.
#
# GHCR sometimes serves attestations only as the fallback tag
# sha256-<digest>, not the Referrers API. If a signed image is denied,
# confirm with the cosign / gh commands in deploy/supply-chain/policy.md
# and a Kyverno build that reads that tag. Do not switch this policy to
# Audit to hide that gap.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: flowforge-verify-images
  annotations:
    policies.kyverno.io/title: Verify FlowForge image signature and provenance
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.11.0
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-signature-digest-and-provenance
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/bbengt1/flowforge-api*"
            - "ghcr.io/bbengt1/flowforge-web*"
            - "ghcr.io/bbengt1/flowforge-script-runner*"
            - "ghcr.io/bbengt1/flowforge-backup*"
          required: true
          mutateDigest: false
          verifyDigest: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/bbengt1/flowforge/.github/workflows/supply-chain.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - predicateType: https://slsa.dev/provenance/v1
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: "https://github.com/bbengt1/flowforge/.github/workflows/supply-chain.yml@refs/heads/main"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev
