# Binds the namespace Role to the runner ServiceAccount.
# Substitute ${SERVICE_ACCOUNT} (default flowforge-runner).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flowforge-runner
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: kubernetes-runner
    app.kubernetes.io/part-of: flowforge
  annotations:
    flowforge.io/role-template: namespace-scoped-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flowforge-runner
subjects:
  - kind: ServiceAccount
    name: ${SERVICE_ACCOUNT}
