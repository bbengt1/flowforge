# Isolated short-lived script runner Job template (E9.2 / G.1.2).
#
# This file is a template, not a standing workload. Do not kubectl apply it.
# cmd/runner clones it into one batch/v1 Job per script.python / script.go
# step. Apply script-runner-networkpolicy.yaml only after substituting
# CONTROL_PLANE_API_CIDR. Do not apply this Job template.
#
# The image is built from apps/api/Dockerfile.script-runner. publish-images
# signs ghcr.io/bbengt1/flowforge-script-runner@sha256:… . This template
# keeps the :foundation tag as an identity check. The runner rewrites each
# Job to repository@sha256:<runtime profile imageDigest> before create.
# Do not replace that tag in the template (the process rejects any other
# reference) and do not kubectl apply the template. CI does not start
# these pods — go tests use scripts.HarnessRuntime or a fake Job client.
# Build and verify: docs/deployment.md#script-runner-image
#
# Guarantees:
# - non-root UID/GID 65532
# - read-only root filesystem + ephemeral /workspace
# - CPU/memory limits from the pinned runtime profile (defaults below)
# - drop ALL capabilities, no_new_privs (allowPrivilegeEscalation: false)
# - no host Docker socket, no cloud metadata, no Kubernetes SA mount
# - restartPolicy Never, backoffLimit 0 (kube does not re-run the step)
apiVersion: batch/v1
kind: Job
metadata:
  name: flowforge-script-runner
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: script-runner
    app.kubernetes.io/part-of: flowforge
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowforge
        app.kubernetes.io/component: script-runner
        app.kubernetes.io/part-of: flowforge
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          # Identity tag. The runner pins repository@imageDigest from the
          # runtime profile before create. CI rejects :latest. Do not put
          # a digest here; admission sees the rewritten Job, not this line.
          image: ghcr.io/bbengt1/flowforge-script-runner:foundation
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/scriptrunner"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
      # Explicit denials: do not add a host Docker socket, metadata routes,
      # hostPath, or serviceAccountName unless a future policy story authorizes them.
