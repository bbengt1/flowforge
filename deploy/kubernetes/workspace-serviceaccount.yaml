# Least-privilege runner identity for one workspace namespace.
# ClusterRoles are not MVP. Substitute ${SERVICE_ACCOUNT} (default flowforge-runner).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${SERVICE_ACCOUNT}
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: kubernetes-runner
    app.kubernetes.io/part-of: flowforge
  annotations:
    flowforge.io/role-template: namespace-scoped-runner
automountServiceAccountToken: true
