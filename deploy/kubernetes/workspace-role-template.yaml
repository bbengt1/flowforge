# Namespace-scoped Role for FlowForge kubernetes.apply/get/list/rolloutStatus.
# Apply once per allowed namespace. Do not widen to ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flowforge-runner
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: kubernetes-runner
    app.kubernetes.io/part-of: flowforge
  annotations:
    flowforge.io/role-template: namespace-scoped-runner
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # rolloutStatus watches Deployment/StatefulSet/DaemonSet/Job status only.
  - apiGroups: ["apps"]
    resources: ["deployments/status", "statefulsets/status", "daemonsets/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get", "list", "watch"]
