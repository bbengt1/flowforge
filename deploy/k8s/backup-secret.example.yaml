# Example only. Do not commit real credentials.
# Copy to a sealed/external secret named flowforge-backup.
# Never log these values. Do not copy compose / MinIO defaults.
apiVersion: v1
kind: Secret
metadata:
  name: flowforge-backup
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: backup
type: Opaque
stringData:
  # Same production DSN the API uses (or a least-privilege dump role).
  DATABASE_URL: postgres://flowforge:replace-me@flowforge-postgres:5432/flowforge?sslmode=require
  # Passphrase for AES-256-GCM AEAD + PBKDF2 (scripts/backup/aead.py, FFB1).
  # Wrap with KMS. Generate with: openssl rand -base64 32
  BACKUP_ENCRYPTION_KEY: replace-with-backup-passphrase
  # Durable ciphertext landing (S3-compatible). Prefer a bucket dedicated to
  # encrypted dumps — not the ARTIFACT_S3_BUCKET tenant/workspace/ref layout.
  BACKUP_S3_BUCKET: replace-with-backup-bucket
  # Optional. Empty uses the regional AWS endpoint.
  # BACKUP_S3_ENDPOINT: https://minio.example:9000
  # BACKUP_S3_REGION: us-east-1
  AWS_ACCESS_KEY_ID: replace-with-access-key-id
  AWS_SECRET_ACCESS_KEY: replace-with-secret-access-key
  # AWS_SESSION_TOKEN: replace-when-using-temporary-credentials
