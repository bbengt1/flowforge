apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowforge-runner
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: runner
    app.kubernetes.io/part-of: flowforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowforge
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowforge
        app.kubernetes.io/component: runner
        app.kubernetes.io/part-of: flowforge
    spec:
      # Cluster credentials come from the vault kubeconfig, not the pod SA.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          # Same image as the API. Replace with a digest-pinned image before production.
          # CI rejects :latest (see scripts/check-deploy-defaults.sh).
          image: ghcr.io/bbengt1/flowforge-api:foundation
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/runner"]
          env:
            - name: WORKER_ID
              value: production-runner
          envFrom:
            - configMapRef:
                name: flowforge-api
            - secretRef:
                name: flowforge-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["kill", "-0", "1"]
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
