apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowforge-runner
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: runner
    app.kubernetes.io/part-of: flowforge
spec:
  # HA floor. The HorizontalPodAutoscaler owns the live count between
  # applies (minReplicas 2). Do not lower this below 2.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowforge
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowforge
        app.kubernetes.io/component: runner
        app.kubernetes.io/part-of: flowforge
    spec:
      # No Service. Grace covers WORKER_DRAIN_TIMEOUT (30s) plus a
      # buffer so SIGTERM can finish the in-flight claim. A claim that
      # outlives the budget is left for lease recovery.
      terminationGracePeriodSeconds: 40
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: flowforge
                    app.kubernetes.io/component: runner
      # Script Jobs use this account. Customer kubeconfigs stay in the vault.
      serviceAccountName: flowforge-runner-scripts
      # Do not automount the token. A projected token is mounted below and
      # is never placed on script Job pods.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          # Same image as the API. Replace with a digest-pinned image before production.
          # CI rejects :latest (see scripts/check-deploy-defaults.sh).
          image: ghcr.io/bbengt1/flowforge-api:foundation
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/runner"]
          env:
            # Pod name, not a shared literal. Two replicas must be
            # distinct fencing holders. Not a secret.
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Finish the in-flight claim after SIGTERM. Do not start
            # another. Must stay inside terminationGracePeriodSeconds.
            - name: WORKER_DRAIN_TIMEOUT
              value: "30s"
            # Control-plane API for script Jobs. The token file is a projected
            # SA token, not a vault credential. Do not log it.
            # CONTROL_PLANE_API_CIDR (or SERVICE + NAMESPACE) comes from the
            # flowforge-api ConfigMap. Missing config refuses script Jobs.
            # Do not set SCRIPT_RUNNER_SKIP_NETWORK_POLICY on this pod.
            - name: SCRIPT_RUNNER_API_SERVER
              value: https://kubernetes.default.svc
            - name: SCRIPT_RUNNER_TOKEN_FILE
              value: /var/run/secrets/flowforge/script-runner/token
            - name: SCRIPT_RUNNER_CA_FILE
              value: /var/run/secrets/flowforge/script-runner/ca.crt
            - name: SCRIPT_RUNNER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: flowforge-api
            - secretRef:
                name: flowforge-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["kill", "-0", "1"]
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: script-runner-token
              mountPath: /var/run/secrets/flowforge/script-runner
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: script-runner-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
