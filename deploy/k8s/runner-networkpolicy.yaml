apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowforge-runner
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: runner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flowforge
      app.kubernetes.io/component: runner
  policyTypes:
    - Ingress
    - Egress
  # No ingress. The runner claims through PostgreSQL, not HTTP.
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flowforge
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  # Provider egress (Kubernetes API, SSH, HTTP) stays closed by the
  # namespace default-deny policy. Add an explicit destination CIDR
  # here when an operator allowlist is ready. Do not open 0.0.0.0/0.
