apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowforge-runner
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: runner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flowforge
      app.kubernetes.io/component: runner
  policyTypes:
    - Ingress
    - Egress
  # No ingress. The runner claims through PostgreSQL, not HTTP.
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flowforge
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  # Provider egress (Kubernetes API, SSH, HTTP) stays closed here.
  # Script Job creation dials the control-plane API. Apply
  # runner-controlplane-networkpolicy.yaml with CONTROL_PLANE_API_CIDR
  # substituted from deploy config. Do not open a world CIDR. The runner
  # refuses to create script Jobs when that CIDR or the script NetworkPolicy
  # is missing.
