# Egress for the encrypted backup CronJob. Postgres ingress is opened on
# flowforge-postgres below. Object-store egress stays closed by default —
# add an allowlisted ipBlock or pod selector for BACKUP_S3_ENDPOINT before
# production. Do not open a world CIDR.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowforge-backup
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: backup
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flowforge
      app.kubernetes.io/component: backup
  policyTypes:
    - Ingress
    - Egress
  # No Ingress — CronJob pods do not serve traffic.
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flowforge
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
