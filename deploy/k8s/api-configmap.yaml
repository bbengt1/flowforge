apiVersion: v1
kind: ConfigMap
metadata:
  name: flowforge-api
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: api
data:
  HTTP_ADDR: ":8080"
  # Production-locked. Do not set TRUSTED_DEV_IDENTITY_HEADERS here.
  # Do not set SEED_LOCAL_DEFAULTS (local compose tenant/credential seed).
  # Do not set PUBLIC_BASE_URL from compose (localhost skip); B.4/Settings.
  # Do not set LOCAL_WORKER or run /usr/local/bin/worker (compose-only).
  # Production claims use /usr/local/bin/runner (deploy/k8s/runner-deployment.yaml).
  # Set PLATFORM_ADMINS on the Secret (issuer|subject). Empty is fail-closed.
  # Required before script Jobs are created. Canonical CIDR of the control-plane
  # API, or CONTROL_PLANE_API_SERVICE plus CONTROL_PLANE_API_SERVICE_NAMESPACE.
  # Do not set a world CIDR. Do not set SCRIPT_RUNNER_SKIP_NETWORK_POLICY.
  # CONTROL_PLANE_API_CIDR: "203.0.113.10/32"
  APP_ENV: "production"
  # OIDC Authorization Code + PKCE. Leave all OIDC_* unset to fail closed.
  # Production requires https issuer and redirect. client_secret and
  # OIDC_STATE_KEY live on the Secret. No IdP-admin API.
  # OIDC_ISSUER: "https://idp.example"
  # OIDC_CLIENT_ID: "flowforge"
  # OIDC_REDIRECT_URI: "https://app.example.com/oidc/callback"
  # Ingress terminates TLS. Trust the cluster pod/service CIDRs, then require HTTPS.
  REQUIRE_TLS: "true"
  TRUSTED_PROXY_CIDRS: "10.0.0.0/8,192.168.0.0/16,172.16.0.0/12"
  POSTGRES_SSLMODE: "require"
  # Exact UI origins only. Empty = fail-closed for foreign Origin.
  # CORS_ALLOWED_ORIGINS: "https://app.example.com"
  # Required durable EMBED_SIGNING_KEY lives on the Secret (boot-fail if missing).
  # Required issuer allowlists. Empty = fail-closed (403 on embed/Portal mint and exchange).
  # EMBED_ISSUER: "https://idp.example"
  # EMBED_ISSUER_ALLOWLIST: "https://host-a.example,https://host-b.example"
  # PORTAL_ISSUER: "https://portal.example"
  # PORTAL_ISSUER_ALLOWLIST: "https://portal.example"
  SESSION_IDLE_TIMEOUT: "30m"
  SESSION_ABSOLUTE_TIMEOUT: "12h"
  # Optional. Prefer baking BUILD_SHA / BUILD_VERSION into the image
  # (Dockerfile ARG → ldflags). Runtime env overrides the baked value.
  # Health publishes only an allowlisted tag / hex SHA.
  # BUILD_SHA: "unknown"
  # BUILD_VERSION: "dev"
  # Application-pool checkout GUCs (Go durations). Defaults 15s / 5s.
  # STATEMENT_TIMEOUT: "15s"
  # LOCK_TIMEOUT: "5s"
  # Leader-elected scheduler (G.1.3). One replica holds advisory lock
  # 881726402 and ticks schedule dispatch, lease recovery, and retention
  # purge. No CronJob for those three. "false" opts out. Invalid is a boot-fail.
  # Encrypted backups are flowforge-db-backup (G.1.4), not this loop.
  SCHEDULER_ENABLED: "true"
  SCHEDULER_INTERVAL: "30s"
  # Durable artifact payloads (G.1.5 / B3). Production-locked boot
  # requires ARTIFACT_S3_BUCKET plus access key and secret on the Secret.
  # Keys are {tenant}/{workspace}/{ref} UUIDs. ARTIFACT_S3_PREFIX is
  # rejected. Do not set ARTIFACT_STORE_DIR or ARTIFACT_S3_CREATE_BUCKET here —
  # filesystem/memory stores and bucket creation are non-production and
  # the process refuses to start. Uncomment and set the endpoint for a
  # non-AWS S3 API. Empty endpoint uses the regional AWS endpoint.
  # Object-store egress is not opened by the NetworkPolicy; add an
  # allowlisted rule. Do not use 0.0.0.0/0. Never put credentials here.
  # ARTIFACT_S3_ENDPOINT: "https://s3.example"
  # ARTIFACT_S3_BUCKET: "flowforge-artifacts"
  # ARTIFACT_S3_REGION: "us-east-1"
  # ARTIFACT_S3_USE_PATH_STYLE: "false"
  # ARTIFACT_S3_SSE: "AES256"
  ARTIFACT_DOWNLOAD_TTL: "60s"
  ARTIFACT_MAX_BYTES: "1048576"
