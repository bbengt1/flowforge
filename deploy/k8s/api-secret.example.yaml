# Example only. Do not commit real credentials.
# Copy to a sealed/external secret and replace the placeholder values.
apiVersion: v1
kind: Secret
metadata:
  name: flowforge-api
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: api
type: Opaque
stringData:
  DATABASE_URL: postgres://flowforge:replace-me@flowforge-postgres:5432/flowforge?sslmode=require
  # 32-byte AES-256 as base64. Generate with: openssl rand -base64 32
  # Do not copy the compose local-only KEK (local:compose).
  CREDENTIAL_KEK: replace-with-32-byte-base64-kek
  # Required durable Ed25519 PKCS#8 PEM (ADV-022).
  # Generate with: openssl genpkey -algorithm ED25519
  # The API refuses to start in production without this (ADV-006).
  # Do not copy the compose local key.
  EMBED_SIGNING_KEY: |
    -----BEGIN PRIVATE KEY-----
    replace-with-pkcs8-pem
    -----END PRIVATE KEY-----
  EMBED_SIGNING_KEY_ID: prod:embed-1
  # Required for tenant/workspace bootstrap, metrics, OpenAPI/swagger,
  # embed key rotate, and embed.impersonate. Empty is fail-closed (403).
  # Format: comma-separated issuer|subject pairs.
  # PLATFORM_ADMINS: "https://idp.example|admin-1"
  # Required durable HMAC keys. Missing or malformed is a boot-fail
  # (no per-process random default). 32-byte base64 or 64 hex.
  # Generate with: openssl rand -base64 32
  # Do not copy the compose local-only defaults.
  JOB_BINDING_SECRET: replace-with-32-byte-base64
  SCRIPT_SIGNING_KEY: replace-with-32-byte-base64
  # S3-compatible artifact store (G.1.5). Required when the process is
  # production-locked. Never log these. Do not copy compose MinIO defaults.
  # Set ARTIFACT_S3_BUCKET (and endpoint, if not AWS) on the ConfigMap.
  ARTIFACT_S3_ACCESS_KEY_ID: replace-with-access-key-id
  ARTIFACT_S3_SECRET_ACCESS_KEY: replace-with-secret-access-key
  # ARTIFACT_S3_SESSION_TOKEN: replace-when-using-temporary-credentials
  # ARTIFACT_S3_SSE_KMS_KEY_ID: replace-when-ARTIFACT_S3_SSE=aws:kms
  # Production runner principal. Set ONE of these. Do not put a live
  # UUID that is not already a workspace member with workflow.execute.
  # RUNNER_USER_ID: "00000000-0000-4000-8000-000000000000"
  # RUNNER_ISSUER: "https://idp.example"
  # RUNNER_SUBJECT: "runner-1"
  # Optional overlap JWKS after a rotate. Every key requires overlapUntil
  # (RFC3339, max 4h) or the process boot-fails (ADV-014).
  # EMBED_OVERLAP_KEYS: '{"keys":[{"kty":"OKP","crv":"Ed25519","x":"…","kid":"prior","use":"sig","alg":"EdDSA","overlapUntil":"2026-09-09T16:00:00Z"}]}'
