# Example Postgres settings for archive_command PITR (G.2.7 / finding C3).
# Not applied by Kustomize. The in-cluster path is
# deploy/k8s/wal-archive-deployment.yaml (pg_receivewal), which does not
# require these settings.
#
# Use this file only when /usr/local/bin/archive-wal is installed on the
# Postgres host. Put BACKUP_ENCRYPTION_KEY, BACKUP_WAL_DIR, and the object
# store credentials in the server environment. Do not write them here.
# archive-wal seals each segment as FFB1 before upload. Do not cp plaintext
# WAL into the bucket.

wal_level = replica
archive_mode = on
archive_timeout = 300
archive_command = '/usr/local/bin/archive-wal %p %f'
max_wal_senders = 10
